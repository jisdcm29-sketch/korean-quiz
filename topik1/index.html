<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>TOPIK I</title>
  <style>
    :root{
      --bg:#0b1220;--card:#111827;--text:#e5e7eb;--muted:#9ca3af;--line:#243044;
      --accent:#60a5fa;
    }
    *{box-sizing:border-box}
    html,body{overflow-x:hidden}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans KR",Arial,sans-serif;
      background:linear-gradient(180deg,#050814,var(--bg));
      color:var(--text);
    }
    a{color:inherit;text-decoration:none}
    button{font-family:inherit}
    .hidden{display:none !important;}

    /* ===== Topbar ===== */
    .topbar{
      position:sticky;top:0;z-index:50;
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:12px 12px;
      background:rgba(5,8,20,.78);backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line);
    }
    .brand{display:flex;align-items:center;gap:10px;font-weight:900}
    .dot{width:10px;height:10px;border-radius:999px;background:var(--accent)}
    .right{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
    .pill{
      display:inline-flex;align-items:center;gap:8px;
      padding:8px 12px;border-radius:999px;border:1px solid var(--line);
      background:#0b1020;color:var(--muted);font-size:13px
    }

    /* ✅ 큰 버튼 + 선명한 색 */
    .btn{
      display:inline-flex;align-items:center;justify-content:center;
      border-radius:16px;border:1px solid var(--line);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      min-height:46px;
      padding:12px 16px;
      font-size:16px;
      font-weight:900;
      color:var(--text);
      background:#0b1020;
      white-space:nowrap;
    }
    .btn:hover{filter:brightness(1.06)}
    .btn:active{transform:translateY(1px)}
    .btnBack{
      background:linear-gradient(135deg,rgba(96,165,250,.22), rgba(11,16,32,.95));
      border-color:rgba(96,165,250,.55);
    }
    .btnLang{
      background:linear-gradient(135deg,rgba(52,211,153,.20), rgba(11,16,32,.95));
      border-color:rgba(52,211,153,.55);
    }
    .btnHome{
      background:linear-gradient(135deg,rgba(248,113,113,.18), rgba(11,16,32,.95));
      border-color:rgba(248,113,113,.48);
    }

    /* ===== Layout ===== */
    .container{max-width:980px;margin:0 auto;padding:12px}
    .card{
      background:rgba(17,24,39,.9);
      border:1px solid var(--line);
      border-radius:18px;
      padding:14px;
      box-shadow:0 10px 30px rgba(0,0,0,.25);
    }
    .titleRow{
      display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end
    }
    .h1{
      font-size:26px;
      font-weight:950;
      margin:0;
      letter-spacing:.2px;
    }
    .muted{color:var(--muted);line-height:1.6}
    .small{font-size:12px}
    .bar{height:1px;background:var(--line);margin:12px 0}

    /* ===== Buttons grid ===== */
    .grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px;
      margin-top:12px;
    }
    @media (min-width: 700px){
      .grid{grid-template-columns:repeat(4,1fr)}
    }

    .tile{
      display:flex;align-items:center;justify-content:center;
      text-align:center;
      padding:18px 14px;
      border-radius:18px;
      border:1px solid var(--line);
      background:#0b1020;
      min-height:92px;
      -webkit-tap-highlight-color:transparent;
      cursor:pointer;
    }
    .tile:hover{filter:brightness(1.06)}
    .tile:active{transform:translateY(1px)}
    .tileTitle{
      font-size:20px;
      font-weight:950;
      line-height:1.15;
      text-align:center;
    }
    .tileMeta{
      font-size:12px;
      margin-top:6px;
      color:rgba(229,231,235,.78);
      text-align:center;
    }

    /* category colors */
    .cat-vocab{background:linear-gradient(135deg,rgba(52,211,153,.18), rgba(11,16,32,.96));border-color:rgba(52,211,153,.46);}
    .cat-grammar{background:linear-gradient(135deg,rgba(96,165,250,.20), rgba(11,16,32,.96));border-color:rgba(96,165,250,.50);}
    .cat-reading{background:linear-gradient(135deg,rgba(251,191,36,.18), rgba(11,16,32,.96));border-color:rgba(251,191,36,.42);}
    .cat-listening{background:linear-gradient(135deg,rgba(248,113,113,.16), rgba(11,16,32,.96));border-color:rgba(248,113,113,.40);}

    /* level buttons */
    .levelBtn{
      display:flex;align-items:center;justify-content:center;
      width:100%;
      padding:16px 12px;
      border-radius:18px;
      border:1px solid var(--line);
      background:linear-gradient(135deg,rgba(96,165,250,.10), rgba(11,16,32,.96));
      border-color:rgba(96,165,250,.26);
      color:var(--text);
      font-weight:950;
      font-size:18px;
      min-height:64px;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      white-space:nowrap;
    }
    .levelBtn:hover{filter:brightness(1.06)}
    .levelBtn:active{transform:translateY(1px)}
    .levelBtn.locked{opacity:.48;cursor:not-allowed;filter:saturate(.55);background:rgba(11,16,32,.72)}
    .levelBtn.locked:hover{filter:saturate(.55)}
    .levelBtn.pass{border-color:rgba(52,211,153,.58);background:linear-gradient(135deg,rgba(52,211,153,.18),rgba(11,16,32,.96))}
    .levelMain{font-weight:950;line-height:1.25}.levelMeta{display:block;margin-top:6px;font-size:12px;color:rgba(229,231,235,.72);font-weight:800;white-space:normal}

    .err{
      border:1px solid rgba(248,113,113,.35);
      background:rgba(248,113,113,.06);
      padding:12px;border-radius:14px;
      margin-top:12px;
      color:#ffd6d6;
      white-space:pre-wrap;
    }

    /* ✅ 모바일에서 “2배 느낌” */
    @media (max-width: 520px){
      .container{padding:10px}
      .card{padding:12px}
      .right .pill{display:none}
      .btn{
        min-height:54px;
        padding:14px 18px;
        font-size:18px;
        border-radius:18px;
      }
      .h1{font-size:26px}
      .tile{min-height:96px}
      .tileTitle{font-size:22px}
      .levelBtn{min-height:70px;font-size:19px}
    }
    .tile, .tile * { color: var(--text) !important; }
    .tileTitle { color: var(--text) !important; }
    .tileMeta { color: rgba(229,231,235,.78) !important; }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <a id="brandLink" href="../index.html">Korean Quiz</a>
    </div>
    <div class="right">
      <span class="pill" id="pillName">학습자: -</span>
      <span class="pill" id="pillToken">token: -</span>

      <button class="btn btnBack" id="btnBack" type="button">←</button>
      <button class="btn btnLang" id="btnLang" type="button">KR</button>
      <a class="btn btnHome" id="btnHome" href="../index.html">홈</a>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <div class="titleRow">
        <div>
          <h1 class="h1" id="title">TOPIK I</h1>
          <div class="muted" id="subtitle">먼저 영역(버튼)을 고르고, 그 다음 레벨(1~10)을 고릅니다.</div>
        </div>
        <div class="muted small" id="status"></div>
      </div>

      <div class="bar"></div>

      <!-- CATEGORIES -->
      <div id="catWrap">
        <div class="grid" id="catGrid"></div>
      </div>

      <!-- VOCAB GROUPS -->
      <div id="groupWrap" class="hidden">
        <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center">
          <div>
            <div class="muted small" id="groupPickedLabel">선택됨</div>
            <div style="font-weight:950;font-size:22px;margin-top:4px" id="groupPickedCat">-</div>
            <div class="muted small" id="groupPickedSub" style="margin-top:2px;"></div>
          </div>
          <button class="btn" id="btnGroupReset" type="button">영역 다시 선택</button>
        </div>
        <div class="grid" id="groupGrid"></div>
      </div>

      <!-- LEVELS / COLLOCATION SETS -->
      <div id="levelWrap" class="hidden">
        <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center">
          <div>
            <div class="muted small" id="pickedLabel">선택됨</div>
            <div style="font-weight:950;font-size:22px;margin-top:4px" id="pickedCat">-</div>
            <div class="muted small" id="pickedSub" style="margin-top:2px;"></div>
          </div>
          <button class="btn" id="btnReset" type="button">영역 다시 선택</button>
        </div>

        <div class="grid" id="levelGrid"></div>
      </div>

      <div id="errBox" class="err hidden"></div>
    </section>
  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz6WBgnJXTAperJK2NwX-VwkmPEQrU4SluCcXjbmYYgcywYM2AcHZwkymBse6E9Kaqg/exec";
    const DEVICE_KEY = "kq_deviceId_v1";
    const SESSION_KEY = "kq_session_v1";
    const PASS_SCORE = 90;
    const TOPIK_PROGRESS_BOOK = "TOPIK1";

    function getDeviceId_(){
      let id = localStorage.getItem(DEVICE_KEY) || "";
      if(!id){
        id = "dev_" + Math.random().toString(16).slice(2) + "_" + Date.now().toString(16);
        localStorage.setItem(DEVICE_KEY, id);
      }
      return id;
    }

    function readLocalSession_(){
      try{
        const raw = localStorage.getItem(SESSION_KEY);
        if(!raw) return null;
        const s = JSON.parse(raw);
        if(!s || !s.name || !s.klass || !s.token) return null;
        return s;
      }catch(e){
        return null;
      }
    }

    function clearLocalSession_(){
      try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
    }

    function jsonpRequest_(baseUrl, params, timeoutMs=10000){
      return new Promise((resolve,reject)=>{
        const cb = "cb_topik1_auth_" + Date.now() + "_" + Math.floor(Math.random()*1e6);
        const script = document.createElement("script");
        let done = false;
        const cleanup = ()=>{
          try{ delete window[cb]; }catch(e){ window[cb]=undefined; }
          if(script.parentNode) script.parentNode.removeChild(script);
        };
        const timer = setTimeout(()=>{
          if(done) return; done=true; cleanup(); reject(new Error("timeout"));
        }, timeoutMs);
        window[cb] = data=>{
          if(done) return; done=true; clearTimeout(timer); cleanup(); resolve(data);
        };
        script.onerror = ()=>{
          if(done) return; done=true; clearTimeout(timer); cleanup(); reject(new Error("load_error"));
        };
        script.src = baseUrl + (baseUrl.includes("?") ? "&" : "?") +
          new URLSearchParams({...params, callback:cb}).toString();
        document.head.appendChild(script);
      });
    }

    function renderAuthBlocked_(reason){
      const main = document.querySelector("main.container");
      if(!main) return;
      const mn = getLang() === "MN";
      main.innerHTML = `
        <section class="card">
          <div style="text-align:center;padding:28px 18px">
            <div style="font-size:42px;margin-bottom:10px">🔐</div>
            <h1 class="h1" style="margin-bottom:12px">${mn ? "Нэвтрэх шаардлагатай" : "로그인이 필요합니다"}</h1>
            <div class="muted" style="line-height:1.7">${mn ? "TOPIK 1-ийг ашиглахын тулд хүчинтэй нэвтрэх эрхээр дахин нэвтэрнэ үү." : "TOPIK 1을 이용하려면 정상 인증으로 다시 로그인해야 합니다."}</div>
            <div class="muted small" style="margin-top:8px">${String(reason || "expired_or_invalid")}</div>
            <div style="margin-top:20px"><a class="btn btnHome" href="../index.html">← ${mn ? "Нэвтрэх дэлгэц рүү буцах" : "로그인 화면으로 돌아가기"}</a></div>
          </div>
        </section>`;
    }

    async function validateEntry_(){
      const u = new URL(location.href);
      const name = (u.searchParams.get("name") || "").trim();
      const klass = (u.searchParams.get("klass") || "").trim();
      const token = (u.searchParams.get("token") || "").trim();

      // TOPIK 1은 루트 로그인 세션과 URL 인증정보가 모두 정확히 일치해야 진입한다.
      // 주소창에서 token/name/klass 중 하나만 바꾸어도 기존 localStorage 세션을 재사용하지 못하게 한다.
      if(!name || !klass || !token){
        renderAuthBlocked_("missing_auth_params");
        return false;
      }

      const session = readLocalSession_();
      if(!session){
        renderAuthBlocked_("missing_local_session");
        return false;
      }

      const sameSession =
        String(session.name || "") === name &&
        String(session.klass || "") === klass &&
        String(session.token || "") === token;

      if(!sameSession){
        clearLocalSession_();
        renderAuthBlocked_("url_session_mismatch");
        return false;
      }

      try{
        const res = await jsonpRequest_(SCRIPT_URL,{
          action:"validate", token, deviceId:getDeviceId_(), name, klass
        });
        if(!res || !res.ok){
          clearLocalSession_();
          renderAuthBlocked_((res && res.error) || "expired_or_invalid");
          return false;
        }
        return true;
      }catch(e){
        renderAuthBlocked_("validation_network_error");
        return false;
      }
    }


    async function topik1Mastery_(lesson,testType){
      const u=new URL(location.href);
      return jsonpRequest_(SCRIPT_URL,{
        action:"mastery_status",
        token:(u.searchParams.get("token")||"").trim(),
        deviceId:getDeviceId_(),
        name:(u.searchParams.get("name")||"").trim(),
        book:TOPIK_PROGRESS_BOOK,
        lesson:String(lesson),
        testType:String(testType)
      });
    }

    let DEV_ACCESS_CACHE=null;
    async function topik1DeveloperAccess_(){
      if(DEV_ACCESS_CACHE!==null)return DEV_ACCESS_CACHE;
      const u=new URL(location.href);
      try{
        const r=await jsonpRequest_(SCRIPT_URL,{
          action:"learning_start",
          token:(u.searchParams.get("token")||"").trim(),
          deviceId:getDeviceId_(),
          name:(u.searchParams.get("name")||"").trim(),
          book:TOPIK_PROGRESS_BOOK
        });
        DEV_ACCESS_CACHE=!!(r&&r.ok&&(r.developerAccess||r.isDeveloper));
      }catch(e){DEV_ACCESS_CACHE=false;}
      return DEV_ACCESS_CACHE;
    }

    function isPassStatus_(r){return !!(r&&r.ok&&r.status==="PASS"&&Number(r.bestScore||0)>=PASS_SCORE);}

    const I18N = {
      KR: {
        home:"홈", loading:"불러오는 중...", loaded:"로드 완료",
        manifestFail:"manifest.json을 불러오지 못했습니다.",
        subtitle:"먼저 영역을 고르세요. 어휘는 연어 500개, 문법은 쉬운 문법부터 심화 문법까지 10단계로 학습합니다.",
        picked:"선택됨", reset:"영역 다시 선택", backVocab:"어휘로 돌아가기", learner:"학습자: ",
        catTitleMap:{vocab:"어휘", grammar:"문법", reading:"읽기평가", listening:"듣기평가"}
      },
      MN: {
        home:"Нүүр", loading:"Ачаалж байна...", loaded:"Ачааллаа",
        manifestFail:"manifest.json уншиж чадсангүй.",
        subtitle:"Эхлээд хэсгээ сонгоно уу. Үг нь 500 үгийн холбоо, дүрэм нь сууриас ахисан хүртэл 10 шаттай.",
        picked:"Сонгосон", reset:"Хэсэг дахин сонгох", backVocab:"Үг рүү буцах", learner:"Сурагч: ",
        catTitleMap:{vocab:"Үг", grammar:"Дүрэм", reading:"Унших үнэлгээ", listening:"Сонсох үнэлгээ"}
      }
    };

    function getLang(){
      const u=new URL(location.href);
      const q=(u.searchParams.get("lang")||"").toUpperCase();
      const st=(localStorage.getItem("kq_lang")||localStorage.getItem("lang")||"").toUpperCase();
      const pick=(q==="MN"||q==="KR")?q:st;
      return pick==="MN"?"MN":"KR";
    }
    function setLang(l){localStorage.setItem("kq_lang",l);localStorage.setItem("lang",l);}
    function tr(k){const L=getLang();return (I18N[L]&&I18N[L][k])?I18N[L][k]:(I18N.KR[k]||k);}
    function catTitle(id){const L=getLang();const m=(I18N[L]&&I18N[L].catTitleMap)||I18N.KR.catTitleMap;return m[id]||id;}
    function localized(o,key,fallback=""){
      const suffix=getLang()==="MN"?"_mn":"_kr";
      return o && (o[key+suffix] || o[key] || fallback) || fallback;
    }
    function getParam(k){return new URL(location.href).searchParams.get(k)||"";}
    function passthroughQS(){
      const u=new URL(location.href),p=new URLSearchParams();
      ["name","klass","token","lang"].forEach(k=>{const v=u.searchParams.get(k);if(v)p.set(k,v);});
      if(!p.get("lang"))p.set("lang",getLang());
      return p.toString();
    }
    function withQS(url){const qs=passthroughQS();return url+(qs?(url.includes("?")?"&":"?")+qs:"");}

    const brandLink=document.getElementById("brandLink"),btnHome=document.getElementById("btnHome"),btnLang=document.getElementById("btnLang"),btnBack=document.getElementById("btnBack");
    const statusEl=document.getElementById("status"),subtitleEl=document.getElementById("subtitle"),pillName=document.getElementById("pillName"),pillToken=document.getElementById("pillToken");
    const catWrap=document.getElementById("catWrap"),catGrid=document.getElementById("catGrid");
    const groupWrap=document.getElementById("groupWrap"),groupGrid=document.getElementById("groupGrid"),groupPickedLabel=document.getElementById("groupPickedLabel"),groupPickedCat=document.getElementById("groupPickedCat"),groupPickedSub=document.getElementById("groupPickedSub"),btnGroupReset=document.getElementById("btnGroupReset");
    const levelWrap=document.getElementById("levelWrap"),levelGrid=document.getElementById("levelGrid"),pickedLabel=document.getElementById("pickedLabel"),pickedCat=document.getElementById("pickedCat"),pickedSub=document.getElementById("pickedSub"),btnReset=document.getElementById("btnReset"),errBox=document.getElementById("errBox");

    let MANIFEST=null,PICKED=null,PICKED_GROUP=null;
    function showErr(msg){errBox.textContent=msg;errBox.classList.remove("hidden");}
    function clearErr(){errBox.classList.add("hidden");errBox.textContent="";}
    function catClass(id){return "cat-"+id;}

    function applyTop(){
      document.documentElement.lang=getLang()==="MN"?"mn":"ko";
      brandLink.href=withQS("../index.html");btnHome.href=withQS("../index.html");btnHome.textContent=tr("home");btnLang.textContent=getLang();
      subtitleEl.textContent=tr("subtitle");pickedLabel.textContent=tr("picked");groupPickedLabel.textContent=tr("picked");btnGroupReset.textContent=tr("reset");
      pillName.textContent=tr("learner")+(getParam("name")||"-");pillToken.textContent="token: "+(getParam("token")||"-");
      renderCats();
      if(PICKED_GROUP) renderLevels(PICKED_GROUP,true);
      else if(PICKED && Array.isArray(PICKED.groups) && PICKED.groups.length) renderGroups(PICKED);
      else if(PICKED) renderLevels(PICKED,false);
    }

    function showCats(){PICKED=null;PICKED_GROUP=null;groupWrap.classList.add("hidden");levelWrap.classList.add("hidden");catWrap.classList.remove("hidden");}
    function showGroups(){PICKED_GROUP=null;levelWrap.classList.add("hidden");catWrap.classList.add("hidden");groupWrap.classList.remove("hidden");if(PICKED)renderGroups(PICKED);}

    function renderCats(){
      if(!MANIFEST||!Array.isArray(MANIFEST.categories))return;
      catGrid.innerHTML="";
      MANIFEST.categories.forEach(c=>{
        const btn=document.createElement("button");btn.type="button";btn.className="tile "+catClass(c.id);
        btn.innerHTML=`<div><div class="tileTitle">${catTitle(c.id)}</div><div class="tileMeta">${localized(c,"subtitle",c.subtitle||"")}</div></div>`;
        btn.addEventListener("click",()=>{PICKED=c;PICKED_GROUP=null;if(Array.isArray(c.groups)&&c.groups.length)renderGroups(c);else renderLevels(c,false);});
        catGrid.appendChild(btn);
      });
    }

    function renderGroups(cat){
      PICKED=cat;
      groupPickedCat.textContent=catTitle(cat.id);groupPickedSub.textContent=localized(cat,"subtitle",cat.subtitle||"");
      groupGrid.innerHTML="";
      (cat.groups||[]).forEach(g=>{
        const btn=document.createElement("button");btn.type="button";btn.className="tile "+catClass(cat.id);
        btn.innerHTML=`<div><div class="tileTitle">${localized(g,"title",g.id)}</div><div class="tileMeta">${localized(g,"subtitle","")}</div></div>`;
        btn.addEventListener("click",()=>{PICKED_GROUP=g;renderLevels(g,true);});
        groupGrid.appendChild(btn);
      });
      catWrap.classList.add("hidden");levelWrap.classList.add("hidden");groupWrap.classList.remove("hidden");
    }

    async function renderLevels(target,isGroup){
      pickedCat.textContent=isGroup?localized(target,"title",target.id):catTitle(target.id);
      pickedSub.textContent=isGroup?localized(target,"subtitle",""):localized(target,"subtitle",target.subtitle||"");
      btnReset.textContent=isGroup?tr("backVocab"):tr("reset");
      levelGrid.innerHTML="";
      if(isGroup&&Array.isArray(target.sets)){
        const dev=await topik1DeveloperAccess_();
        const statuses=await Promise.all(target.sets.map(st=>topik1Mastery_(st.id,"collocation").catch(()=>({ok:false,bestScore:0,status:"NONE"}))));
        target.sets.forEach((st,idx)=>{
          const passed=isPassStatus_(statuses[idx]);
          const previousPassed=idx===0||isPassStatus_(statuses[idx-1]);
          const open=dev||previousPassed;
          const el=document.createElement(open?"a":"button");
          el.className="levelBtn"+(passed?" pass":"")+(open?"":" locked");
          const label=getLang()==="MN"?(st.label_mn||st.label_kr):(st.label_kr||st.label_mn);
          let meta="";
          if(dev)meta=getLang()==="MN"?"🛠 Бүх багц нээлттэй":"🛠 개발자 전체 접근";
          else if(passed)meta=getLang()==="MN"?`✅ Тэнцсэн ${Number(statuses[idx].bestScore||0)}%`:`✅ 통과 ${Number(statuses[idx].bestScore||0)}%`;
          else if(open)meta=getLang()==="MN"?"Эхлэх боломжтой":"시작 가능";
          else meta=getLang()==="MN"?`🔒 ${idx}-р багц 90% шаардлагатай`:`🔒 ${idx}세트 90% 이상 필요`;
          el.innerHTML=`<span class="levelMain">${label}</span><span class="levelMeta">${meta}</span>`;
          if(open){const u=new URL("./collocation.html",location.href);u.searchParams.set("set",String(st.id));u.searchParams.set("data",st.data);const pass=new URLSearchParams(passthroughQS());pass.forEach((v,k)=>u.searchParams.set(k,v));el.href=u.toString();}else{el.type="button";el.disabled=true;}
          levelGrid.appendChild(el);
        });
      }else if(target.id==="grammar"&&Array.isArray(target.stages)){
        const dev=await topik1DeveloperAccess_();
        const statuses=await Promise.all(target.stages.map(st=>topik1Mastery_(st.id,"grammar").catch(()=>({ok:false,bestScore:0,status:"NONE"}))));
        target.stages.forEach((st,idx)=>{
          const passed=isPassStatus_(statuses[idx]);
          const previousPassed=idx===0||isPassStatus_(statuses[idx-1]);
          const open=dev||previousPassed;
          const el=document.createElement(open?"a":"button");
          el.className="levelBtn"+(passed?" pass":"")+(open?"":" locked");
          const label=getLang()==="MN"?(st.label_mn||st.label_kr):(st.label_kr||st.label_mn);
          let meta="";
          if(dev)meta=getLang()==="MN"?"🛠 Бүх шат нээлттэй":"🛠 개발자 전체 접근";
          else if(passed)meta=getLang()==="MN"?`✅ Тэнцсэн ${Number(statuses[idx].bestScore||0)}%`:`✅ 통과 ${Number(statuses[idx].bestScore||0)}%`;
          else if(open)meta=getLang()==="MN"?"Эхлэх боломжтой":"시작 가능";
          else meta=getLang()==="MN"?`🔒 ${idx}-р шат 90% шаардлагатай`:`🔒 ${idx}단계 90% 이상 필요`;
          el.innerHTML=`<span class="levelMain">${label}</span><span class="levelMeta">${meta}</span>`;
          if(open){
            const u=new URL("./grammar.html",location.href);
            u.searchParams.set("stage",String(st.id));
            u.searchParams.set("data",st.data);
            const pass=new URLSearchParams(passthroughQS());
            pass.forEach((v,k)=>u.searchParams.set(k,v));
            el.href=u.toString();
          }else{
            el.type="button";
            el.disabled=true;
          }
          levelGrid.appendChild(el);
        });
      }else{
        const levels=Array.isArray(target.levels)?target.levels:[];
        levels.forEach((lv,idx)=>{const a=document.createElement("a");a.className="levelBtn";a.textContent=lv;const u=new URL("./level.html",location.href);u.searchParams.set("cat",target.id);u.searchParams.set("level",String(idx+1));const pass=new URLSearchParams(passthroughQS());pass.forEach((v,k)=>u.searchParams.set(k,v));a.href=u.toString();levelGrid.appendChild(a);});
      }
      catWrap.classList.add("hidden");groupWrap.classList.add("hidden");levelWrap.classList.remove("hidden");
    }

    btnGroupReset.addEventListener("click",showCats);
    btnReset.addEventListener("click",()=>{if(PICKED_GROUP)showGroups();else showCats();});
    btnBack.addEventListener("click",()=>{
      if(!levelWrap.classList.contains("hidden")){if(PICKED_GROUP)showGroups();else showCats();return;}
      if(!groupWrap.classList.contains("hidden")){showCats();return;}
      if(history.length>1)history.back();else location.href=withQS("../index.html");
    });
    btnLang.addEventListener("click",()=>{
      const next=getLang()==="KR"?"MN":"KR";setLang(next);const u=new URL(location.href);u.searchParams.set("lang",next);history.replaceState(null,"",u.toString());applyTop();
    });

    async function loadManifest(){
      clearErr();applyTop();statusEl.textContent=tr("loading");
      try{
        const url=new URL("../data/topik1/manifest.json",location.href).toString();const res=await fetch(url,{cache:"no-store"});if(!res.ok)throw new Error("HTTP "+res.status+"\n"+url);
        MANIFEST=await res.json();statusEl.textContent=tr("loaded");renderCats();
      }catch(e){statusEl.textContent="오류";showErr(tr("manifestFail")+"\n"+(e.message||e));}
    }
    (async function boot(){
      const ok = await validateEntry_();
      if(!ok) return;
      await loadManifest();
    })();
  </script>
</body>
</html>
