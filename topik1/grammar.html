<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>TOPIK I 문법</title>
  <style>
    :root{--bg:#0b1220;--card:#111827;--text:#e5e7eb;--muted:#9ca3af;--line:#243044;--accent:#60a5fa;--green:#34d399;--red:#f87171;--amber:#fbbf24}
    *{box-sizing:border-box} html,body{overflow-x:hidden}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans KR",Arial,sans-serif;background:linear-gradient(180deg,#050814,var(--bg));color:var(--text)}
    a{color:inherit;text-decoration:none} button{font:inherit}.hidden{display:none!important}
    .topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;background:rgba(5,8,20,.84);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:9px;font-weight:950}.dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
    .right{display:flex;gap:8px;align-items:center}.btn{border:1px solid var(--line);border-radius:14px;background:#0b1020;color:var(--text);font-weight:900;padding:10px 14px;min-height:44px;cursor:pointer}.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.45;cursor:default}.btnBack{border-color:rgba(96,165,250,.55)}.btnLang{border-color:rgba(52,211,153,.55)}.btnHome{border-color:rgba(248,113,113,.48)}
    .container{max-width:980px;margin:0 auto;padding:12px}.card{background:rgba(17,24,39,.92);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
    h1{font-size:26px;margin:0;font-weight:950}.sub{color:var(--muted);line-height:1.6;margin-top:5px}.stageBadge{display:inline-flex;margin-top:10px;padding:7px 11px;border:1px solid rgba(96,165,250,.4);border-radius:999px;background:rgba(96,165,250,.10);font-size:13px;font-weight:900}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}.tab{min-height:50px;border:1px solid var(--line);border-radius:15px;background:#0b1020;color:var(--muted);font-weight:950;cursor:pointer}.tab.active{color:#fff;border-color:rgba(96,165,250,.62);background:rgba(96,165,250,.15)}
    .panel{display:none;margin-top:14px}.panel.active{display:block}
    .studyNav{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}.studyPick{min-height:52px;padding:10px;border:1px solid var(--line);border-radius:13px;background:#0b1020;color:var(--text);font-weight:850;cursor:pointer;text-align:left}.studyPick.active{border-color:var(--accent);background:rgba(96,165,250,.14)}
    .point{border:1px solid var(--line);border-radius:17px;padding:16px;background:rgba(5,8,20,.42)}.point h2{margin:0;font-size:23px}.meaning{margin-top:8px;line-height:1.7}.pattern{margin-top:12px;padding:12px;border-radius:13px;border:1px solid rgba(96,165,250,.32);background:rgba(96,165,250,.08);font-weight:900;line-height:1.6}.examples{display:grid;gap:10px;margin-top:13px}.example{padding:13px;border:1px solid var(--line);border-radius:14px;background:#0b1020}.exampleKo{font-size:18px;font-weight:900;line-height:1.55}.transBtn{margin-top:9px;border:1px solid rgba(52,211,153,.48);border-radius:11px;background:rgba(52,211,153,.08);color:#d1fae5;font-weight:850;padding:8px 11px;cursor:pointer}.translation{margin-top:9px;padding:10px;border-radius:10px;background:rgba(52,211,153,.07);border-left:3px solid var(--green);line-height:1.65;color:#d1fae5}.tip{margin-top:12px;color:#dbeafe;line-height:1.65;font-size:14px}.studyArrows{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-top:15px}.studyArrows .btn:last-child{justify-self:stretch}.count{text-align:center;color:var(--muted);font-weight:850}
    .stageNav{display:flex;justify-content:space-between;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
    .quizIntro{padding:18px;border:1px solid var(--line);border-radius:16px;background:#0b1020;line-height:1.7}.quizRules{margin:8px 0 0;color:var(--muted)}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:11px}.stat{padding:10px;border:1px solid var(--line);border-radius:12px;background:#0b1020;text-align:center}.stat small{display:block;color:var(--muted);margin-bottom:3px}.stat b{font-size:19px}
    .qbox{border:1px solid var(--line);border-radius:16px;padding:14px;background:rgba(5,8,20,.42)}.prompt{font-size:20px;font-weight:900;line-height:1.7;padding:10px 8px 6px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:120px}.promptGuide{font-size:15px;color:var(--muted);font-weight:800;margin-bottom:7px}.promptHint{font-size:15px;color:#bfdbfe;font-weight:850;margin:0 0 10px;line-height:1.55}.promptMain{max-width:760px;font-size:20px;color:#fff;word-break:keep-all}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.choice{min-height:58px;padding:12px;border:1px solid var(--line);border-radius:13px;background:#0b1020;color:var(--text);font-weight:900;font-size:17px;cursor:pointer;line-height:1.45}.choice.correct{background:#0e442d;border-color:var(--green)}.choice.wrong{background:#4b1720;border-color:var(--red)}.choice:disabled{cursor:default}
    .feedback{display:none;margin-top:11px;padding:12px;border-radius:12px;border:1px solid var(--line);line-height:1.65}.feedback.show{display:block}.feedback.ok{border-color:var(--green);background:#0b3022}.feedback.bad{border-color:var(--red);background:#3a151b}.nextRow{display:flex;justify-content:flex-end;margin-top:10px}.nextQ{border-color:rgba(96,165,250,.55);background:rgba(96,165,250,.12)}
    .summary{text-align:center;padding:24px}.score{font-size:48px;font-weight:950;color:#93c5fd}.review{margin-top:16px;text-align:left}.reviewItem{padding:10px 0;border-bottom:1px solid var(--line);line-height:1.55}.reviewMine{color:#fecaca}.reviewCorrect{color:#d1fae5}.best{margin-top:8px;color:var(--amber);font-weight:850}.err{margin-top:12px;border:1px solid rgba(248,113,113,.4);background:rgba(248,113,113,.07);padding:12px;border-radius:12px;color:#fecaca;white-space:pre-wrap}
    @media(min-width:760px){.studyNav{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:600px){.container{padding:9px}.card{padding:12px}h1{font-size:24px}.studyNav{grid-template-columns:1fr 1fr}.studyPick{font-size:14px}.choices{grid-template-columns:1fr}.choice{font-size:18px}.stats{grid-template-columns:repeat(3,1fr)}.stat b{font-size:16px}.point h2{font-size:21px}.studyArrows{grid-template-columns:1fr auto 1fr}.btn{padding:10px 12px}.right .btnHome{display:none}}
  </style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="dot"></span><span id="brand">TOPIK I · 문법</span></div>
  <div class="right"><button class="btn btnBack" id="back" type="button">←</button><button class="btn btnLang" id="lang" type="button">KR</button><a class="btn btnHome" id="home" href="./index.html">홈</a></div>
</header>
<main class="container"><section class="card">
  <h1 id="title">TOPIK I 문법</h1><div class="sub" id="subtitle">불러오는 중...</div><div class="stageBadge" id="stageBadge"></div>
  <div class="tabs"><button class="tab active" data-panel="study" id="studyTab">문법 학습</button><button class="tab" data-panel="quiz" id="quizTab">문법 확인 문제</button></div>
  <div class="panel active" id="study"><div class="studyNav" id="studyNav"></div><div id="pointWrap"></div><div class="stageNav"><button class="btn" id="prevStage">← 이전 단계</button><button class="btn" id="nextStage">다음 단계 →</button></div></div>
  <div class="panel" id="quiz"><div id="quizWrap"></div></div>
  <div class="err hidden" id="err"></div>
</section></main>
<script>
  const $=id=>document.getElementById(id), params=new URL(location.href).searchParams;
  let DATA=null,pointIndex=0,quizState=null;
  const lang=()=>((params.get('lang')||localStorage.getItem('kq_lang')||'KR').toUpperCase()==='MN'?'MN':'KR');
  const tx=(ko,mn)=>lang()==='MN'?mn:ko;
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
  function pass(extra={}){const p=new URLSearchParams();['name','klass','token','lang'].forEach(k=>{const v=params.get(k);if(v)p.set(k,v)});if(!p.get('lang'))p.set('lang',lang());Object.entries(extra).forEach(([k,v])=>v!=null&&p.set(k,String(v)));return p}
  function indexUrl(){return `./index.html?${pass().toString()}`}
  function stageUrl(n,path){const p=pass({stage:n,data:path});return `./grammar.html?${p.toString()}`}
  function applyText(){document.documentElement.lang=lang()==='MN'?'mn':'ko';$('lang').textContent=lang();$('home').textContent=tx('홈','Нүүр');$('home').href=indexUrl();$('studyTab').textContent=tx('문법 학습','Дүрэм сурах');$('quizTab').textContent=tx('문법 확인 문제','Дүрмийн шалгалт');$('brand').textContent=tx('TOPIK I · 문법','TOPIK I · Дүрэм');}
  function showPanel(id){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.panel===id));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===id));if(id==='quiz'&&!quizState)renderQuizIntro()}
  function translationButton(ex,i){return `<div class="example"><div class="exampleKo">${esc(ex.ko)}</div><button class="transBtn" data-trans="${i}" type="button">${tx('몽골어 번역 보기','Монгол орчуулга харах')}</button><div class="translation hidden" id="trans-${i}">${esc(ex.mn)}</div></div>`}
  function renderStudy(){const pts=DATA.points||[];if(!pts.length){$('studyNav').innerHTML='';$('pointWrap').innerHTML=`<div class="sub">${tx('학습 자료가 없습니다.','Сурах материал алга.')}</div>`;return}pointIndex=Math.max(0,Math.min(pointIndex,pts.length-1));$('studyNav').innerHTML=pts.map((p,i)=>`<button class="studyPick ${i===pointIndex?'active':''}" data-i="${i}" type="button">${i+1}. ${esc(p.title)}</button>`).join('');document.querySelectorAll('.studyPick').forEach(b=>b.onclick=()=>{pointIndex=Number(b.dataset.i);renderStudy();window.scrollTo({top:0,behavior:'smooth'})});const p=pts[pointIndex];$('pointWrap').innerHTML=`<article class="point"><h2>${pointIndex+1}. ${esc(p.title)}</h2><div class="meaning">${esc(lang()==='MN'?(p.meaning_mn||p.meaning_kr):p.meaning_kr)}</div><div class="pattern">${esc(lang()==='MN'?(p.pattern_mn||p.pattern_kr):p.pattern_kr)}</div><div class="examples">${(p.examples||[]).map((e,i)=>translationButton(e,i)).join('')}</div>${p.tip_kr?`<div class="tip">💡 ${esc(lang()==='MN'?(p.tip_mn||p.tip_kr):p.tip_kr)}</div>`:''}<div class="studyArrows"><button class="btn" id="prevPoint" type="button">← ${tx('이전','Өмнөх')}</button><span class="count">${pointIndex+1} / ${pts.length}</span><button class="btn" id="nextPoint" type="button">${tx('다음','Дараах')} →</button></div></article>`;document.querySelectorAll('.transBtn').forEach(b=>b.onclick=()=>{const box=$('trans-'+b.dataset.trans),open=!box.classList.contains('hidden');box.classList.toggle('hidden',open);b.textContent=open?tx('몽골어 번역 보기','Монгол орчуулга харах'):tx('몽골어 번역 숨기기','Монгол орчуулгыг нуух')});$('prevPoint').disabled=pointIndex===0;$('nextPoint').disabled=pointIndex===pts.length-1;$('prevPoint').onclick=()=>{if(pointIndex>0){pointIndex--;renderStudy()}};$('nextPoint').onclick=()=>{if(pointIndex<pts.length-1){pointIndex++;renderStudy()}}}
  function renderQuizIntro(){const n=(DATA.questions||[]).length,best=Number(localStorage.getItem(`topik1_grammar_best_${DATA.stage}`)||0);$('quizWrap').innerHTML=`<div class="quizIntro"><b>${tx('이 단계의 문법 확인 문제','Энэ шатны дүрмийн шалгалт')}</b><div class="quizRules">${tx(`총 ${n}문제 · 4지선다 · 한 문항의 정답은 하나입니다. 종결어미와 연결어미 선택지는 동사·형용사와 결합된 완성형으로 제시됩니다.`,`Нийт ${n} асуулт · 4 сонголт · асуулт бүр нэг зөв хариулттай. Төгсгөлийн болон холбох нөхцөлүүдийг үйл үг/тэмдэг нэртэй нийлсэн бүтэн хэлбэрээр өгнө.`)}</div>${best?`<div class="best">${tx('최고 점수','Шилдэг оноо')}: ${best}%</div>`:''}<button class="btn nextQ" id="startQuiz" type="button" style="margin-top:14px">${tx('문제 시작','Шалгалт эхлэх')}</button></div>`;$('startQuiz').onclick=startQuiz}
  function promptHtml(q){const hint=lang()==='MN'?(q.hint_mn||q.hint_kr||''):(q.hint_kr||'');return `<div class="promptGuide">${esc(tx('빈칸에 들어갈 알맞은 표현을 고르세요.','Хоосон зайд орох зөв хэллэгийг сонгоно уу.'))}</div>${hint?`<div class="promptHint">${esc(hint)}</div>`:''}<div class="promptMain">${esc(q.prompt).split('\n').join('<br>')}</div>`}
  function startQuiz(){const qs=(DATA.questions||[]).filter(q=>q&&q.prompt&&q.correct&&Array.isArray(q.choices)&&q.choices.length===4);quizState={queue:shuffle(qs),i:0,correct:0,wrong:0,miss:[],locked:false};renderQuestion()}
  function stats(){const s=quizState;return `<div class="stats"><div class="stat"><small>${tx('진행','Явц')}</small><b>${Math.min(s.i+1,s.queue.length)} / ${s.queue.length}</b></div><div class="stat"><small>${tx('정답','Зөв')}</small><b>${s.correct}</b></div><div class="stat"><small>${tx('오답','Буруу')}</small><b>${s.wrong}</b></div></div>`}
  function renderQuestion(){const s=quizState;if(s.i>=s.queue.length){finishQuiz();return}const q=s.queue[s.i],choices=shuffle(q.choices.slice());s.locked=false;$('quizWrap').innerHTML=stats()+`<div class="qbox"><div class="prompt">${promptHtml(q)}</div><div class="choices">${choices.map(c=>`<button class="choice" type="button" data-v="${encodeURIComponent(c)}">${esc(c)}</button>`).join('')}</div><div class="feedback" id="feedback"></div><div class="nextRow"><button class="btn nextQ hidden" id="nextQ" type="button">${tx('다음 문제','Дараах асуулт')} →</button></div></div>`;document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(decodeURIComponent(b.dataset.v),b,q));$('nextQ').onclick=()=>{s.i++;renderQuestion()}}
  function answer(v,btn,q){const s=quizState;if(s.locked)return;s.locked=true;const ok=v===q.correct;if(ok)s.correct++;else{s.wrong++;s.miss.push({prompt:q.prompt,selected:v,correct:q.correct,why_kr:q.why_kr||'',why_mn:q.why_mn||''})}document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;const val=decodeURIComponent(b.dataset.v);if(val===q.correct)b.classList.add('correct');else if(b===btn)b.classList.add('wrong')});const f=$('feedback');f.className='feedback show '+(ok?'ok':'bad');const why=lang()==='MN'?(q.why_mn||q.why_kr||''):(q.why_kr||'');f.innerHTML=`<b>${ok?tx('정답입니다.','Зөв байна.'):tx('오답입니다.','Буруу байна.')}</b><br>${tx('정답','Зөв хариулт')}: <b>${esc(q.correct)}</b>${why?`<br><span>${esc(why)}</span>`:''}`;$('nextQ').classList.remove('hidden')}
  function finishQuiz(){const s=quizState,total=s.queue.length,pct=total?Math.round(s.correct/total*100):0,key=`topik1_grammar_best_${DATA.stage}`,old=Number(localStorage.getItem(key)||0);if(pct>old)localStorage.setItem(key,String(pct));$('quizWrap').innerHTML=`<div class="qbox summary"><div>${tx('단계 학습 확인 완료','Шатны шалгалт дууслаа')}</div><div class="score">${pct}%</div><div>${tx('정답','Зөв')} <b>${s.correct}</b> · ${tx('오답','Буруу')} <b>${s.wrong}</b></div><div class="best">${tx('최고 점수','Шилдэг оноо')}: ${Math.max(old,pct)}%</div>${s.miss.length?`<div class="review"><h3>${tx('틀린 문제와 정답','Алдсан асуулт ба зөв хариулт')}</h3>${s.miss.map((m,i)=>`<div class="reviewItem"><b>${i+1}. ${esc(m.prompt).replace(/\n/g,'<br>')}</b><br><span class="reviewMine">${tx('내 답','Миний хариулт')}: <b>${esc(m.selected||'')}</b></span><br><span class="reviewCorrect">${tx('정답','Зөв хариулт')}: <b>${esc(m.correct)}</b></span>${(lang()==='MN'?m.why_mn:m.why_kr)?`<br><span class="sub">${esc(lang()==='MN'?(m.why_mn||m.why_kr):(m.why_kr||''))}</span>`:''}</div>`).join('')}</div>`:`<div class="review"><h3>${tx('🎉 모두 맞았습니다.','🎉 Бүгд зөв байна.')}</h3></div>`}<button class="btn nextQ" id="restartQuiz" type="button" style="margin-top:15px">${tx('다시 풀기','Дахин ажиллах')}</button></div>`;$('restartQuiz').onclick=startQuiz}
  function setStageNav(){const prev=DATA.prev,next=DATA.next;$('prevStage').disabled=!prev;$('nextStage').disabled=!next;if(prev)$('prevStage').onclick=()=>location.href=stageUrl(prev.stage,prev.data);if(next)$('nextStage').onclick=()=>location.href=stageUrl(next.stage,next.data)}
  async function init(){applyText();$('back').onclick=()=>location.href=indexUrl();$('lang').onclick=()=>{const next=lang()==='KR'?'MN':'KR';localStorage.setItem('kq_lang',next);params.set('lang',next);location.search=params.toString()};document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>showPanel(t.dataset.panel));const path=params.get('data');if(!path){$('subtitle').textContent=tx('문법 데이터 경로가 없습니다.','Дүрмийн өгөгдлийн зам алга.');return}try{const res=await fetch(new URL(path,location.href),{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);DATA=await res.json();$('title').textContent=lang()==='MN'?(DATA.title_mn||DATA.title_kr):DATA.title_kr;$('subtitle').textContent=lang()==='MN'?(DATA.description_mn||DATA.description_kr):DATA.description_kr;$('stageBadge').textContent=tx(`${DATA.stage}단계 · 문법 ${DATA.points.length}개`,` ${DATA.stage}-р шат · ${DATA.points.length} дүрэм`);renderStudy();setStageNav()}catch(e){$('err').textContent=tx('불러오기 오류: ','Унших алдаа: ')+e.message;$('err').classList.remove('hidden')}}
  init();
</script>
</body></html>
