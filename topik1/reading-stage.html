<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TOPIK I 읽기 평가</title>
<style>
:root{--bg:#0b1220;--card:#111827;--card2:#0b1020;--text:#e5e7eb;--muted:#9ca3af;--line:#243044;--blue:#60a5fa;--green:#34d399;--red:#f87171;--amber:#fbbf24}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans KR",Arial,sans-serif;background:linear-gradient(180deg,#050814,var(--bg));color:var(--text)}button{font:inherit;touch-action:manipulation}.hidden{display:none!important}.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:rgba(5,8,20,.92);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:8px;font-weight:950}.dot{width:9px;height:9px;border-radius:50%;background:var(--blue)}.right{display:flex;gap:6px}.btn{min-height:44px;padding:9px 12px;border-radius:13px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-weight:900;cursor:pointer}.btnBack{border-color:rgba(96,165,250,.5)}.btnLang{border-color:rgba(52,211,153,.5)}
.container{max-width:760px;margin:0 auto;padding:10px}.card{background:rgba(17,24,39,.94);border:1px solid var(--line);border-radius:18px;padding:14px}.titleRow{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.title{font-size:22px;font-weight:950;margin:0}.sub{color:var(--muted);font-size:12px;line-height:1.5;margin-top:4px}.stageChip{padding:5px 8px;border-radius:999px;border:1px solid rgba(52,211,153,.4);background:rgba(52,211,153,.08);color:#a7f3d0;font-size:11px;font-weight:900;white-space:nowrap}.progressMeta{display:flex;justify-content:space-between;margin-top:12px;color:var(--muted);font-size:12px;font-weight:850}.track{height:7px;background:#080d18;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:6px}.fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));width:0}
.questionBox{margin-top:13px;padding:14px;border-radius:17px;border:1px solid rgba(96,165,250,.28);background:linear-gradient(145deg,rgba(96,165,250,.08),rgba(11,16,32,.96))}.qTop{display:flex;align-items:center;justify-content:space-between;gap:10px}.qLabel{font-size:11px;color:#bfdbfe;font-weight:900}.timer{--p:100;position:relative;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--green) calc(var(--p)*1%),#1f2937 0);flex:0 0 auto}.timer:after{content:"";position:absolute;inset:5px;border-radius:50%;background:#0b1020}.timerText{position:relative;z-index:1;font-size:19px;font-weight:950}.timer.warn{background:conic-gradient(var(--amber) calc(var(--p)*1%),#1f2937 0)}.timer.danger{background:conic-gradient(var(--red) calc(var(--p)*1%),#1f2937 0);animation:pulse .65s infinite alternate}@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.04)}}.qText{margin-top:8px;font-size:16px;font-weight:950}.blankMark{color:#fde047;background:rgba(253,224,71,.10);border:1px solid rgba(253,224,71,.45);border-radius:7px;padding:1px 4px;font-weight:950}.passage{margin-top:11px;padding:14px;border-radius:13px;background:#0a1020;border:1px solid var(--line);font-size:20px;line-height:1.55;font-weight:850;word-break:keep-all;overflow-wrap:anywhere;white-space:pre-line}.qImageWrap{width:300px;height:220px;max-width:100%;margin:10px auto 0;padding:6px;border-radius:13px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}.qImage{display:block;width:100%;height:100%;margin:0 auto;border-radius:8px;object-fit:contain}.qImageWrap{cursor:zoom-in}.qImageWrap.zoomed{position:fixed;inset:0;z-index:9999;width:100vw;height:100vh;max-width:none;margin:0;padding:18px;background:rgba(0,0,0,.92);border:0;border-radius:0;cursor:zoom-out}.qImageWrap.zoomed .qImage{width:auto;height:auto;max-width:94vw;max-height:88vh;border-radius:10px}.options{display:grid;gap:8px;margin-top:12px}.option{width:100%;min-height:52px;padding:12px 13px;border-radius:13px;border:1px solid #334155;background:#0b1020;color:var(--text);text-align:left;font-weight:850;cursor:pointer}.option.selected{border-color:var(--blue);background:rgba(96,165,250,.17)}.option .num{display:inline-flex;width:25px;height:25px;border-radius:50%;align-items:center;justify-content:center;margin-right:8px;border:1px solid #475569;color:#bfdbfe}.nav{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}.next{width:100%;border-color:rgba(96,165,250,.55);background:rgba(96,165,250,.14)}.timeoutMsg{min-height:18px;margin-top:8px;text-align:center;color:#fca5a5;font-size:11px;font-weight:850}.notice{margin-top:11px;padding:9px;border-radius:12px;border:1px solid rgba(251,191,36,.35);background:rgba(251,191,36,.08);color:#fde68a;font-size:11px;line-height:1.45;text-align:center}.result{text-align:center;padding:18px 6px}.score{font-size:46px;font-weight:950}.pass{color:#86efac}.fail{color:#fca5a5}.resultBtns{display:grid;gap:8px;margin-top:16px}.wrongList{margin-top:15px;display:grid;gap:8px;text-align:left}.wrongItem{padding:11px;border-radius:12px;border:1px solid rgba(248,113,113,.35);background:rgba(248,113,113,.07);font-size:12px;line-height:1.5}.timeoutTag{display:inline-block;margin-left:5px;padding:2px 5px;border-radius:6px;background:rgba(248,113,113,.17);color:#fecaca;font-size:10px}.blocked{text-align:center;padding:28px 14px}
@media(max-width:480px){.container{padding:7px}.card{padding:10px;border-radius:15px}.title{font-size:19px}.questionBox{padding:11px 9px}.passage{font-size:18px;padding:11px}.qImageWrap{width:250px;height:185px;padding:5px}.option{min-height:52px;padding:11px}.brand{font-size:13px}.btn{padding:8px 9px;min-height:43px}.timer{width:60px;height:60px}.timerText{font-size:18px}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><span class="dot"></span><span>Korean Quiz</span></div><div class="right"><button id="backBtn" class="btn btnBack">←</button><button id="langBtn" class="btn btnLang">KR</button></div></header>
<main class="container"><section id="app" class="card hidden"><div class="titleRow"><div><h1 id="title" class="title"></h1><div id="subtitle" class="sub"></div></div><span id="stageChip" class="stageChip"></span></div><div class="progressMeta"><span id="progressText"></span><span></span></div><div class="track"><div id="fill" class="fill"></div></div><div id="questionArea"></div><div id="localNotice" class="notice hidden"></div></section><section id="blocked" class="card blocked hidden"><h2>로그인이 필요합니다</h2><div id="blockedText" class="sub"></div></section></main>
<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbz6WBgnJXTAperJK2NwX-VwkmPEQrU4SluCcXjbmYYgcywYM2AcHZwkymBse6E9Kaqg/exec",DEVICE_KEY="kq_deviceId_v1",SESSION_KEY="kq_session_v1",PASS_SCORE=90,AUTO_LOGOUT_MIN=30;
const $=id=>document.getElementById(id),params=new URL(location.href).searchParams;let DATA=null,index=0,answers={},timedOut={},timerId=null,deadline=0,remaining=0,questionLocked=false,DEV_ACCESS=false;
const typeNo=Math.max(1,parseInt(params.get("type")||"1",10)||1),stageId=(params.get("stage")||"basic").toLowerCase(),stageNames={basic:"기초",develop:"발전",real:"실전"};
const TYPE_INFO={1:{kr:"중심 화제",mn:"Гол сэдэв",range:"31~33"},2:{kr:"빈칸 채우기",mn:"Хоосон зай нөхөх",range:"34~39"},3:{kr:"실용문 정보",mn:"Хэрэглээний мэдээлэл",range:"40~42"},4:{kr:"세부 내용",mn:"Дэлгэрэнгүй агуулга",range:"43~45"},5:{kr:"중심 내용",mn:"Гол агуулга",range:"46~48"},6:{kr:"단문 독해",mn:"Богино эх унших",range:"49~56"},7:{kr:"문장 순서",mn:"Өгүүлбэрийн дараалал",range:"57~58"},8:{kr:"장문 독해",mn:"Урт эх унших",range:"59~70"}};
function getLang(){const q=(params.get("lang")||"").toUpperCase();const st=(localStorage.getItem("kq_lang")||localStorage.getItem("lang")||"").toUpperCase();const pick=(q==="MN"||q==="KR")?q:st;return pick==="MN"?"MN":"KR";}
function getDeviceId(){let id=localStorage.getItem(DEVICE_KEY)||"";if(!id){id="dev_"+Math.random().toString(16).slice(2)+"_"+Date.now().toString(16);localStorage.setItem(DEVICE_KEY,id)}return id}function session(){try{const s=JSON.parse(localStorage.getItem(SESSION_KEY)||"null");return s&&s.name&&s.klass&&s.token?s:null}catch(e){return null}}const IDLE_MS=AUTO_LOGOUT_MIN*60*1000;let idleTimer=null,lastIdleWrite=0;function writeSessionActivity(force=false){const s=session();if(!s)return false;const now=Date.now();if(!force&&now-lastIdleWrite<5000)return true;s.lastActive=now;localStorage.setItem(SESSION_KEY,JSON.stringify(s));lastIdleWrite=now;return true}function idleLogout(){const s=session();if(!s)return;try{localStorage.removeItem(SESSION_KEY)}catch(e){};location.href="../index.html"}function scheduleIdle(){const s=session();if(!s)return;const last=Number(s.lastActive||0);const remain=IDLE_MS-(Date.now()-last);if(idleTimer)clearTimeout(idleTimer);if(remain<=0){idleLogout();return}idleTimer=setTimeout(()=>{const ss=session();if(ss&&Date.now()-Number(ss.lastActive||0)>=IDLE_MS)idleLogout();else scheduleIdle()},remain+250)}function markActivity(){if(writeSessionActivity())scheduleIdle()}["pointerdown","keydown","scroll","touchstart","click"].forEach(evt=>window.addEventListener(evt,markActivity,{passive:true}));document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){const s=session();if(s&&Date.now()-Number(s.lastActive||0)>=IDLE_MS)idleLogout();else markActivity()}});function jsonp(base,p,t=10000){return new Promise((res,rej)=>{const cb="cb_rt_"+Date.now()+"_"+Math.floor(Math.random()*1e6),sc=document.createElement("script");let done=false;const clean=()=>{try{delete window[cb]}catch(e){};sc.remove()};const tm=setTimeout(()=>{if(done)return;done=true;clean();rej(new Error("timeout"))},t);window[cb]=d=>{if(done)return;done=true;clearTimeout(tm);clean();res(d)};sc.onerror=()=>{if(done)return;done=true;clearTimeout(tm);clean();rej(new Error("load_error"))};sc.src=base+"?"+new URLSearchParams({...p,callback:cb});document.head.appendChild(sc)})}
function lang(){const q=(params.get("lang")||"").toUpperCase();return q==="MN"?"MN":"KR"}async function developerAccess(){try{const r=await jsonp(SCRIPT_URL,{action:"learning_start",token:(params.get("token")||"").trim(),deviceId:getDeviceId(),name:(params.get("name")||"").trim(),book:"TOPIK1"});DEV_ACCESS=!!(r&&r.ok&&(r.developerAccess||r.isDeveloper));return DEV_ACCESS}catch(e){DEV_ACCESS=false;return false}}function qs(url,extra={}){const p=new URLSearchParams();["name","klass","token","lang"].forEach(k=>{const v=params.get(k);if(v)p.set(k,v)});if(!p.get("lang"))p.set("lang",lang());Object.entries(extra).forEach(([k,v])=>p.set(k,String(v)));return url+(url.includes("?")?"&":"?")+p.toString()}const PROGRESS_PREFIX="topik1_reading_local_progress_v1_";function progressKey(){const id=(params.get("token")||params.get("name")||"guest").trim();return PROGRESS_PREFIX+id}function readProgress(){try{return JSON.parse(localStorage.getItem(progressKey())||"{}")||{}}catch(e){return {}}}function savePass(type,stage,score){const p=readProgress(),k=`t${type}_${stage}`;const prev=p[k]||{};p[k]={passed:true,bestScore:Math.max(Number(prev.bestScore||0),Number(score||0)),passedAt:prev.passedAt||new Date().toISOString()};localStorage.setItem(progressKey(),JSON.stringify(p))}function stageOrder(type){return type===8?["s1","s2","s3","s4","s5","s6"]:["basic","develop","real"]}function finalStageId(type){const a=stageOrder(type);return a[a.length-1]}function stageAllowed(type,stage){const order=stageOrder(type),i=order.indexOf(stage);if(i<0)return false;if(DEV_ACCESS)return !!TYPE_INFO[type];if(i===0){if(type===1)return true;const k=`t${type-1}_${finalStageId(type-1)}`;return !!(readProgress()[k]&&readProgress()[k].passed)}const k=`t${type}_${order[i-1]}`;return !!(readProgress()[k]&&readProgress()[k].passed)}async function auth(){const name=(params.get("name")||"").trim(),klass=(params.get("klass")||"").trim(),token=(params.get("token")||"").trim(),s=session();if(!name||!klass||!token||!s||s.name!==name||s.klass!==klass||s.token!==token){$("blockedText").textContent="정상 로그인 세션으로 다시 진입해 주세요.";$("blocked").classList.remove("hidden");return false}try{const r=await jsonp(SCRIPT_URL,{action:"validate",token,deviceId:getDeviceId(),name,klass});if(!r||!r.ok)throw new Error((r&&r.error)||"invalid");return true}catch(e){$("blockedText").textContent="인증 확인 실패: "+e.message;$("blocked").classList.remove("hidden");return false}}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function paintTimer(){const el=$("timer"),txt=$("timerText");if(!el||!txt)return;const max=Number(DATA.time_limit_seconds)||30,pct=Math.max(0,Math.min(100,Math.round(remaining/max*100)));el.style.setProperty("--p",pct);el.classList.toggle("warn",remaining<=15&&remaining>7);el.classList.toggle("danger",remaining<=7);txt.textContent=String(Math.max(0,remaining))}
function startTimer(){stopTimer();const max=Number(DATA.time_limit_seconds)||30;remaining=max;deadline=Date.now()+max*1000;paintTimer();timerId=setInterval(()=>{remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));paintTimer();if(remaining<=0){stopTimer();handleTimeout()}},250)}
function handleTimeout(){if(questionLocked)return;questionLocked=true;const q=DATA.questions[index];if(!answers[q.id]){answers[q.id]=0;timedOut[q.id]=true;const m=$("timeoutMsg");if(m)m.textContent="시간 초과 · 오답 처리"}else{const m=$("timeoutMsg");if(m)m.textContent="시간 종료 · 선택한 답으로 확정"}document.querySelectorAll('.option').forEach(b=>b.disabled=true);setTimeout(()=>advance(),700)}
function advance(){stopTimer();if(index<DATA.questions.length-1){index++;questionLocked=false;render();scrollTo(0,0)}else finish()}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]||c))}
function formatPassage(v){const safe=escapeHtml(v);return safe.replace(/\(\s*(?:[㉠㉡㉢㉣])?\s*\)|[㉠㉡㉢㉣]/g,m=>`<span class="blankMark">${m}</span>`)}
function render(){stopTimer();const q=DATA.questions[index],n=index+1,total=DATA.questions.length,pct=Math.round(n/total*100);$("progressText").textContent=`${n} / ${total}`;$("fill").style.width=pct+"%";const selected=answers[q.id]||0;$("questionArea").innerHTML=`<div class="questionBox"><div class="qTop"><div></div><div id="timer" class="timer"><span id="timerText" class="timerText"></span></div></div><div class="qText">${n}번 · ${formatPassage(q.question)}</div>${q.insert_sentence?`<div class="passage" style="border-color:rgba(96,165,250,.55);background:rgba(96,165,250,.08)">${formatPassage(q.insert_sentence)}</div>`:""}${q.image_url?`<div class="qImageWrap"><img class="qImage" src="${q.image_url}" alt=""></div>`:(q.passage?`<div class="passage">${formatPassage(q.passage)}</div>`:"")}<div class="options">${q.options.map((o,i)=>`<button type="button" class="option ${selected===i+1?'selected':''}" data-choice="${i+1}"><span class="num">${i+1}</span>${o}</button>`).join('')}</div><div id="timeoutMsg" class="timeoutMsg"></div><div class="nav"><button id="next" class="btn next">${n===total?'채점':'다음 →'}</button></div></div>`;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{if(questionLocked)return;answers[q.id]=Number(b.dataset.choice);document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});const zoomWrap=document.querySelector('.qImageWrap');if(zoomWrap)zoomWrap.onclick=()=>{zoomWrap.classList.toggle('zoomed')};$("next").onclick=()=>{if(questionLocked)return;questionLocked=true;if(!answers[q.id]){answers[q.id]=0;timedOut[q.id]=false}advance()};startTimer()}
function finish(){stopTimer();let correct=0;const wrong=[];DATA.questions.forEach((q,i)=>{if(answers[q.id]===q.correct_answer)correct++;else wrong.push({i:i+1,q,yours:answers[q.id]||0,timeout:!!timedOut[q.id]})});const score=Math.round(correct/DATA.questions.length*100),passed=score>=PASS_SCORE;if(passed&&!DEV_ACCESS)savePass(typeNo,stageId,score);const wrongHtml=wrong.map(w=>{const body=[w.q.question?`<div style="margin-top:6px;font-weight:850">${w.q.question}</div>`:'',w.q.insert_sentence?`<div style="margin-top:8px">${formatPassage(w.q.insert_sentence)}</div>`:'',w.q.image_url?`<div class="qImageWrap" style="margin-top:8px"><img class="qImage" src="${w.q.image_url}" alt=""></div>`:'',w.q.passage?`<div style="margin-top:8px;white-space:pre-line">${formatPassage(w.q.passage)}</div>`:''].join('');const devAnswer=DEV_ACCESS?`<div style="margin-top:8px;color:#bfdbfe">내 답: ${w.yours?w.q.options[w.yours-1]:'미응답'} · 정답: ${w.q.options[w.q.correct_answer-1]}</div>`:'';return `<div class="wrongItem"><b>${w.i}번</b>${w.timeout?'<span class="timeoutTag">시간초과</span>':''}${body}${devAnswer}</div>`}).join('');$("questionArea").innerHTML=`<div class="result"><div class="score ${passed?'pass':'fail'}">${score}점</div><div style="font-weight:950;font-size:20px">${passed?`${DATA.stage_name} 단계 통과`:'90점 이상이면 통과합니다'}</div><div class="sub" style="margin-top:6px">${correct} / ${DATA.questions.length} 정답 · 시간초과 ${wrong.filter(w=>w.timeout).length}문항</div><div class="wrongList">${wrongHtml}</div><div class="resultBtns"><button id="retry" class="btn">다시 풀기</button><button id="backStages" class="btn next">단계 선택</button></div></div>`;$("retry").onclick=()=>{index=0;answers={};timedOut={};questionLocked=false;render();scrollTo(0,0)};$("backStages").onclick=()=>location.href=qs('./reading-training.html',{type:typeNo,view:"stages"})}
$("backBtn").onclick=()=>{stopTimer();location.href=qs('./reading-training.html',{type:typeNo,view:"stages"})};$("langBtn").onclick=()=>{const next=getLang()==="KR"?"MN":"KR";const u=new URL(location.href);u.searchParams.set("lang",next);localStorage.setItem("kq_lang",next);localStorage.setItem("lang",next);location.href=u.toString();};
(async()=>{if(!await auth())return;await developerAccess();if(!TYPE_INFO[typeNo]){$("blockedText").textContent=getLang()==="MN"?"Энэ төрлийн даалгавар хараахан бэлэн болоогүй байна.":"아직 준비되지 않은 유형입니다.";$("blocked").classList.remove("hidden");return}if(!stageAllowed(typeNo,stageId)){$("blockedText").textContent=getLang()==="MN"?"Өмнөх шатыг 90 ба түүнээс дээш оноогоор тэнцэнэ үү.":"이전 단계를 먼저 통과해 주세요.";$("blocked").classList.remove("hidden");return}const dataFile=`./data/reading-training/type${String(typeNo).padStart(2,"0")}-${stageId}.json`;const r=await fetch(dataFile,{cache:'no-store'});if(!r.ok){$("blockedText").textContent='문항 데이터를 불러오지 못했습니다.';$("blocked").classList.remove('hidden');return}DATA=await r.json();const mn=getLang()==="MN",info=TYPE_INFO[typeNo],stageMn={basic:"Суурь",develop:"Ахиц",real:"Шалгалт"};const displayStage=mn?(DATA.stage_name_mn||stageMn[stageId]||DATA.stage_name):DATA.stage_name;$("title").textContent=mn?`${typeNo}. ${info.mn} · ${displayStage}`:`${typeNo}. ${info.kr} · ${displayStage}`;$("subtitle").textContent=mn?`TOPIK I ${info.range} төрлийн ${DATA.questions.length} асуулт · асуулт бүр ${DATA.time_limit_seconds} секунд`:"";$("stageChip").textContent=mn?`${displayStage}${DATA.time_limit_seconds?` · ${DATA.time_limit_seconds} сек`:''}`:`${displayStage}${DATA.time_limit_seconds?` · ${DATA.time_limit_seconds}초`:''}`;$("langBtn").textContent=mn?"MN":"KR";const n=$("localNotice");if(n){if(mn){n.textContent="Энэ нь орон нутгийн туршилтын хувилбар. Google Sheets бүртгэл дараагийн шатанд холбогдоно.";n.classList.remove("hidden")}else n.classList.add("hidden")}$("app").classList.remove('hidden');render()})();
</script>
</body></html>
