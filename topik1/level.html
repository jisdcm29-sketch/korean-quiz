<html lang="ko">
<head>

  <style>

    *{box-sizing:border-box} html,body{overflow-x:hidden}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans KR",Arial,sans-serif;background:linear-gradient(180deg,#050814,var(--bg));color:var(--text)}

    .container{max-width:980px;margin:0 auto;padding:16px}.card{background:rgba(17,24,39,.92);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
    .titleRow{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;flex-wrap:wrap}.h1{margin:0 0 6px;font-size:29px;font-weight:950;letter-spacing:.2px}.muted{color:var(--muted);line-height:1.62}.small{font-size:13px}
    .progressMeta{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:16px;color:var(--muted);font-size:13px;font-weight:800}.progressTrack{height:8px;margin-top:7px;border-radius:999px;background:#080d18;border:1px solid var(--line);overflow:hidden}.progressFill{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .25s ease}
    .studyBox{margin-top:16px;border:1px solid rgba(96,165,250,.25);background:linear-gradient(145deg,rgba(96,165,250,.08),rgba(11,16,32,.95));border-radius:20px;padding:20px}
    .sectionBadge{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;background:rgba(251,191,36,.10);border:1px solid rgba(251,191,36,.30);color:#fde68a;font-size:13px;font-weight:850;max-width:100%;white-space:normal;line-height:1.35}
    .questionNo{margin-top:17px;color:var(--muted);font-size:13px;font-weight:850;text-align:center}.koSentence{font-size:30px;line-height:1.45;font-weight:950;letter-spacing:.1px;text-align:center;margin:10px auto 8px;word-break:keep-all;overflow-wrap:anywhere;max-width:820px}.practiceHint{text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
    .checkRow{display:flex;justify-content:center;margin:20px 0 2px}.btnCheck{min-width:190px;background:linear-gradient(135deg,rgba(52,211,153,.22),rgba(11,16,32,.96));border-color:rgba(52,211,153,.58);font-size:17px}
    .answerWrap{margin-top:18px;display:grid;gap:11px;animation:fadeIn .18s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
    .answerCard{border:1px solid var(--line);border-radius:16px;padding:14px 15px;background:rgba(11,16,32,.78);line-height:1.72}.answerCard.translation{border-color:rgba(52,211,153,.40);background:linear-gradient(135deg,rgba(52,211,153,.11),rgba(11,16,32,.90))}.answerLabel{font-size:12px;font-weight:950;letter-spacing:.2px;color:var(--muted);margin-bottom:5px}.mnSentence{font-size:22px;font-weight:850;line-height:1.55;overflow-wrap:anywhere}.analysisText{font-size:16px;white-space:pre-wrap;overflow-wrap:anywhere}.structure{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Noto Sans KR",monospace;font-size:15px}
    .navRow{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:18px}.navRow .next{justify-self:end;min-width:145px;background:linear-gradient(135deg,rgba(96,165,250,.22),rgba(11,16,32,.96));border-color:rgba(96,165,250,.55)}.navRow .prev{justify-self:start;min-width:120px}.counter{color:var(--muted);font-size:13px;font-weight:900;white-space:nowrap}
    .notice{margin-top:16px;border:1px solid rgba(251,191,36,.35);background:rgba(251,191,36,.08);border-radius:16px;padding:16px;line-height:1.65}.err{margin-top:16px;border:1px solid rgba(248,113,113,.45);background:rgba(248,113,113,.09);border-radius:16px;padding:16px;white-space:pre-wrap;line-height:1.6}.complete{text-align:center;padding:26px 12px}.completeIcon{font-size:46px}.completeTitle{font-size:26px;font-weight:950;margin:8px 0}.completeBtns{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}

    .contentEditorControls,.itemEditorBar{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}.contentEditorControls{margin-top:14px}.contentEditorControls[hidden]{display:none}.editorBadge{font-size:12px;color:#fde68a;border:1px solid #7c5d16;background:#2d230d;border-radius:999px;padding:5px 9px;font-weight:850}.editModeBtn,.editItemBtn{padding:8px 12px;border:1px solid var(--amber);background:#302715;color:#fde68a;border-radius:11px;cursor:pointer;font-weight:900}.editModeBtn.active{background:#644b0e;color:#fff}.editedMark{font-size:12px;color:#86efac;font-weight:850}.editorModal{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.72)}.editorModal[hidden]{display:none}.editorDialog{width:min(800px,100%);max-height:92vh;overflow:auto;background:#111a2a;border:1px solid #4b5d78;border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.55);padding:18px}.editorDialog h2{margin:0 0 4px;color:#fde68a}.editorMeta{color:var(--muted);font-size:13px;margin-bottom:14px}.editorField{display:block;margin-top:12px;font-weight:850}.editorField input,.editorField textarea{width:100%;margin-top:6px;border:1px solid #3b4b66;background:#08111f;color:#fff;border-radius:11px;padding:11px 12px;font:inherit}.editorField textarea{min-height:78px;resize:vertical;line-height:1.45}.editorGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.editorHelp{margin-top:10px;color:var(--muted);font-size:12px;line-height:1.5}.editorActions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:18px}.editorActions button{padding:10px 14px;border-radius:11px;border:1px solid var(--line);background:#101829;color:#fff;cursor:pointer;font-weight:900}.editorActions .save{border-color:#22c55e;background:#123725}.editorActions .restore{border-color:#ef4444;background:#3a151b}.editorActions button:disabled{opacity:.55;cursor:wait}.editorMessage{min-height:20px;margin-top:10px;font-size:13px}.editorMessage.ok{color:#86efac}.editorMessage.bad{color:#fecaca}@media(max-width:620px){.editorGrid{grid-template-columns:1fr}}
    @media(max-width:760px){.pill{display:none}.topbar{padding:8px 10px}.brand{font-size:14px}.right{gap:6px}.btn{min-height:44px;padding:9px 11px;border-radius:13px}.btnBack{min-width:46px}.btnLang{min-width:52px}.container{padding:10px}.card{padding:14px;border-radius:18px}.h1{font-size:24px}.studyBox{padding:15px;border-radius:17px}.koSentence{font-size:25px}.mnSentence{font-size:20px}.analysisText{font-size:15px}.navRow{grid-template-columns:1fr 1fr}.counter{grid-column:1/-1;grid-row:1;text-align:center}.navRow .prev{grid-column:1;grid-row:2;width:100%}.navRow .next{grid-column:2;grid-row:2;width:100%;min-width:0}.btnCheck{width:100%}}
    @media(max-width:480px){.topbar{padding:7px 8px}.brand{font-size:13px;gap:7px}.dot{width:8px;height:8px}.right{gap:5px}.btn{min-height:44px;padding:8px 9px}.btnBack{min-width:44px}.btnLang{min-width:48px}.container{padding:7px}.card{padding:10px;border-radius:16px}.h1{font-size:21px;line-height:1.28}.muted{font-size:13px;line-height:1.55}.studyBox{padding:11px;border-radius:15px}.sectionBadge{font-size:12px;padding:6px 9px}.questionNo{margin-top:14px}.koSentence{font-size:22px;line-height:1.48;margin-top:8px}.practiceHint{font-size:13px}.checkRow{margin-top:16px}.mnSentence{font-size:18px}.analysisText{font-size:14px;line-height:1.65}.answerCard{padding:12px}.navRow{gap:8px}.navRow .prev,.navRow .next{font-size:14px}.completeTitle{font-size:22px}}
  </style>

<body>
  <header class="topbar">
    <div class="brand"><span class="dot"></span><a id="brandLink" href="../index.html">Korean Quiz</a></div>
    <div class="right">
      <span class="pill" id="pillName">학습자: -</span>
      <span class="pill" id="pillToken">token: -</span>
      <button class="btn btnBack" id="btnBack" type="button" aria-label="back">←</button>
      <button class="btn btnLang" id="btnLang" type="button">KR</button>
      <a class="btn btnHome" id="btnHome" href="../index.html">홈</a>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <div class="titleRow">
        <div>
          <h1 class="h1" id="title">TOPIK I · 읽기평가</h1>
          <div class="muted" id="subtitle">불러오는 중...</div>
        </div>
        <div class="muted small" id="status"></div>
      </div>

      <div class="contentEditorControls" id="contentEditorControls" hidden><span class="editorBadge">개발자 콘텐츠 편집</span><span class="editedMark" id="contentEditCount"></span><button class="editModeBtn" id="toggleContentEditMode" type="button">수정 모드 OFF</button></div>
      <div id="studyArea" class="hidden">
        <div class="progressMeta"><span id="progressText">1 / 50</span><span id="progressPercent">2%</span></div>
        <div class="progressTrack"><div class="progressFill" id="progressFill"></div></div>
        <div class="studyBox" id="studyBox"></div>
      </div>

      <div class="notice hidden" id="notice"></div>
      <div class="err hidden" id="err"></div>
    </section>
  </main>

  <script>
    const SCRIPT_URL="https://script.google.com/macros/s/AKfycbz6WBgnJXTAperJK2NwX-VwkmPEQrU4SluCcXjbmYYgcywYM2AcHZwkymBse6E9Kaqg/exec";
    const DEVICE_KEY="kq_deviceId_v1";
    const I18N={
      KR:{
        home:'홈', learner:'학습자: ', loading:'불러오는 중...', loaded:'로드 완료',
        reading:'읽기평가', sentence:'한국어 문장', hint:'한국어 문장을 먼저 읽고 몽골어로 직접 번역해 보세요.',
        check:'번역 확인', hide:'번역 숨기기', translation:'몽골어 번역', analysis:'문장 분석', vocab:'어휘·표현', grammar:'문법', structure:'문장 구조',
        prev:'이전', next:'다음', finish:'학습 완료', prepared:'아직 이 단계의 학습 데이터가 준비되지 않았습니다.',
        backLevels:'레벨 선택으로 돌아가기', completeTitle:'Level 1 학습 완료', completeBody:'50개의 한국어 문장을 모두 확인했습니다.', restart:'1단계 다시 학습',
        loadError:'학습 데이터를 불러오지 못했습니다.'
      },
      MN:{
        home:'Нүүр', learner:'Сурагч: ', loading:'Ачаалж байна...', loaded:'Ачааллаа',
        reading:'Унших дасгал', sentence:'Солонгос өгүүлбэр', hint:'Солонгос өгүүлбэрийг эхлээд өөрөө монгол хэл рүү орчуулж үзээрэй.',
        check:'Орчуулгыг шалгах', hide:'Орчуулгыг нуух', translation:'Монгол орчуулга', analysis:'1. Өгүүлбэрийн задлал', grammar:'2. Дүрэм', vocab:'3. Үг, хэллэг', structure:'Өгүүлбэрийн бүтэц',
        prev:'Өмнөх', next:'Дараах', finish:'Сургалт дуусгах', prepared:'Энэ шатны сургалтын өгөгдөл хараахан бэлэн болоогүй байна.',
        backLevels:'Шат сонгох руу буцах', completeTitle:'Level 1 дууслаа', completeBody:'50 солонгос өгүүлбэрийг бүгдийг нь шалгалаа.', restart:'1-р шатыг дахин сурах',
        loadError:'Сургалтын өгөгдлийг уншиж чадсангүй.'
      }
    };

    const $=id=>document.getElementById(id);
    const params=new URL(location.href).searchParams;
    const cat=params.get('cat')||'reading';
    const levelNo=Math.max(1,parseInt(params.get('level')||'1',10)||1);
    const level=String(levelNo).padStart(2,'0');
    let DATA=null,index=0,revealed=false;
    let CONTENT_CAN_EDIT=false,CONTENT_EDIT_MODE=false,CURRENT_EDIT_ITEM=null;
    const CONTENT_OVERRIDES=new Map(),CONTENT_ORIGINALS=new Map();


    function getDeviceId_(){let id=localStorage.getItem(DEVICE_KEY)||"";if(!id){id="dev_"+Math.random().toString(16).slice(2)+"_"+Date.now().toString(16);localStorage.setItem(DEVICE_KEY,id)}return id}
    function jsonpRequest_(query,timeoutMs=10000){return new Promise((resolve,reject)=>{const cb="cb_topik1_read_edit_"+Date.now()+"_"+Math.floor(Math.random()*1e6),script=document.createElement("script");let done=false;const cleanup=()=>{try{delete window[cb]}catch(e){window[cb]=undefined}if(script.parentNode)script.parentNode.removeChild(script)};const timer=setTimeout(()=>{if(done)return;done=true;cleanup();reject(new Error("timeout"))},timeoutMs);window[cb]=data=>{if(done)return;done=true;clearTimeout(timer);cleanup();resolve(data)};script.onerror=()=>{if(done)return;done=true;clearTimeout(timer);cleanup();reject(new Error("load_error"))};script.src=SCRIPT_URL+(SCRIPT_URL.includes("?")?"&":"?")+new URLSearchParams({...query,callback:cb}).toString();document.head.appendChild(script)})}
    function contentIdentity_(){return {token:(params.get("token")||"").trim(),name:(params.get("name")||"").trim(),deviceId:getDeviceId_()}}
    function contentScope_(){return {area:"TOPIK1",book:"TOPIK1",lesson:String(levelNo),section:"reading"}}
    function cloneReading_(item){return JSON.parse(JSON.stringify({section:item&&item.section||"",ko:item&&item.ko||"",mn:item&&item.mn||"",structure:item&&item.structure||"",analysis_rows:Array.isArray(item&&item.analysis_rows)?item.analysis_rows:[],grammar:item&&item.grammar||"",grammar_mn:Array.isArray(item&&item.grammar_mn)?item.grammar_mn:[],vocab:item&&item.vocab||"",vocab_mn:Array.isArray(item&&item.vocab_mn)?item.vocab_mn:[]}))}
    function applyReading_(item,payload){if(!item||!payload)return;["section","ko","mn","structure","analysis_rows","grammar","grammar_mn","vocab","vocab_mn"].forEach(k=>{if(Object.prototype.hasOwnProperty.call(payload,k))item[k]=JSON.parse(JSON.stringify(payload[k]))})}
    function updateContentEditorControls_(){const box=$("contentEditorControls"),toggle=$("toggleContentEditMode"),count=$("contentEditCount");if(box)box.hidden=!CONTENT_CAN_EDIT;if(toggle){toggle.textContent=CONTENT_EDIT_MODE?"\uc218\uc815 \ubaa8\ub4dc ON":"\uc218\uc815 \ubaa8\ub4dc OFF";toggle.classList.toggle("active",CONTENT_EDIT_MODE)}if(count)count.textContent=CONTENT_OVERRIDES.size?`\uc218\uc815\ubcf8 ${CONTENT_OVERRIDES.size}\uac1c \uc801\uc6a9 \uc911`:""}
    async function loadContentOverrides_(){CONTENT_CAN_EDIT=false;CONTENT_OVERRIDES.clear();CONTENT_ORIGINALS.clear();const list=(DATA&&DATA.items)||[];list.forEach(item=>CONTENT_ORIGINALS.set(String(item.id),cloneReading_(item)));const id=contentIdentity_(),scope=contentScope_();if(!id.token){updateContentEditorControls_();return}try{const r=await jsonpRequest_({action:"content_overrides",token:id.token,deviceId:id.deviceId,name:id.name,area:scope.area,book:scope.book,lesson:scope.lesson,section:scope.section});if(r&&r.ok){CONTENT_CAN_EDIT=r.canEdit===true;(r.items||[]).forEach(entry=>{const key=String(entry&&entry.itemId||""),item=list.find(x=>String(x&&x.id)===key);if(item&&entry.payload){CONTENT_OVERRIDES.set(key,cloneReading_(entry.payload));applyReading_(item,entry.payload)}})}}catch(e){}updateContentEditorControls_()}
    function analysisToText_(rows){return (rows||[]).map(r=>`${String(r&&r.ko||"")} || ${String(r&&r.mn||"")}`).join("\n")}
    function textToAnalysis_(text){return String(text||"").split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(line=>{const parts=line.split("||");return {ko:String(parts.shift()||"").trim(),mn:String(parts.join("||")||"").trim()}}).filter(x=>x.ko||x.mn)}
    function listToText_(v){return Array.isArray(v)?v.join("\n"):""}
    function textToList_(v){return String(v||"").split(/\r?\n/).map(x=>x.trim()).filter(Boolean)}
    function ensureEditorModal_(){let m=$("contentEditorModal");if(m)return m;m=document.createElement("div");m.id="contentEditorModal";m.className="editorModal";m.hidden=true;document.body.appendChild(m);return m}
    function setEditorBusy_(busy){["editorSave","editorRestore","editorCancel"].forEach(id=>{const el=$(id);if(el)el.disabled=!!busy})}
    function setEditorMessage_(msg,bad){const el=$("editorMessage");if(!el)return;el.textContent=msg||"";el.className="editorMessage "+(msg?(bad?"bad":"ok"):"")}
    function closeEditor_(){const m=$("contentEditorModal");if(m)m.hidden=true;CURRENT_EDIT_ITEM=null}
    function openReadingEditor_(item){if(!CONTENT_CAN_EDIT||!CONTENT_EDIT_MODE||!item)return;CURRENT_EDIT_ITEM=item;const key=String(item.id),m=ensureEditorModal_();m.innerHTML=`<div class="editorDialog"><h2>TOPIK I \uc77d\uae30 \uc218\uc815</h2><div class="editorMeta">Level ${levelNo} \u00b7 ${key}\ubc88</div><label class="editorField">\uad6c\uc5ed\uba85<input id="edSection" type="text"></label><div class="editorGrid"><label class="editorField">\ud55c\uad6d\uc5b4 \ubb38\uc7a5<textarea id="edKo"></textarea></label><label class="editorField">\ubabd\uace8\uc5b4 \ubc88\uc5ed<textarea id="edMn"></textarea></label></div><label class="editorField">\ubb38\uc7a5 \uad6c\uc870<textarea id="edStructure"></textarea></label><label class="editorField">\ubb38\uc7a5 \ubd84\uc11d (\ud55c \uc904\uc5d0 \ud55c\uad6d\uc5b4 || \ubabd\uace8\uc5b4)<textarea id="edAnalysis"></textarea></label><div class="editorGrid"><label class="editorField">\ubb38\ubc95 \uc124\uba85<textarea id="edGrammar"></textarea></label><label class="editorField">\ubb38\ubc95 \ud45c\uc2dc \ud56d\ubaa9 (\ud55c \uc904\uc529)<textarea id="edGrammarMn"></textarea></label><label class="editorField">\uc5b4\ud718 \uc124\uba85<textarea id="edVocab"></textarea></label><label class="editorField">\uc5b4\ud718 \ud45c\uc2dc \ud56d\ubaa9 (\ud55c \uc904\uc529)<textarea id="edVocabMn"></textarea></label></div><div class="editorHelp">\ud604\uc7ac \ud654\uba74\uc5d0 \ubcf4\uc774\ub294 \uc77d\uae30 \ubb38\uc7a5, \ubc88\uc5ed, \ubd84\uc11d, \ubb38\ubc95, \uc5b4\ud718\ub97c \ud55c \ubc88\uc5d0 \uc218\uc815\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.</div><div class="editorMessage" id="editorMessage"></div><div class="editorActions"><button id="editorRestore" class="restore" type="button" style="${CONTENT_OVERRIDES.has(key)?"":"display:none"}">\uc6d0\ubcf8\uc73c\ub85c \ubcf5\uc6d0</button><button id="editorCancel" type="button">\ucde8\uc18c</button><button id="editorSave" class="save" type="button">\uc800\uc7a5</button></div></div>`;$("edSection").value=item.section||"";$("edKo").value=item.ko||"";$("edMn").value=item.mn||"";$("edStructure").value=item.structure||"";$("edAnalysis").value=analysisToText_(item.analysis_rows);$("edGrammar").value=item.grammar||"";$("edGrammarMn").value=listToText_(item.grammar_mn);$("edVocab").value=item.vocab||"";$("edVocabMn").value=listToText_(item.vocab_mn);$("editorCancel").onclick=closeEditor_;$("editorSave").onclick=saveReadingEditor_;$("editorRestore").onclick=restoreReadingEditor_;m.hidden=false}
    async function saveReadingEditor_(){const item=CURRENT_EDIT_ITEM;if(!item)return;const payload={section:String($("edSection").value||"").trim(),ko:String($("edKo").value||"").trim(),mn:String($("edMn").value||"").trim(),structure:String($("edStructure").value||"").trim(),analysis_rows:textToAnalysis_($("edAnalysis").value),grammar:String($("edGrammar").value||"").trim(),grammar_mn:textToList_($("edGrammarMn").value),vocab:String($("edVocab").value||"").trim(),vocab_mn:textToList_($("edVocabMn").value)};if(!payload.ko){setEditorMessage_("\ud55c\uad6d\uc5b4 \ubb38\uc7a5\uc744 \uc785\ub825\ud574 \uc8fc\uc138\uc694.",true);return}setEditorBusy_(true);const id=contentIdentity_(),scope=contentScope_(),itemId=String(item.id);try{const r=await jsonpRequest_({action:"content_override_save",token:id.token,deviceId:id.deviceId,name:id.name,area:scope.area,book:scope.book,lesson:scope.lesson,section:scope.section,itemId,payload:JSON.stringify(payload)});if(!r||r.ok!==true)throw new Error(String(r&&r.error||"save_failed"));CONTENT_OVERRIDES.set(itemId,cloneReading_(payload));applyReading_(item,payload);updateContentEditorControls_();setEditorMessage_("\uc800\uc7a5\ub418\uc5c8\uc2b5\ub2c8\ub2e4.",false);setTimeout(()=>{closeEditor_();render()},260)}catch(e){setEditorBusy_(false);setEditorMessage_("\uc800\uc7a5 \uc2e4\ud328: "+(e&&e.message?e.message:"network_error"),true)}}
    async function restoreReadingEditor_(){const item=CURRENT_EDIT_ITEM;if(!item)return;setEditorBusy_(true);const id=contentIdentity_(),scope=contentScope_(),itemId=String(item.id);try{const r=await jsonpRequest_({action:"content_override_restore",token:id.token,deviceId:id.deviceId,name:id.name,area:scope.area,book:scope.book,lesson:scope.lesson,section:scope.section,itemId});if(!r||r.ok!==true)throw new Error(String(r&&r.error||"restore_failed"));CONTENT_OVERRIDES.delete(itemId);const o=CONTENT_ORIGINALS.get(itemId);if(o)applyReading_(item,o);updateContentEditorControls_();setEditorMessage_("\uc6d0\ubcf8\uc73c\ub85c \ubcf5\uc6d0\ub418\uc5c8\uc2b5\ub2c8\ub2e4.",false);setTimeout(()=>{closeEditor_();render()},260)}catch(e){setEditorBusy_(false);setEditorMessage_("\ubcf5\uc6d0 \uc2e4\ud328: "+(e&&e.message?e.message:"network_error"),true)}}
    function getLang(){
      const q=(params.get('lang')||'').toUpperCase();
      const st=(localStorage.getItem('kq_lang')||localStorage.getItem('lang')||'').toUpperCase();
      const pick=(q==='KR'||q==='MN')?q:st;
      return pick==='MN'?'MN':'KR';
    }
    function tr(k){return (I18N[getLang()]&&I18N[getLang()][k])||I18N.KR[k]||k}
    function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function pass(extra={}){
      const p=new URLSearchParams();
      ['name','klass','token','lang'].forEach(k=>{const v=params.get(k);if(v)p.set(k,v)});
      if(!p.get('lang'))p.set('lang',getLang());
      Object.entries(extra).forEach(([k,v])=>{if(v!==undefined&&v!==null)p.set(k,String(v))});
      return p;
    }
    function withQS(url,extra={}){const p=pass(extra);return url+(url.includes('?')?'&':'?')+p.toString()}
    function levelIndexUrl(){return withQS('./index.html')}

    function applyTop(){
      document.documentElement.lang=getLang()==='MN'?'mn':'ko';
      $('brandLink').href=withQS('../index.html');
      $('btnHome').href=withQS('../index.html');
      $('btnHome').textContent=tr('home');
      $('btnLang').textContent=getLang();
      $('pillName').textContent=tr('learner')+(params.get('name')||'-');
      $('pillToken').textContent='token: '+(params.get('token')||'-');
      if(DATA){
        $('title').textContent=getLang()==='MN'?(DATA.title_mn||DATA.title_kr):DATA.title_kr;
        $('subtitle').textContent=getLang()==='MN'?(DATA.description_mn||DATA.description_kr):DATA.description_kr;
        render();
      }
    }

    function answerBlock(label,text,cls=''){
      if(!text)return '';
      return `<div class="answerCard ${cls}"><div class="answerLabel">${esc(label)}</div><div class="${cls==='translation'?'mnSentence':cls==='structure'?'analysisText structure':'analysisText'}">${esc(text)}</div></div>`;
    }

    function render(){
      const items=(DATA&&Array.isArray(DATA.items))?DATA.items:[];
      if(!items.length)return;
      index=Math.max(0,Math.min(index,items.length-1));
      const item=items[index], n=index+1, total=items.length, pct=Math.round(n/total*100);
      $('progressText').textContent=`${n} / ${total}`;
      $('progressPercent').textContent=`${pct}%`;
      $('progressFill').style.width=`${pct}%`;
      $('status').textContent=`${n} / ${total}`;
      const nextLabel=n===total?tr('finish'):tr('next');
      const itemId=String(item.id??n),editBar=(CONTENT_CAN_EDIT&&CONTENT_EDIT_MODE)?`<div class="itemEditorBar"><span class="editorBadge">개발자 편집</span>${CONTENT_OVERRIDES.has(itemId)?'<span class="editedMark">● 수정본 적용됨</span>':''}<button class="editItemBtn" id="editCurrentReading" type="button">✏ 현재 읽기 수정</button></div>`:"";
      $('studyBox').innerHTML=`
        ${editBar}
        ${item.section?`<div class="sectionBadge">${esc(item.section)}</div>`:''}
        <div class="questionNo">${esc(tr('sentence'))} ${esc(item.id??n)}</div>
        <div class="koSentence">${esc(item.ko)}</div>
        <div class="practiceHint">${esc(tr('hint'))}</div>
        <div class="checkRow"><button class="btn btnCheck" id="btnCheck" type="button">${esc(revealed?tr('hide'):tr('check'))}</button></div>
        <div class="answerWrap ${revealed?'':'hidden'}" id="answerWrap">
          ${answerBlock(tr('translation'),item.mn,'translation')}
          ${answerBlock(tr('analysis'),Array.isArray(item.analysis_rows)?item.analysis_rows.map(r=>`${r.ko} → ${r.mn}`).join('\n'):item.structure)}
          ${answerBlock(tr('grammar'),Array.isArray(item.grammar_mn)?item.grammar_mn.join('\n'):item.grammar)}
          ${answerBlock(tr('vocab'),Array.isArray(item.vocab_mn)?item.vocab_mn.join('\n'):item.vocab)}
        </div>
        <div class="navRow">
          <button class="btn prev" id="btnPrev" type="button" ${index===0?'disabled':''}>← ${esc(tr('prev'))}</button>
          <span class="counter">${n} / ${total}</span>
          <button class="btn next" id="btnNext" type="button">${esc(nextLabel)} ${n===total?'✓':'→'}</button>
        </div>`;
      const editReading=$('editCurrentReading');if(editReading)editReading.onclick=()=>openReadingEditor_(item);
      $('btnCheck').onclick=()=>{revealed=!revealed;render()};
      $('btnPrev').onclick=()=>{if(index>0){index--;revealed=false;render();scrollStudyTop()}};
      $('btnNext').onclick=()=>{if(index<items.length-1){index++;revealed=false;render();scrollStudyTop()}else showComplete(items.length)};
    }

    function scrollStudyTop(){
      const y=$('studyArea').getBoundingClientRect().top+window.scrollY-78;
      window.scrollTo({top:Math.max(0,y),behavior:'smooth'});
    }

    function showComplete(total){
      $('progressText').textContent=`${total} / ${total}`;$('progressPercent').textContent='100%';$('progressFill').style.width='100%';$('status').textContent=`${total} / ${total}`;
      const completeTitle=getLang()==='MN'?`Level ${levelNo} дууслаа`:`Level ${levelNo} 학습 완료`;
      const restartLabel=getLang()==='MN'?`${levelNo}-р шатыг дахин сурах`:`${levelNo}단계 다시 학습`;
      const completeBody=getLang()==='MN'?`${total} солонгос өгүүлбэрийг бүгдийг нь шалгалаа.`:`${total}개의 한국어 문장을 모두 확인했습니다.`;
      $('studyBox').innerHTML=`<div class="complete"><div class="completeIcon">✅</div><div class="completeTitle">${esc(completeTitle)}</div><div class="muted">${esc(completeBody)}</div><div class="completeBtns"><button class="btn" id="btnRestart" type="button">${esc(restartLabel)}</button><a class="btn next" href="${esc(levelIndexUrl())}">${esc(tr('backLevels'))}</a></div></div>`;
      $('btnRestart').onclick=()=>{index=0;revealed=false;render();scrollStudyTop()};
    }

    async function init(){
      applyTop();
      $('status').textContent=tr('loading');
      $('toggleContentEditMode').onclick=()=>{if(!CONTENT_CAN_EDIT)return;CONTENT_EDIT_MODE=!CONTENT_EDIT_MODE;updateContentEditorControls_();render()};
      $('btnBack').onclick=()=>{location.href=levelIndexUrl()};
      $('btnLang').onclick=()=>{
        const next=getLang()==='KR'?'MN':'KR';
        localStorage.setItem('kq_lang',next);localStorage.setItem('lang',next);
        params.set('lang',next);history.replaceState(null,'',`${location.pathname}?${params.toString()}${location.hash}`);applyTop();
      };
      const path=`../data/topik1/${encodeURIComponent(cat)}/level${level}.json`;
      try{
        const res=await fetch(new URL(path,location.href),{cache:'no-store'});
        if(!res.ok){
          if(res.status===404){
            $('status').textContent='';$('subtitle').textContent='';$('notice').textContent=`Level ${levelNo}: ${tr('prepared')}`;$('notice').classList.remove('hidden');return;
          }
          throw new Error('HTTP '+res.status);
        }
        DATA=await res.json();
        await loadContentOverrides_();
        document.title=getLang()==='MN'?(DATA.title_mn||DATA.title_kr||document.title):(DATA.title_kr||document.title);
        if(!Array.isArray(DATA.items)||DATA.items.length!==50)throw new Error(`문항 수 오류: ${Array.isArray(DATA.items)?DATA.items.length:0}`);
        $('studyArea').classList.remove('hidden');$('status').textContent=tr('loaded');applyTop();
      }catch(e){
        $('status').textContent='';$('err').textContent=`${tr('loadError')}\n${e.message||e}\n${path}`;$('err').classList.remove('hidden');
      }
    }
    init();
  </script>
</body>
</html>
