<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TOPIK I 읽기 평가</title>
<style>
:root{--bg:#0b1220;--card:#111827;--card2:#0b1020;--text:#e5e7eb;--muted:#9ca3af;--line:#243044;--blue:#60a5fa;--green:#34d399;--amber:#fbbf24;--red:#f87171}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans KR",Arial,sans-serif;background:linear-gradient(180deg,#050814,var(--bg));color:var(--text)}a{color:inherit;text-decoration:none}button{font:inherit;touch-action:manipulation}.hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;background:rgba(5,8,20,.9);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:8px;font-weight:950;white-space:nowrap}.dot{width:9px;height:9px;border-radius:50%;background:var(--blue)}.right{display:flex;gap:6px;align-items:center;min-width:0}.pill{padding:8px 11px;border-radius:999px;border:1px solid var(--line);background:rgba(11,16,32,.7);color:var(--muted);font-size:12px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}.btn{min-height:44px;padding:9px 12px;border-radius:13px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-weight:900;cursor:pointer}.btnBack{border-color:rgba(96,165,250,.5)}.btnLang{border-color:rgba(52,211,153,.5)}.btnHome{border-color:rgba(248,113,113,.45)}
.container{max-width:980px;margin:0 auto;padding:12px}.card{background:rgba(17,24,39,.94);border:1px solid var(--line);border-radius:18px;padding:14px}.titleRow{display:flex;justify-content:space-between;gap:10px;align-items:flex-end;flex-wrap:wrap}.h1{font-size:24px;font-weight:950;margin:0}.muted{color:var(--muted);line-height:1.55}.small{font-size:12px}.bar{height:1px;background:var(--line);margin:12px 0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.typeCard{min-height:108px;padding:13px 12px;border-radius:16px;border:1px solid rgba(96,165,250,.35);background:linear-gradient(145deg,rgba(96,165,250,.10),rgba(11,16,32,.95));color:var(--text);text-align:left;cursor:pointer}.typeCard.locked{opacity:.48;cursor:not-allowed;filter:saturate(.55)}.typeHead{display:flex;align-items:center;gap:9px}.typeNo{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:rgba(96,165,250,.14);border:1px solid rgba(96,165,250,.45);color:#bfdbfe;font-weight:950}.typeTitle{font-size:16px;font-weight:950}.typeMeta{display:flex;justify-content:space-between;gap:8px;margin-top:10px;color:#bfdbfe;font-size:11px;font-weight:850;flex-wrap:wrap}.notice{margin-top:12px;padding:10px;border-radius:12px;border:1px solid rgba(96,165,250,.35);background:rgba(96,165,250,.08);color:#bfdbfe;font-size:12px;line-height:1.5;text-align:center}
.stagePanel{margin-top:12px;padding:13px;border:1px solid rgba(52,211,153,.35);background:rgba(52,211,153,.06);border-radius:16px}.stageTitle{font-size:18px;font-weight:950}.stageHelp{margin-top:4px;color:var(--muted);font-size:12px;line-height:1.5}.stageGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:11px}.stageBtn{min-height:86px;padding:12px;border:1px solid rgba(52,211,153,.42);border-radius:14px;background:linear-gradient(145deg,rgba(52,211,153,.10),rgba(11,16,32,.95));color:var(--text);cursor:pointer;text-align:left}.stageBtn.locked{opacity:.42;cursor:not-allowed;filter:saturate(.55)}.stageName{font-size:17px;font-weight:950}.stageMeta{margin-top:6px;color:#a7f3d0;font-size:11px;font-weight:850;line-height:1.45}.stageTag{display:inline-block;margin-top:7px;padding:4px 7px;border-radius:999px;background:rgba(251,191,36,.10);border:1px solid rgba(251,191,36,.30);color:#fde68a;font-size:10px;font-weight:900}
.blocked{max-width:680px;margin:40px auto;padding:24px;text-align:center}
@media(max-width:760px){.pill{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.container{padding:9px}.card{padding:11px}.h1{font-size:22px}.typeCard{min-height:100px}.stageGrid{grid-template-columns:1fr}.stageBtn{min-height:74px}}
@media(max-width:360px){.grid{grid-template-columns:1fr}.typeCard{min-height:86px}.brand{font-size:13px}.btn{padding:8px 9px}}
</style>
  <script src="../js/kq-session.js?v=20261001" data-kq-session></script>
</head>
<body>
<header class="topbar"><div class="brand"><span class="dot"></span><a id="brandLink" href="../index.html">Korean Quiz</a></div><div class="right"><span class="pill" id="pillName">학습자: -</span><span class="pill" id="pillToken">token: -</span><button id="btnBack" class="btn btnBack">←</button><button id="langBtn" class="btn btnLang">KR</button><a id="btnHome" class="btn btnHome" href="../index.html">홈</a></div></header>
<main id="app" class="container hidden"><section class="card"><div class="titleRow"><div><h1 id="pageTitle" class="h1">TOPIK I 읽기 평가</h1><div id="introText" class="muted"></div></div><div id="status" class="muted small"></div></div><div class="bar"></div><section id="typeGrid" class="grid"></section><section id="stagePanel" class="stagePanel hidden"><div id="stageTitle" class="stageTitle">1유형 · 중심 화제</div><div id="stageHelp" class="stageHelp"></div><div id="stageGrid" class="stageGrid"></div></section><div id="stepNotice" class="notice"></div></section></main>
<main id="blocked" class="blocked card hidden"><div style="font-size:38px">🔐</div><h2 id="blockedTitle">로그인이 필요합니다</h2><p id="blockedText" class="muted"></p><a id="loginLink" class="btn btnHome" href="../index.html">로그인 화면으로 돌아가기</a></main>
<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbz6WBgnJXTAperJK2NwX-VwkmPEQrU4SluCcXjbmYYgcywYM2AcHZwkymBse6E9Kaqg/exec",DEVICE_KEY="kq_deviceId_v1",SESSION_KEY="kq_session_v1",AUTO_LOGOUT_MIN=30;
const TYPES=[{no:1,range:"31~33",kr:"중심 화제",mn:"Гол сэдэв"},{no:2,range:"34~39",kr:"빈칸 채우기",mn:"Хоосон зай нөхөх"},{no:3,range:"40~42",kr:"실용문 정보",mn:"Хэрэглээний мэдээлэл"},{no:4,range:"43~45",kr:"세부 내용",mn:"Дэлгэрэнгүй агуулга"},{no:5,range:"46~48",kr:"중심 내용",mn:"Гол агуулга"},{no:6,range:"49~56",kr:"단문 독해",mn:"Богино эх унших"},{no:7,range:"57~58",kr:"문장 순서",mn:"Өгүүлбэрийн дараалал"},{no:8,range:"59~70",kr:"장문 독해",mn:"Урт эх унших"}];
const STAGES_BY_TYPE={
1:[{id:"basic",kr:"기초",mn:"Суурь",count:13,sec:45},{id:"develop",kr:"발전",mn:"Ахиц",count:13,sec:35},{id:"real",kr:"실전",mn:"Шалгалт",count:13,sec:30}],
2:[{id:"basic",kr:"기초",mn:"Суурь",count:26,sec:60},{id:"develop",kr:"발전",mn:"Ахиц",count:26,sec:50},{id:"real",kr:"실전",mn:"Шалгалт",count:26,sec:45}],
3:[{id:"basic",kr:"기초",mn:"Суурь",count:8,sec:90},{id:"develop",kr:"발전",mn:"Ахиц",count:8,sec:75},{id:"real",kr:"실전",mn:"Шалгалт",count:8,sec:60}],
4:[{id:"basic",kr:"기초",mn:"Суурь",count:8,sec:75},{id:"develop",kr:"발전",mn:"Ахиц",count:8,sec:65},{id:"real",kr:"실전",mn:"Шалгалт",count:8,sec:55}],
5:[{id:"basic",kr:"기초",mn:"Суурь",count:8,sec:80},{id:"develop",kr:"발전",mn:"Ахиц",count:8,sec:70},{id:"real",kr:"실전",mn:"Шалгалт",count:8,sec:60}],
6:[{id:"basic",kr:"기초",mn:"Суурь",count:16,sec:90},{id:"develop",kr:"발전",mn:"Ахиц",count:32,sec:80},{id:"real",kr:"실전",mn:"Шалгалт",count:16,sec:70}],
7:[{id:"basic",kr:"기초",mn:"Суурь",count:5,sec:100},{id:"develop",kr:"발전",mn:"Ахиц",count:5,sec:85},{id:"real",kr:"실전",mn:"Шалгалт",count:6,sec:75}],
8:[{id:"s1",kr:"1단계 · 문장 삽입",mn:"1-р шат · Өгүүлбэр оруулах",count:16,sec:80},{id:"s2",kr:"2단계 · 빈칸·내용",mn:"2-р шат · Нөхөх ба агуулга",count:16,sec:90},{id:"s3",kr:"3단계 · 실용문 독해",mn:"3-р шат · Хэрэглээний эх",count:16,sec:80},{id:"s4",kr:"4단계 · 독해 I",mn:"4-р шат · Унших I",count:16,sec:95},{id:"s5",kr:"5단계 · 독해 II",mn:"5-р шат · Унших II",count:16,sec:105},{id:"s6",kr:"6단계 · 장문 실전",mn:"6-р шат · Урт эхийн дадлага",count:16,sec:120}]
};
function stagesFor(typeNo){return STAGES_BY_TYPE[Number(typeNo)]||[{id:"basic",kr:"기초",mn:"Суурь",count:0,sec:0},{id:"develop",kr:"발전",mn:"Ахиц",count:0,sec:0},{id:"real",kr:"실전",mn:"Шалгалт",count:0,sec:0}]}
const $=id=>document.getElementById(id);function getDeviceId(){let id=localStorage.getItem(DEVICE_KEY)||"";if(!id){id="dev_"+Math.random().toString(16).slice(2)+"_"+Date.now().toString(16);localStorage.setItem(DEVICE_KEY,id)}return id}function readSession(){try{const s=JSON.parse(localStorage.getItem(SESSION_KEY)||"null");return s&&s.name&&s.klass&&s.token?s:null}catch(e){return null}}function clearSession(){try{localStorage.removeItem(SESSION_KEY)}catch(e){}}function jsonp(base,p,t=10000){return new Promise((res,rej)=>{const cb="cb_tr_"+Date.now()+"_"+Math.floor(Math.random()*1e6),sc=document.createElement("script");let done=false;const clean=()=>{try{delete window[cb]}catch(e){};sc.remove()};const tm=setTimeout(()=>{if(done)return;done=true;clean();rej(new Error("timeout"))},t);window[cb]=d=>{if(done)return;done=true;clearTimeout(tm);clean();res(d)};sc.onerror=()=>{if(done)return;done=true;clearTimeout(tm);clean();rej(new Error("load_error"))};sc.src=base+(base.includes("?")?"&":"?")+new URLSearchParams({...p,callback:cb});document.head.appendChild(sc)})}
function getLang(){const u=new URL(location.href),q=(u.searchParams.get("lang")||"").toUpperCase(),st=(localStorage.getItem("kq_lang")||localStorage.getItem("lang")||"").toUpperCase();return(q==="MN"||q==="KR"?q:st)==="MN"?"MN":"KR"}function setLang(l){localStorage.setItem("kq_lang",l);localStorage.setItem("lang",l)}function passthrough(){const u=new URL(location.href),p=new URLSearchParams();["name","klass","token","lang"].forEach(k=>{const v=u.searchParams.get(k);if(v)p.set(k,v)});if(!p.get("lang"))p.set("lang",getLang());return p}function withQS(url,extra={}){const p=passthrough();Object.entries(extra).forEach(([k,v])=>p.set(k,String(v)));return url+(url.includes("?")?"&":"?")+p.toString()}
let DEV_ACCESS=false;const PROGRESS_PREFIX="topik1_reading_local_progress_v1_";function progressKey(){const u=new URL(location.href),id=(u.searchParams.get("token")||u.searchParams.get("name")||"guest").trim();return PROGRESS_PREFIX+id}function readProgress(){try{return JSON.parse(localStorage.getItem(progressKey())||"{}")||{}}catch(e){return {}}}function stagePassed(type,stage){const p=readProgress();return !!(p[`t${type}_${stage}`]&&p[`t${type}_${stage}`].passed)}function finalStageId(type){const a=stagesFor(type);return a.length?a[a.length-1].id:"real"}function typeOpen(type){if(DEV_ACCESS)return true;if(type===1)return true;return stagePassed(type-1,finalStageId(type-1))}
function block(reason){$("app").classList.add("hidden");$("blocked").classList.remove("hidden");$("blockedText").textContent="정상 인증으로 다시 로그인해 주세요. "+reason}async function auth(){const u=new URL(location.href),name=(u.searchParams.get("name")||"").trim(),klass=(u.searchParams.get("klass")||"").trim(),token=(u.searchParams.get("token")||"").trim(),s=readSession();if(!name||!klass||!token||!s||s.name!==name||s.klass!==klass||s.token!==token){block("missing_or_mismatched_session");return false}try{const r=await jsonp(SCRIPT_URL,{action:"learning_start",token,deviceId:getDeviceId(),name,klass,book:"TOPIK1"});if(!r||!r.ok){clearSession();block((r&&r.error)||"invalid");return false}DEV_ACCESS=!!(r.developerAccess||r.isDeveloper);window.KQSession.noteValidated();return true}catch(e){block("validation_network_error");return false}}
function showStages(typeNo=1){const mn=getLang()==="MN",type=TYPES.find(x=>x.no===Number(typeNo))||TYPES[0],stages=stagesFor(type.no);$("typeGrid").classList.add("hidden");$("stagePanel").classList.remove("hidden");$("stageTitle").textContent=mn?`${type.no}-р төрөл · ${type.mn}`:`${type.no}유형 · ${type.kr}`;$("stageHelp").textContent=mn?"Өмнөх шатыг 90 ба түүнээс дээш оноогоор тэнцвэл дараагийн шат нээгдэнэ.":"";const implemented=!!STAGES_BY_TYPE[type.no];$("stageGrid").innerHTML=stages.map((st,i)=>{const open=DEV_ACCESS||(i===0?typeOpen(type.no):stagePassed(type.no,stages[i-1].id)),passed=stagePassed(type.no,st.id);return `<button class="stageBtn ${open?'':'locked'}" data-stage="${st.id}" ${open&&implemented?'':'disabled'}><div class="stageName">${mn?st.mn:st.kr}${passed?' ✓':''}</div><div class="stageMeta">${implemented?`${st.count}${mn?' асуулт':'문항'} · ${st.sec}${mn?' сек/асуулт':'초/문항'}`:(open?(mn?'Дараагийн хөгжүүлэлт':'다음 개발 단계'):(mn?'Түгжээтэй':'잠김'))}</div></button>`}).join("");document.querySelectorAll(".stageBtn:not([disabled])").forEach(b=>b.onclick=()=>location.href=withQS("./reading-stage.html",{type:type.no,stage:b.dataset.stage}));history.replaceState(null,"",withQS("./reading-training.html",{type:type.no,view:"stages"}))}
function render(){const mn=getLang()==="MN",u=new URL(location.href);document.documentElement.lang=mn?"mn":"ko";$("pageTitle").textContent=mn?"TOPIK I Унших үнэлгээ":"TOPIK I 읽기 평가";$("introText").textContent=mn?"31~70-р унших даалгаврыг 8 төрөлд хуваан шат дараатай дадлага хийнэ.":"";$("status").textContent="";$("stepNotice").textContent="";$("stepNotice").style.display="none";$("langBtn").textContent=mn?"MN":"KR";$("pillName").textContent=(mn?"Сурагч: ":"학습자: ")+(u.searchParams.get("name")||"-");$("pillToken").textContent="token: "+(u.searchParams.get("token")||"-");$("brandLink").href=withQS("../index.html");$("btnHome").href=withQS("../index.html");$("btnHome").textContent=mn?"Нүүр":"홈";$("typeGrid").classList.remove("hidden");$("typeGrid").innerHTML=TYPES.map(t=>{const open=typeOpen(t.no),done=stagePassed(t.no,finalStageId(t.no)),stageCount=(STAGES_BY_TYPE[t.no]||[]).length;return`<button class="typeCard ${open?'':'locked'}" ${open?'':'disabled'} data-type="${t.no}"><div class="typeHead"><span class="typeNo">${t.no}</span><div class="typeTitle">${mn?t.mn:t.kr}${done?' ✓':''}</div></div><div class="typeMeta"><span>${t.range}</span><span>${open?(stageCount?(mn?`${stageCount} шат`:`${stageCount}단계`):(mn?"Нээлттэй":"개방")):(mn?"Түгжээтэй":"잠김")}</span></div></button>`}).join("");document.querySelectorAll('.typeCard:not([disabled])').forEach(b=>b.onclick=()=>showStages(Number(b.dataset.type)));const requested=Number(u.searchParams.get("type")||0);if(u.searchParams.get("view")==="stages"&&requested&&typeOpen(requested))showStages(requested)}
$("btnBack").onclick=()=>location.href=withQS("./index.html");$("langBtn").onclick=()=>{const next=getLang()==="KR"?"MN":"KR";setLang(next);const u=new URL(location.href);u.searchParams.set("lang",next);history.replaceState(null,"",u);render()};
(async()=>{if(!await auth())return;render();$("app").classList.remove("hidden")})();
</script>
</body></html>
