<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>SNU 문법 연습</title>
  <style>
    :root{--bg:#07101f;--panel:#111a2a;--box:#0b1323;--text:#f3f4f6;--muted:#9fb0ca;--line:#293751;--blue:#3b82f6;--green:#22c55e;--red:#ef4444;--amber:#fbbf24;--violet:#8b5cf6}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#040914,var(--bg));color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",Arial,sans-serif}button{font:inherit}
    header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:rgba(4,9,20,.92);border-bottom:1px solid var(--line)}
    .brand{font-weight:900}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--amber);margin-right:9px}.topBtns,.controls,.tabs{display:flex;gap:8px;flex-wrap:wrap}
    .btn,.tab,.choice{border:1px solid var(--line);color:var(--text);background:#101829;border-radius:14px;cursor:pointer;font-weight:850}.btn{padding:10px 15px;min-height:44px}.btn.back{border-color:#6852a6}.btn.lang{border-color:#168b72}.btn.active{border-color:var(--amber);background:#302715}
    main{max-width:980px;margin:16px auto;padding:0 14px}.card{background:rgba(17,26,42,.94);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 15px 35px rgba(0,0,0,.25)}
    h1{margin:0;font-size:28px}.sub,.muted{color:var(--muted)}.sub{margin-top:5px}.tabs{margin-top:16px;border-bottom:1px solid var(--line);padding-bottom:12px}.tab{padding:10px 16px}.tab.active{border-color:var(--amber);background:linear-gradient(135deg,#3a2c12,#111827)}
    .panel{display:none}.panel.active{display:block}.studyNav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:14px}.studyPick{padding:9px 6px;border:1px solid var(--line);border-radius:12px;background:#0d1627;color:var(--muted);font-weight:850;cursor:pointer}.studyPick.active{color:#fff;border-color:var(--amber);background:#352913}.point{margin-top:10px;padding:16px;background:var(--box);border:1px solid var(--line);border-radius:17px}.point h2{margin:0 0 12px;font-size:23px;color:#fde68a;text-align:center}.patternVisual{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rule{padding:12px 8px;text-align:center;border-radius:14px;background:#17243a;border:1px solid #345177;font-weight:900;line-height:1.45}.rule strong{display:block;color:#93c5fd;font-size:19px}.shortUse{text-align:center;color:var(--muted);margin:12px 0 4px}.ex{margin-top:8px;padding:10px 12px;border-left:3px solid var(--blue);background:#101a2d;border-radius:8px;line-height:1.55}.studyArrows{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:11px}.studyCount{color:var(--muted);font-weight:800}.studyArrow{min-width:92px}
    .quizTop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}.stat{padding:10px;text-align:center;border:1px solid var(--line);background:var(--box);border-radius:14px}.stat small{display:block;color:var(--muted)}.stat b{font-size:20px}.timer.urgent{border-color:var(--red);color:#fecaca}
    .qbox{padding:14px;background:var(--box);border:1px solid var(--line);border-radius:18px}.prompt{padding:16px;text-align:center;font-size:24px;font-weight:900;line-height:1.55;background:#12213a;border:1px solid #29456f;border-radius:14px}.promptDialogue{display:inline-grid;width:max-content;max-width:100%;text-align:left}.promptLine{display:block;overflow-wrap:anywhere}.promptLine.answerLine{display:flex;width:100%;align-items:baseline;white-space:nowrap}.answerBlank{display:inline-block;flex:1 1 auto;min-width:8ch;margin:0 4px 3px;border-bottom:3px solid currentColor}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}.choice{padding:13px;min-height:54px;font-size:18px}.choice:hover{filter:brightness(1.15)}.choice:disabled{cursor:default}.choice.correct{background:#0e442d;border-color:var(--green)}.choice.wrong{background:#4b1720;border-color:var(--red)}
    .feedback{display:none;margin-top:10px;padding:11px;border-radius:12px;border:1px solid var(--line);line-height:1.55}.feedback.ok{display:block;border-color:var(--green);background:#0b3022}.feedback.bad{display:block;border-color:var(--red);background:#3a151b}.summary{text-align:center;padding:28px}.score{font-size:48px;font-weight:950;color:#93c5fd}.wrongList{text-align:left;margin-top:16px}.wrongItem{padding:10px 0;border-bottom:1px solid var(--line);line-height:1.55}.wrongMine{color:#fecaca}.wrongCorrect{color:#d1fae5}
    @media(max-width:650px){.choices,.stats{grid-template-columns:1fr 1fr}.prompt{font-size:20px;padding:13px 10px}.promptDialogue{width:100%}.promptLine.answerLine{white-space:normal}.answerBlank{min-width:6ch}.stat b{font-size:17px}.studyNav{grid-template-columns:repeat(2,1fr)}.patternVisual{grid-template-columns:1fr}.point{padding:13px}.point h2{font-size:21px}}
  </style>
</head>
<body>
<header><div class="brand"><span class="dot"></span><span id="brand">Grammar · SNU</span></div><div class="topBtns"><button class="btn back" id="back">←</button><button class="btn lang" id="lang">KR</button></div></header>
<main><section class="card">
  <h1 id="title">문법</h1><div class="sub" id="subtitle">불러오는 중...</div>
  <div class="tabs"><button class="tab active" data-panel="study" id="studyTab">문법 이해</button><button class="tab" data-panel="practice" id="practiceTab">문법 연습</button></div>
  <div class="panel active" id="study"><div class="studyNav" id="studyNav"></div><div id="points"></div></div>
  <div class="panel" id="practice">
    <div class="quizTop"><div class="muted" id="hint"></div><div class="controls"><button class="btn" id="time10">10초</button><button class="btn active" id="time15">15초</button><button class="btn" id="restart">다시 시작</button></div></div>
    <div id="quiz"></div>
  </div>
</section></main>
<script>
  const $=id=>document.getElementById(id), params=new URL(location.href).searchParams;
  let data=null,state=null,timer=null,seconds=15,studyIndex=0;
  const lang=()=>((params.get('lang')||localStorage.getItem('kq_lang')||'KR').toUpperCase()==='MN'?'MN':'KR');
  const tx=(ko,mn)=>lang()==='MN'?mn:ko;
  function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
  function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function promptLine(s,isAnswer){
    const safe=esc(s),blanked=safe.replace(/_{2,}/g,'<span class="answerBlank" aria-label="빈칸"></span>');
    return `<div class="promptLine ${isAnswer&&safe.includes('__')?'answerLine':''}">${blanked}</div>`;
  }
  function formatPrompt(raw){
    const lines=String(raw||'').split(/\r?\n/);
    if(lines.length<2)return `<span>${esc(raw).replace(/_{2,}/g,'<span class="answerBlank" aria-label="빈칸"></span>')}</span>`;
    return `<div class="promptDialogue">${lines.map((line,i)=>promptLine(line,i>0)).join('')}</div>`;
  }
  function pass(){const p=new URLSearchParams();['data','name','klass','token','lang'].forEach(k=>{const v=params.get(k);if(v)p.set(k,v)});return p.toString()}
  function lessonUrl(){return `../snu/lesson.html?${pass()}`}
  function applyText(){ $('lang').textContent=lang();$('studyTab').textContent=tx('문법 이해','Дүрмийн тайлбар');$('practiceTab').textContent=tx('문법 연습','Дүрмийн дасгал');$('restart').textContent=tx('다시 시작','Дахин эхлэх');$('hint').textContent=tx('모든 문제를 중복 없이 무작위 순서로 풉니다.','Бүх асуултыг давталгүй санамсаргүй дарааллаар ажиллана.'); }
  function show(panel){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.panel===panel));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===panel));if(panel==='practice'&&!state)start()}
  function splitPattern(pattern){const parts=String(pattern||'').split(/\s*\/\s*|\s*·\s*/).filter(Boolean);return parts.length>1?parts:[pattern]}
  function renderStudy(){
    const gs=data.grammar||[];
    if(!gs.length){$('points').innerHTML=`<p class="muted">${tx('문법 자료가 없습니다.','Дүрмийн материал алга.')}</p>`;$('studyNav').innerHTML='';return}
    studyIndex=Math.max(0,Math.min(studyIndex,gs.length-1));
    $('studyNav').innerHTML=gs.map((g,i)=>`<button class="studyPick ${i===studyIndex?'active':''}" data-i="${i}">${i+1}. ${g.title}</button>`).join('');
    document.querySelectorAll('.studyPick').forEach(b=>b.onclick=()=>{studyIndex=Number(b.dataset.i);renderStudy()});
    const g=gs[studyIndex],rules=(g.visual_rules&&g.visual_rules.length?g.visual_rules:splitPattern(g.pattern)).slice(0,2);
    $('points').innerHTML=`<article class="point"><h2>${studyIndex+1}. ${g.title||''}</h2><div class="patternVisual">${rules.map(r=>`<div class="rule">${r}</div>`).join('')}</div><div class="shortUse">${lang()==='MN'?(g.use_mn||''):(g.use_kr||'')}</div>${(g.examples||[]).slice(0,2).map(e=>`<div class="ex"><b>${e.kr||''}</b><br><span class="muted">${e.mn||''}</span></div>`).join('')}<div class="studyArrows"><button class="btn studyArrow" id="studyPrev">← ${tx('이전','Өмнөх')}</button><span class="studyCount">${studyIndex+1} / ${gs.length}</span><button class="btn studyArrow" id="studyNext">${tx('다음','Дараах')} →</button></div></article>`;
    $('studyPrev').disabled=studyIndex===0;$('studyNext').disabled=studyIndex===gs.length-1;
    $('studyPrev').onclick=()=>{if(studyIndex>0){studyIndex--;renderStudy()}};$('studyNext').onclick=()=>{if(studyIndex<gs.length-1){studyIndex++;renderStudy()}};
  }
  function stop(){if(timer){clearInterval(timer);timer=null}}
  function start(){stop();const qs=(data.grammar_questions||[]).filter(q=>q.prompt&&q.correct&&Array.isArray(q.choices));state={queue:shuffle(qs),i:0,correct:0,wrong:0,timeout:0,locked:false,left:seconds,miss:[],resultLogged:false};renderQ()}
  function stats(){return `<div class="stats"><div class="stat"><small>${tx('진행','Явц')}</small><b>${Math.min(state.i+1,state.queue.length)} / ${state.queue.length}</b></div><div class="stat"><small>${tx('정답','Зөв')}</small><b id="c">${state.correct}</b></div><div class="stat"><small>${tx('오답','Буруу')}</small><b id="w">${state.wrong}</b></div><div class="stat timer" id="timerBox"><small>${tx('남은 시간','Үлдсэн хугацаа')}</small><b><span id="left">${state.left}</span>${tx('초',' сек')}</b></div></div>`}
  function update(){if($('c'))$('c').textContent=state.correct;if($('w'))$('w').textContent=state.wrong;if($('left'))$('left').textContent=state.left;if($('timerBox'))$('timerBox').classList.toggle('urgent',state.left<=5)}

  const RESULT_LOG_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz6WBgnJXTAperJK2NwX-VwkmPEQrU4SluCcXjbmYYgcywYM2AcHZwkymBse6E9Kaqg/exec";
  const RESULT_LOG_DEVICE_KEY = "kq_deviceId_v1";

  function resultLogIdentity(){
    return {
      name: params.get('name') || '',
      klass: params.get('klass') || '',
      token: params.get('token') || '',
      deviceId: localStorage.getItem(RESULT_LOG_DEVICE_KEY) || '',
      lang: (params.get('lang') || lang().toLowerCase())
    };
  }

  function sendResultJsonp(payload){
    return new Promise((resolve,reject)=>{
      const cb=`kq_grammar_result_${Date.now()}_${Math.random().toString(36).slice(2)}`;
      const script=document.createElement('script');
      const query=new URLSearchParams({...payload,callback:cb});
      const cleanup=()=>{
        try{delete window[cb]}catch(e){}
        if(script.parentNode)script.parentNode.removeChild(script);
      };
      const wait=setTimeout(()=>{cleanup();reject(new Error('result_log_timeout'))},8000);
      window[cb]=(result)=>{clearTimeout(wait);cleanup();resolve(result)};
      script.onerror=()=>{clearTimeout(wait);cleanup();reject(new Error('result_log_error'))};
      script.src=`${RESULT_LOG_SCRIPT_URL}?${query.toString()}`;
      document.head.appendChild(script);
    });
  }

  function firstLessonNoForLevel(levelRaw){
    const level=String(levelRaw||'').toUpperCase();
    const firstByLevel={"1A":1,"1B":9,"2A":1,"2B":10,"3A":1,"3B":10,"4A":1,"4B":10};
    return firstByLevel[level]||1;
  }

  function lessonSelectionUrl(){
    const p=new URLSearchParams();
    ['name','klass','token','lang'].forEach(k=>{const v=params.get(k);if(v)p.set(k,v)});
    return `../snu/index.html?${p.toString()}`;
  }

  function parseGrammarDataTarget(pathRaw){
    try{
      const u=new URL(String(pathRaw||''),location.href);
      const m=u.pathname.match(/\/data\/snu\/(1A|1B|2A|2B|3A|3B|4A|4B)\/lesson(\d{2})\.json$/i);
      if(!m)return {ok:false,error:'grammar_data_path_invalid'};
      return {ok:true,level:String(m[1]).toUpperCase(),lessonNo:parseInt(m[2],10),url:u.toString()};
    }catch(e){
      return {ok:false,error:'grammar_data_path_invalid'};
    }
  }

  function renderGrammarInvalidAccess(detail){
    stop();
    const tabs=document.querySelector('.tabs');
    if(tabs)tabs.style.display='none';
    document.querySelectorAll('.panel').forEach(el=>el.classList.remove('active'));
    const study=$('study');
    if(study)study.classList.add('active');
    if($('studyNav'))$('studyNav').innerHTML='';
    const isMn=lang()==='MN';
    $('subtitle').textContent=isMn?'Буруу хандалт':'잘못된 접근';
    $('points').innerHTML=`<div class="qbox summary" style="margin-top:14px">
      <div style="font-size:40px;margin-bottom:8px">⚠️</div>
      <div style="font-size:24px;font-weight:900">${isMn?'Буруу хандалт байна':'잘못된 접근입니다'}</div>
      <div style="margin-top:14px;line-height:1.65">${isMn?'Хичээлийн мэдээлэл ба data зам хоорондоо тохирох ёстой.':'문법 페이지의 data 경로와 실제 교재·과 정보가 서로 일치해야 합니다.'}</div>
      ${detail?`<div class="muted" style="margin-top:8px;font-size:12px">${esc(detail)}</div>`:''}
      <button class="btn back" id="invalidBack" style="margin-top:18px">${isMn?'← Хичээл сонголт руу буцах':'← 과 선택으로 돌아가기'}</button>
    </div>`;
    const btn=$('invalidBack');
    if(btn)btn.onclick=()=>location.href=lessonSelectionUrl();
  }

  async function verifyGrammarLessonUnlocked(d){
    const level=String((d&&d.level)||'').toUpperCase();
    const lessonRaw=String((d&&d.lesson)||'');
    const lessonNo=parseInt(lessonRaw.replace(/[^0-9]/g,''),10);
    if(!level||!Number.isFinite(lessonNo)){
      return {allowed:false,error:'lesson_meta_invalid',level,lessonNo:lessonRaw};
    }

    const firstLesson=firstLessonNoForLevel(level);
    const id=resultLogIdentity();
    if(!id.token){
      // 문법 페이지도 첫 과를 포함해 모든 과에서 정상 로그인 토큰을 요구한다.
      return {allowed:false,error:'missing_token',authRequired:true,level,lessonNo,firstLesson};
    }

    try{
      // learning_start 응답으로 토큰 유효성을 먼저 확인한다.
      const accessProfile=await sendResultJsonp({
        action:'learning_start',
        token:id.token,
        name:id.name,
        book:`SNU-${level}`
      });

      if(!accessProfile||accessProfile.ok!==true){
        return {
          allowed:false,
          error:(accessProfile&&accessProfile.error)||'auth_check_failed',
          authRequired:true,
          level,
          lessonNo,
          firstLesson
        };
      }

      if(accessProfile.isDeveloper===true){
        return {allowed:true,level,lessonNo,firstLesson,isDeveloper:true,role:'developer'};
      }

      // 교사 지정 시작 교재보다 낮은 교재는 이전 이수 과정으로 인정하여 문법 전체 접근을 허용한다.
      if(accessProfile.lowerBookAccess===true){
        return {allowed:true,level,lessonNo,firstLesson,lowerBookAccess:true,teacherOverride:true,role:'student'};
      }

      let teacherStartLesson=0;
      if(accessProfile&&accessProfile.ok===true&&accessProfile.found===true&&accessProfile.enabled===true){
        const requested=Number(accessProfile.startLesson||0);
        if(Number.isFinite(requested)&&requested>0){
          teacherStartLesson=Math.max(firstLesson,Math.floor(requested));
        }
      }

      // 교사 지정 시작점까지는 기존 진도로 인정한다.
      if(teacherStartLesson>0&&lessonNo<=teacherStartLesson){
        return {allowed:true,level,lessonNo,firstLesson,teacherStartLesson,teacherOverride:true,role:'student'};
      }

      if(lessonNo===firstLesson){
        return {allowed:true,level,lessonNo,firstLesson,isFirst:true};
      }

      const previousLesson=lessonNo-1;
      const testTypes=['vocab','grammar','mixed'];
      const responses=await Promise.all(testTypes.map(testType=>sendResultJsonp({
        action:'mastery_status',
        token:id.token,
        name:id.name,
        book:`SNU-${level}`,
        lesson:String(previousLesson),
        testType
      })));

      const tests={};
      testTypes.forEach((type,i)=>{tests[type]=responses[i]||{}});
      const allOk=testTypes.every(type=>tests[type]&&tests[type].ok===true);
      const allowed=allOk&&testTypes.every(type=>tests[type].status==='PASS'&&Number(tests[type].bestScore||0)>=90);
      const firstError=testTypes.map(type=>tests[type]).find(r=>!r||r.ok!==true);
      const firstErrorText=firstError?String(firstError.error||'status_check_failed'):'';
      const authRequired=firstErrorText==='expired_or_invalid'||firstErrorText==='missing_token'||firstErrorText==='auth_check_failed';

      return {
        allowed,
        level,
        lessonNo,
        previousLesson,
        previousScores:{
          vocab:Number(tests.vocab.bestScore||0),
          grammar:Number(tests.grammar.bestScore||0),
          mixed:Number(tests.mixed.bestScore||0)
        },
        passScore:90,
        status:allowed?'PASS':'RETRY',
        error:firstErrorText,
        authRequired
      };
    }catch(err){
      return {
        allowed:false,
        error:(err&&err.message)?err.message:'status_check_failed',
        level,
        lessonNo,
        previousLesson:lessonNo-1,
        previousScores:{vocab:0,grammar:0,mixed:0},
        passScore:90,
        status:'NONE'
      };
    }
  }

  function renderGrammarLocked(access,d){
    stop();
    const tabs=document.querySelector('.tabs');
    if(tabs)tabs.style.display='none';
    document.querySelectorAll('.panel').forEach(el=>el.classList.remove('active'));
    const study=$('study');
    if(study)study.classList.add('active');
    if($('studyNav'))$('studyNav').innerHTML='';

    const prev=Number(access&&access.previousLesson||0);
    const scores=(access&&access.previousScores)||{vocab:0,grammar:0,mixed:0};
    const passScore=Number(access&&access.passScore||90);
    const err=String(access&&access.error||'');
    const isMn=lang()==='MN';

    if(access&&access.authRequired){
      const title=isMn?'Нэвтрэх шаардлагатай':'로그인이 필요합니다';
      const rule=isMn
        ? 'Дүрмийн хичээлийг ашиглахын тулд хүчинтэй нэвтрэх эрхээр дахин нэвтэрнэ үү.'
        : '문법 학습을 이용하려면 정상 인증으로 다시 로그인해야 합니다.';
      const detail=err?`<div class="muted" style="margin-top:8px;font-size:12px">${esc(err)}</div>`:'';
      $('subtitle').textContent=isMn?'Нэвтрэх':'인증 필요';
      $('points').innerHTML=`<div class="qbox summary" style="margin-top:14px">
        <div style="font-size:40px;margin-bottom:8px">🔐</div>
        <div style="font-size:24px;font-weight:900">${title}</div>
        <div style="margin-top:14px;line-height:1.65">${rule}</div>
        ${detail}
        <button class="btn back" id="authBack" style="margin-top:18px">${isMn?'← Нэвтрэх дэлгэц рүү буцах':'← 로그인 화면으로 돌아가기'}</button>
      </div>`;
      const authBtn=$('authBack');
      if(authBtn)authBtn.onclick=()=>{location.href='../index.html'};
      const langBtn=$('lang');
      if(langBtn)langBtn.disabled=true;
      return;
    }

    const title=isMn?'Дараагийн хичээл түгжээтэй байна':'다음 과는 아직 잠겨 있습니다';
    const rule=prev>0
      ? (isMn
          ? `${prev}-р хичээлийн үг, дүрэм, нэгдсэн шалгалт тус бүр ${passScore}%-иас дээш байвал энэ хичээл нээгдэнэ.`
          : `${prev}과의 어휘·문법·종합 테스트가 모두 ${passScore}% 이상이어야 이 과가 열립니다.`)
      : (isMn?'Нэвтрэх эрхийг шалгаж чадсангүй.':'학습 접근 권한을 확인할 수 없습니다.');
    const scoreLine=isMn
      ? `Үг ${Number(scores.vocab||0)}% · Дүрэм ${Number(scores.grammar||0)}% · Нэгдсэн ${Number(scores.mixed||0)}%`
      : `어휘 ${Number(scores.vocab||0)}% · 문법 ${Number(scores.grammar||0)}% · 종합 ${Number(scores.mixed||0)}%`;
    const detail=err?`<div class="muted" style="margin-top:8px;font-size:12px">${esc(err)}</div>`:'';
    $('subtitle').textContent=isMn?'Түгжээтэй':'잠김';
    $('points').innerHTML=`<div class="qbox summary" style="margin-top:14px">
      <div style="font-size:40px;margin-bottom:8px">🔒</div>
      <div style="font-size:24px;font-weight:900">${title}</div>
      <div style="margin-top:14px;line-height:1.65">${rule}</div>
      <div class="muted" style="margin-top:8px">${scoreLine}</div>
      ${detail}
      <button class="btn back" id="lockedBack" style="margin-top:18px">${isMn?'← Хичээл сонголт руу буцах':'← 과 선택으로 돌아가기'}</button>
    </div>`;
    const btn=$('lockedBack');
    if(btn)btn.onclick=()=>{location.href=lessonSelectionUrl()};
  }

  function setRecordStatus(message,isError){
    const el=$('recordStatus');
    if(!el)return;
    el.textContent=message;
    el.style.color=isError?'#fecaca':'#9fb0ca';
  }

  async function logGrammarResult(score,correct,total,timeoutCount){
    const id=resultLogIdentity();
    if(!id.token||!id.name||!data){
      setRecordStatus(tx('기록 저장 실패: 로그인 정보가 없습니다.','Бичлэг хадгалж чадсангүй: нэвтрэх мэдээлэл алга.'),true);
      return {ok:false,error:'missing_identity'};
    }
    const level=String(data.level||'');
    const lesson=String(data.lesson||'');
    try{
      const result=await sendResultJsonp({
        action:'log',
        token:id.token,
        deviceId:id.deviceId,
        name:id.name,
        klass:id.klass,
        book:`SNU-${level}`,
        lesson:lesson,
        score:String(score),
        attempts:'1',
        testType:'grammar',
        correct:String(correct),
        total:String(total),
        timeout:String(timeoutCount||0),
        ua:(navigator.userAgent||'').slice(0,300),
        lang:id.lang
      });
      if(result&&result.ok!==false){
        setRecordStatus(tx('학습 기록이 저장되었습니다.','Сургалтын бүртгэл хадгалагдлаа.'),false);
        return result;
      }
      const code=(result&&result.error)?String(result.error):'server_rejected';
      setRecordStatus(tx(`기록 저장 실패: ${code}`,`Бичлэг хадгалж чадсангүй: ${code}`),true);
      console.log('grammar result log rejected:',result);
      return result||{ok:false,error:code};
    }catch(err){
      setRecordStatus(tx('기록 저장 실패: 네트워크 오류','Бичлэг хадгалж чадсангүй: сүлжээний алдаа'),true);
      console.log('grammar result log failed:',err);
      return {ok:false,error:'network_error'};
    }
  }

  function finish(){
    stop();
    const total=state.queue.length,pct=total?Math.round(state.correct/total*100):0;
    $('quiz').innerHTML=`<div class="qbox summary"><div>${tx('문법 연습 완료','Дүрмийн дасгал дууслаа')}</div><div class="score">${pct}%</div><div>${tx('정답','Зөв')} <b>${state.correct}</b> · ${tx('오답','Буруу')} <b>${state.wrong}</b> · ${tx('시간 초과','Хугацаа хэтэрсэн')} <b>${state.timeout}</b></div><div id="recordStatus" class="muted" style="margin-top:10px">${tx('학습 기록 저장 중...','Сургалтын бүртгэлийг хадгалж байна...')}</div>${state.miss.length?`<div class="wrongList"><h3>${tx('틀린 문제와 정답','Алдсан асуулт ба зөв хариулт')}</h3>${state.miss.map((m,i)=>`<div class="wrongItem"><b>${i+1}. ${esc(m.prompt).replace(/\n/g,'<br>')}</b><br><span class="wrongMine">${tx('내 답','Миний хариулт')}: <b>${m.timed?tx('시간 초과','Хугацаа хэтэрсэн'):esc(m.selected||'')}</b></span><br><span class="wrongCorrect">${tx('정답','Зөв хариулт')}: <b>${esc(m.correct)}</b></span></div>`).join('')}</div>`:`<div class="wrongList"><h3>${tx('🎉 모두 맞았습니다.','🎉 Бүгд зөв байна.')}</h3></div>`}</div>`;
    if(!state.resultLogged){
      state.resultLogged=true;
      setTimeout(()=>logGrammarResult(pct,state.correct,total,state.timeout),0);
    }
  }
  function next(){setTimeout(()=>{state.i++;renderQ()},650)}
  function renderQ(){stop();if(!state.queue.length){$('quiz').innerHTML=`<p class="muted">${tx('문법 문제가 없습니다.','Дүрмийн асуулт алга.')}</p>`;return}if(state.i>=state.queue.length){finish();return}state.locked=false;state.left=seconds;const q=state.queue[state.i],choices=shuffle([...new Set(q.choices.concat(q.correct))]);$('quiz').innerHTML=stats()+`<div class="qbox"><div class="prompt">${formatPrompt(q.prompt)}</div><div class="choices">${choices.map(c=>`<button class="choice" data-v="${encodeURIComponent(c)}">${esc(c)}</button>`).join('')}</div><div class="feedback" id="feedback"></div></div>`;document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(decodeURIComponent(b.dataset.v),b,q));update();timer=setInterval(()=>{if(state.locked)return;state.left--;update();if(state.left<=0)answer(null,null,q,true)},1000)}
  function answer(v,btn,q,timed=false){if(state.locked)return;state.locked=true;stop();const ok=v===q.correct;if(ok)state.correct++;else{state.wrong++;if(timed)state.timeout++;state.miss.push({prompt:q.prompt,correct:q.correct,selected:v||'',timed})}document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;const val=decodeURIComponent(b.dataset.v);if(val===q.correct)b.classList.add('correct');else if(b===btn)b.classList.add('wrong')});const f=$('feedback');f.className='feedback '+(ok?'ok':'bad');f.innerHTML=`<b>${ok?tx('정답!','Зөв!'):timed?tx('시간 초과','Хугацаа дууслаа'):tx('오답','Буруу')}</b> · ${q.correct}`;update();next()}
  async function init(){applyText();$('back').onclick=()=>location.href=lessonUrl();$('lang').onclick=()=>{params.set('lang',lang()==='KR'?'MN':'KR');localStorage.setItem('kq_lang',params.get('lang'));location.search=params.toString()};document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>show(t.dataset.panel));$('time10').onclick=()=>{seconds=10;$('time10').classList.add('active');$('time15').classList.remove('active');if(state)start()};$('time15').onclick=()=>{seconds=15;$('time15').classList.add('active');$('time10').classList.remove('active');if(state)start()};$('restart').onclick=start;const path=params.get('data');if(!path){$('subtitle').textContent='data 경로가 없습니다.';return}const target=parseGrammarDataTarget(path);if(!target.ok){renderGrammarInvalidAccess(target.error);return}try{const res=await fetch(target.url,{cache:'no-store'});if(!res.ok)throw Error(res.status);data=await res.json();const actualLevel=String((data&&data.level)||(data&&data.meta&&data.meta.level)||'').toUpperCase();const actualLesson=parseInt(String((data&&data.lesson)||(data&&data.meta&&data.meta.lesson)||'').replace(/[^0-9]/g,''),10);if(actualLevel!==target.level||actualLesson!==target.lessonNo){renderGrammarInvalidAccess(`URL=${target.level}-${target.lessonNo}, DATA=${actualLevel||'?'}-${Number.isFinite(actualLesson)?actualLesson:'?'}`);return}$('title').textContent=`${data.level||''} ${parseInt(data.lesson)||''}과 · ${tx('문법','Дүрэм')}`;$('subtitle').textContent=data.title_mn||'';$('brand').textContent=`Grammar · SNU ${data.level||''}`;const access=await verifyGrammarLessonUnlocked(data);if(!access.allowed){renderGrammarLocked(access,data);return}renderStudy()}catch(e){$('subtitle').textContent='불러오기 오류: '+e.message}}
  init();
</script>
</body></html>
