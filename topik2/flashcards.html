<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>Flashcards</title>
  <style>
    :root{
      --bg:#0b1220;
      --text:#e7ecff;
      --muted:#aab6e6;
      --line:rgba(255,255,255,.10);
      --shadow:0 10px 30px rgba(0,0,0,.35);
      --radius:22px;

      --blueA: rgba(59,130,246,.16);
      --blueB: rgba(59,130,246,.36);

      --greenA: rgba(34,197,94,.14);
      --greenB: rgba(34,197,94,.32);

      --koA: rgba(59,130,246,.14);
      --koB: rgba(59,130,246,.34);

      --mnA: rgba(34,197,94,.14);
      --mnB: rgba(34,197,94,.34);

      --descA: rgba(255,255,255,.06);
      --descB: rgba(255,255,255,.12);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif;
      background: radial-gradient(1000px 800px at 30% -10%, rgba(59,130,246,.35), transparent 55%),
                  radial-gradient(900px 700px at 90% 0%, rgba(34,197,94,.18), transparent 50%),
                  var(--bg);
      color:var(--text);
      min-height:100svh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 18px 14px 22px;
    }
    .wrap{width:min(720px, 100%);}
    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border:1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }

    .topBar{
      padding: 10px 12px;
      border-bottom:1px solid var(--line);
      background: rgba(0,0,0,.16);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .leftTop{display:flex; gap:10px; align-items:center; min-width:0; flex-wrap:wrap;}
    .btnSmall{
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: rgba(231,236,255,.92);
      padding: 10px 12px;
      border-radius: 999px;
      font-weight:900;
      font-size:14px;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
      white-space:nowrap;
    }
    .rightTop{
      display:flex; flex-direction:column; align-items:flex-end; gap:2px;
      color: rgba(231,236,255,.65);
      font-size:12px;
      font-weight:900;
      white-space:nowrap;
    }
    .mono{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;}

    .hdr{padding: 14px 16px 6px; text-align:center;}
    .title{margin:0; font-size:20px; font-weight:1000; letter-spacing:.2px;}
    .subtitle{margin:6px 0 0; color: var(--muted); font-size:13px; font-weight:800; line-height:1.35;}

    .content{padding: 12px 14px 16px;}
    .deckInfo{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.10);
      border-radius: 16px;
    }
    .deckLeft{min-width:0; width:100%;}
    .deckName{
      font-size:14px;
      font-weight:1000;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .deckMeta{
      margin-top:6px;
      font-size:12px;
      color: rgba(231,236,255,.65);
      font-weight:900;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size:12px;
      font-weight:1000;
      color: rgba(231,236,255,.85);
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      padding: 6px 10px;
      border-radius: 999px;
      min-height:32px;
      text-align:center;
      line-height:1.2;
      white-space:nowrap;
    }

    .funcTop{
      display:flex;
      gap:8px;
      flex-wrap:nowrap;
      align-items:center;
      overflow-x:auto;
      -webkit-overflow-scrolling: touch;
      max-width: 100%;
      padding-bottom: 2px;
    }
    .funcTop::-webkit-scrollbar{height:6px}
    .funcTop::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:999px}

    .pillFunc{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size:12px;
      font-weight:1000;
      color: rgba(231,236,255,.95);
      padding: 6px 10px;
      border-radius: 999px;
      min-height:32px;
      text-align:center;
      line-height:1.2;
      white-space:nowrap;
      flex: 0 0 auto;
    }
    .pillFuncKo{ background: var(--koA); border: 1px solid var(--koB); }
    .pillFuncMn{ background: var(--mnA); border: 1px solid var(--mnB); }

    .cardBox{
      margin-top: 12px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(10,15,25,.38);
      padding: 14px 14px 16px;
    }

    .wordRow{
      display:flex;
      justify-content:center;
      align-items:baseline;
      gap: 12px;
      flex-wrap:wrap;
      text-align:center;
      margin: 6px 0 10px;
    }
    .koWord{
      font-size:34px;
      font-weight:1000;
      line-height:1.12;
      margin:0;
      word-break:keep-all;
    }
    .mnWordInline{
      font-size:26px;
      font-weight:1000;
      line-height:1.12;
      opacity:.95;
      margin:0;
      word-break:break-word;
    }

    .descBox{
      margin-top: 4px;
      border-radius: 16px;
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,.10);
      background: linear-gradient(180deg, var(--descA), rgba(0,0,0,.10));
      display:grid;
      grid-template-columns: 1fr;
      gap:10px;
    }
    .descItem{
      border-radius: 14px;
      padding: 8px 10px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.10);
    }
    .descLabel{
      font-size:11px;
      font-weight:1000;
      color: rgba(231,236,255,.62);
      margin-bottom:6px;
    }
    .descText{
      font-size:14px;
      font-weight:900;
      line-height:1.35;
      word-break:keep-all;
      white-space:pre-wrap;
      opacity:.95;
    }

    /* 중요어휘(1/2) 전용: 유의어/반의어 */
    .synAntBox{
      margin-top: 4px;
      border-radius: 16px;
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,.10);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.10));
      display:grid;
      grid-template-columns: 1fr;
      gap:10px;
    }
    .synAntItem{
      border-radius: 14px;
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.10);
      min-height:64px;
    }
    .synLabel{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size:16px;
      font-weight:1000;
      color: rgba(231,236,255,.96);
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.08);
      box-shadow: 0 10px 22px rgba(0,0,0,.20);
      margin-bottom:8px;
      line-height:1.1;
      white-space:nowrap;
    }
    .synText{
      font-size:19px;
      font-weight:900;
      line-height:1.35;
      word-break:keep-all;
      white-space:pre-wrap;
      opacity:.98;
    }

    .exBox{
      margin-top: 10px;
      border-top: 1px dashed rgba(255,255,255,.14);
      padding-top: 10px;
      display:grid;
      grid-template-columns: 1fr;
      gap:10px;
    }
    .exItem{
      border-radius: 16px;
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.12);
    }
    .exKoBox{
      background: linear-gradient(180deg, var(--blueA), rgba(0,0,0,.10));
      border-color: var(--blueB);
    }
    .exMnBox{
      background: linear-gradient(180deg, var(--greenA), rgba(0,0,0,.10));
      border-color: var(--greenB);
    }
    .exLabel{
      font-size:12px;
      font-weight:1000;
      color: rgba(231,236,255,.70);
      margin-bottom:6px;
    }
    .exText{
      font-size:18px;
      font-weight:900;
      line-height:1.35;
      word-break:keep-all;
      white-space:pre-wrap;
    }

    .actions{
      margin-top: 12px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn{
      width:100%;
      border:0;
      border-radius: 18px;
      padding: 15px 14px;
      font-size:20px;
      font-weight:1000;
      color:white;
      cursor:pointer;
      box-shadow: 0 10px 22px rgba(0,0,0,.30);
      transition: transform .06s ease, filter .15s ease;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active{transform: translateY(1px) scale(.99)}
    .btnPrimary{background: linear-gradient(180deg, #4f8cff, #2563eb);}
    .btnGhost{
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.14);
      box-shadow:none;
      color: var(--text);
      font-size:18px;
      padding: 14px 12px;
      border-radius: 18px;
      font-weight:1000;
    }

    .err{
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(239,68,68,.14);
      border:1px solid rgba(239,68,68,.35);
      color: #ffd3d3;
      font-size:14px;
      font-weight:1000;
      text-align:center;
      display:none;
      white-space:pre-wrap;
      line-height:1.4;
    }

    @media (min-width: 720px){
      .exBox{grid-template-columns: 1fr 1fr;}
      .descBox{grid-template-columns: 1fr 1fr;}
      .synAntBox{grid-template-columns: 1fr 1fr;}
    }


    /* STEP30-6: TOPIK II developer content editor */
    .contentEditorControls,.itemEditorBar{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
    .contentEditorControls{margin:10px 0 2px}.contentEditorControls[hidden]{display:none}
    .itemEditorBar{margin:0 0 10px}
    .editorBadge{font-size:12px;color:#fde68a;border:1px solid #7c5d16;background:#2d230d;border-radius:999px;padding:5px 9px;font-weight:850}
    .editModeBtn,.editItemBtn{padding:8px 12px;border:1px solid #d6a726;background:#302715;color:#fde68a;border-radius:11px;cursor:pointer;font-weight:900}
    .editModeBtn.active{background:#644b0e;color:#fff}.editedMark{font-size:12px;color:#86efac;font-weight:850}
    .editorModal{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.72)}
    .editorModal[hidden]{display:none}.editorDialog{width:min(820px,100%);max-height:92vh;overflow:auto;background:#111a2a;border:1px solid #4b5d78;border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.55);padding:18px}
    .editorDialog h2{margin:0 0 4px;color:#fde68a}.editorMeta{color:var(--muted);font-size:13px;margin-bottom:14px}
    .editorField{display:block;margin-top:12px;font-weight:850}.editorField input,.editorField textarea{width:100%;margin-top:6px;border:1px solid #3b4b66;background:#08111f;color:#fff;border-radius:11px;padding:11px 12px;font:inherit}
    .editorField textarea{min-height:76px;resize:vertical;line-height:1.45}.editorGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .editorHelp{margin-top:10px;color:var(--muted);font-size:12px;line-height:1.5}.editorActions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:18px}
    .editorActions button{padding:10px 14px;border-radius:11px;border:1px solid rgba(255,255,255,.16);background:#101829;color:#fff;cursor:pointer;font-weight:900}
    .editorActions .save{border-color:#22c55e;background:#123725}.editorActions .restore{border-color:#ef4444;background:#3a151b}.editorActions button:disabled{opacity:.55;cursor:wait}
    .editorMessage{min-height:20px;margin-top:10px;font-size:13px}.editorMessage.ok{color:#86efac}.editorMessage.bad{color:#fecaca}
    @media(max-width:620px){.editorGrid{grid-template-columns:1fr}}
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card" id="app"></div>
  </div>

<script>
(() => {
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz6WBgnJXTAperJK2NwX-VwkmPEQrU4SluCcXjbmYYgcywYM2AcHZwkymBse6E9Kaqg/exec";

  function getRepoBase(){
    const p = location.pathname.split("/").filter(Boolean);
    return p.length ? ("/" + p[0]) : "";
  }
  const REPO_BASE = getRepoBase();
  const TOPIK2_LEVEL = REPO_BASE + "/topik2/level.html";
  const APP_HOME = REPO_BASE + "/index.html";

  const $app = document.getElementById("app");
  const DEV_KEY = "kq_deviceId_v1";
  const LANG_KEY = "kq_lang_v1";

  const qs = (k) => new URLSearchParams(location.search).get(k);
  const safe = (s) => (s || "").toString();
  const esc = (str) => safe(str).replace(/[&<>"']/g, (m) => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
  const nowISO = () => new Date().toISOString();

  function getDeviceId(){
    let id = localStorage.getItem(DEV_KEY);
    if (!id){
      id = "dev_" + Math.random().toString(16).slice(2) + "_" + Date.now().toString(16);
      localStorage.setItem(DEV_KEY, id);
    }
    return id;
  }

  function getLang(){
    const urlLang = qs("lang");
    if (urlLang === "ko" || urlLang === "mn") return urlLang;
    const v = localStorage.getItem(LANG_KEY);
    return (v === "mn" || v === "ko") ? v : "ko";
  }

  function buildUrl(base, params){
    const u = new URL(base, location.origin);
    Object.keys(params).forEach(k => {
      if (params[k] === undefined || params[k] === null) return;
      u.searchParams.set(k, String(params[k]));
    });
    return u.toString();
  }

  function jsonp(url, params, timeoutMs = 8000){
    return new Promise((resolve, reject) => {
      const cb = "cb_" + Math.random().toString(16).slice(2);
      const timer = setTimeout(() => { cleanup(); reject(new Error("JSONP timeout")); }, timeoutMs);

      function cleanup(){
        clearTimeout(timer);
        try{ delete window[cb]; }catch(e){}
        if (script && script.parentNode) script.parentNode.removeChild(script);
      }

      window[cb] = (data) => { cleanup(); resolve(data); };

      const p = new URLSearchParams();
      Object.keys(params).forEach(k => {
        if (params[k] === undefined || params[k] === null) return;
        p.set(k, String(params[k]));
      });
      p.set("callback", cb);

      const full = url + (url.includes("?") ? "&" : "?") + p.toString();
      const script = document.createElement("script");
      script.src = full;
      script.async = true;
      script.onerror = () => { cleanup(); reject(new Error("JSONP network error")); };
      document.head.appendChild(script);
    });
  }

  async function logEvent(action, extra){
    try{
      const payload = {
        action: "log",
        book: "TOPIK2",
        lesson: "flashcards",
        score: 0,
        attempts: 0,
        name: qs("name") || "",
        klass: qs("klass") || "",
        token: qs("token") || "",
        deviceId: getDeviceId(),
        ua: navigator.userAgent || "",
        lang: getLang(),
        ...extra,
        event: action,
        ts: nowISO()
      };
      await jsonp(SCRIPT_URL, payload, 8000);
    }catch(e){}
  }

  function goPreviousStep(){
    const cur = location.href;
    try{
      if (history.length > 1){
        history.back();
        setTimeout(() => {
          if (location.href === cur){
            location.href = buildUrl(TOPIK2_LEVEL, {
              name: qs("name") || "",
              klass: qs("klass") || "",
              token: qs("token") || "",
              lang: getLang(),
              back: 1
            });
          }
        }, 350);
        return;
      }
    }catch(e){}
    location.href = buildUrl(TOPIK2_LEVEL, {
      name: qs("name") || "",
      klass: qs("klass") || "",
      token: qs("token") || "",
      lang: getLang(),
      back: 1
    });
  }

  const reHangul = /[ㄱ-ㅎㅏ-ㅣ가-힣]/;
  const reCyril  = /[\u0400-\u04FF]/;
  function hasHangul(s){ return reHangul.test(s || ""); }
  function hasCyril(s){ return reCyril.test(s || ""); }

  function fixPair(ko, mn){
    const koIsMn = hasCyril(ko) && !hasHangul(ko);
    const mnIsKo = hasHangul(mn) && !hasCyril(mn);
    if (koIsMn && mnIsKo) return { ko: mn, mn: ko };
    return { ko, mn };
  }

  function splitExample(exKo, exMn){
    const a = safe(exKo).trim();
    const b = safe(exMn).trim();

    if (a && !b && hasHangul(a) && hasCyril(a)){
      const idx = a.search(reCyril);
      if (idx > 0){
        const left = a.slice(0, idx).trim();
        const right = a.slice(idx).trim();
        return { ex_ko: left, ex_mn: right };
      }
    }

    if (a && b){
      const aIsMn = hasCyril(a) && !hasHangul(a);
      const bIsKo = hasHangul(b) && !hasCyril(b);
      if (aIsMn && bIsKo) return { ex_ko: b, ex_mn: a };
    }

    return { ex_ko: a, ex_mn: b };
  }

  function splitFuncAndWord(text){
    const t = safe(text).trim();
    const seps = [" · ", "|", " - ", " — ", " —", "—", "•"];
    for (const sep of seps){
      const idx = t.indexOf(sep);
      if (idx > 0){
        const func = t.slice(0, idx).trim();
        const word = t.slice(idx + sep.length).trim();
        if (func && word) return { func, word };
      }
    }
    return { func: "", word: t };
  }

  function normalizeFileParam(){
    const raw = qs("file") || "";
    if (!raw) return "";
    let v = raw;
    try { v = decodeURIComponent(raw); } catch(_) {}
    if (/^https?:\/\//i.test(v)) return v;
    if (v.startsWith("/")) return new URL(v, location.origin).toString();
    return new URL("/" + v, location.origin).toString();
  }

  function splitDescAndExample(text){
    const t = safe(text).trim();
    if (!t) return { desc: "", ex: "" };
    const lines = t.split("\n").map(s => s.trim()).filter(Boolean);
    if (lines.length >= 2){
      const desc = lines[0].replace(/^•\s*/, "").trim();
      const ex = lines.slice(1).join("\n").trim();
      return { desc, ex };
    }
    return { desc: "", ex: t };
  }

  // ✅ FIX: 중요어휘2도 중요어휘1과 동일하게 syn/ant UI를 켠다 (기존 다른 어휘엔 영향 없음)
  function isKeyVocabDeck(fileUrl){
    return /level08_key_vocab1\.json(\?|$)/i.test(fileUrl || "") ||
           /level09_key_vocab2\.json(\?|$)/i.test(fileUrl || "");
  }

  function stripLabelPrefix(s){
    return safe(s).replace(/^유의어\s*:\s*/,"").replace(/^반의어\s*:\s*/,"").trim();
  }

  const state = {
    file: normalizeFileParam(),
    data: null,
    originalData: null,
    idx: 0,
    startedAt: Date.now()
  };

  // STEP30-7: TOPIK II 어휘/문법/쓰기 공통 콘텐츠 편집 상태
  let CONTENT_CAN_EDIT = false;
  let CONTENT_EDIT_MODE = false;
  const CONTENT_OVERRIDES = new Map();
  let CURRENT_EDITOR_KIND = "";
  let CURRENT_EDITOR_INDEX = -1;

  function editableDeckKind_(){
    const f = String(state.file || "");
    if (/\/data\/topik2\/vocab\//i.test(f)) return "vocab";
    if (/\/data\/topik2\/grammar\//i.test(f)) return "grammar";
    if (/\/data\/topik2\/writing53\//i.test(f)) return "writing53";
    if (/\/data\/topik2\/writing51\//i.test(f)) return "writing51";
    return "";
  }
  function editableDeckLabel_(){
    const kind = editableDeckKind_();
    if (kind === "grammar") return "문법";
    if (kind === "writing53") return "쓰기 53번";
    if (kind === "writing51") return "쓰기 51번";
    return "어휘";
  }
  function deckLessonKey_(){
    try{
      const u = new URL(state.file, location.href);
      const name = (u.pathname.split("/").pop() || "deck").replace(/\.json$/i, "");
      return name || "deck";
    }catch(_){ return "deck"; }
  }
  function contentScope_(){
    const kind = editableDeckKind_();
    return {area:"TOPIK2", book:kind.toUpperCase(), lesson:deckLessonKey_(), section:"flashcards"};
  }
  function contentIdentity_(){
    return {token:qs("token")||"", deviceId:getDeviceId(), name:qs("name")||""};
  }
  function itemId_(item, index){
    const raw = item && (item.id ?? item.no);
    if (raw !== undefined && raw !== null && String(raw).trim() !== "") return String(raw);
    return "item_" + String(Number(index)+1).padStart(3,"0");
  }
  function deepClone_(v){ return JSON.parse(JSON.stringify(v == null ? {} : v)); }
  function applyKnown_(target, payload, keys){
    if (!target || !payload) return;
    keys.forEach(k=>{ if (Object.prototype.hasOwnProperty.call(payload,k)) target[k]=deepClone_(payload[k]); });
  }
  function currentItem_(){
    const items = state.data && Array.isArray(state.data.items) ? state.data.items : [];
    return items[state.idx] || null;
  }
  function currentOriginalItem_(index){
    const items = state.originalData && Array.isArray(state.originalData.items) ? state.originalData.items : [];
    return items[index] ? deepClone_(items[index]) : null;
  }

  function showError(msg){
    const $err = document.getElementById("err");
    if (!$err) return;
    $err.textContent = msg;
    $err.style.display = "block";
  }

  function renderShell(title, sub){
    const name = qs("name") || "";
    const klass = qs("klass") || "";

    $app.innerHTML = `
      <div class="topBar">
        <div class="leftTop">
          <button class="btnSmall" id="btnBack">← 뒤로</button>
          <button class="btnSmall" id="btnHome">🏠 홈</button>
        </div>
        <div class="rightTop">
          <div class="mono">${esc(name)} · ${esc(klass)}</div>
          <div class="mono">lang=${esc(getLang())}</div>
        </div>
      </div>

      <div class="hdr">
        <h1 class="title">${esc(title || "Flashcards")}</h1>
        <p class="subtitle">${esc(sub || "단어 카드 · 다음 버튼으로 넘기기")}</p>
      </div>

      <div class="content">
        <div class="deckInfo">
          <div class="deckLeft">
            <div class="deckName" id="deckName">로드 중…</div>
            <div class="deckMeta">
              <span class="pill" id="posInfo">0 / 0</span>
              <span class="funcTop" id="funcTop" style="display:none;">
                <span class="pillFunc pillFuncKo" id="funcKo"></span>
                <span class="pillFunc pillFuncMn" id="funcMn"></span>
              </span>
            </div>
          </div>
        </div>

        <div class="contentEditorControls" id="contentEditorControls" hidden>
          <span class="editorBadge">개발자 콘텐츠 편집</span>
          <span class="editedMark" id="contentEditCount"></span>
          <button class="editModeBtn" id="toggleContentEditMode" type="button">수정 모드 OFF</button>
        </div>

        <div class="cardBox">
          <div class="itemEditorBar" id="itemEditorBar"></div>
          <div class="wordRow">
            <div class="koWord" id="koWord">…</div>
            <div class="mnWordInline" id="mnWordInline"></div>
          </div>

          <div class="descBox" id="descBox" style="display:none;">
            <div class="descItem">
              <div class="descLabel">설명 (한국어)</div>
              <div class="descText" id="descKo"></div>
            </div>
            <div class="descItem">
              <div class="descLabel">Тайлбар (Монгол)</div>
              <div class="descText" id="descMn"></div>
            </div>
          </div>

          <div class="synAntBox" id="synAntBox" style="display:none;">
            <div class="synAntItem">
              <div class="synLabel">유의어</div>
              <div class="synText" id="synKo"></div>
            </div>
            <div class="synAntItem">
              <div class="synLabel">반의어</div>
              <div class="synText" id="antKo"></div>
            </div>
          </div>

          <div class="exBox">
            <div class="exItem exKoBox">
              <div class="exLabel">예문 (한국어)</div>
              <div class="exText" id="exKo"></div>
            </div>
            <div class="exItem exMnBox">
              <div class="exLabel">Жишээ (Монгол)</div>
              <div class="exText" id="exMn"></div>
            </div>
          </div>

          <div class="actions">
            <button class="btn btnGhost" id="btnPrev">이전</button>
            <button class="btn btnPrimary" id="btnNext">다음</button>
          </div>

          <div class="err" id="err"></div>
        </div>
      </div>
    `;

    document.getElementById("btnBack").addEventListener("click", async () => {
      await logEvent("back_prev_step", { idx: state.idx, file: state.file });
      goPreviousStep();
    });

    document.getElementById("btnHome").addEventListener("click", async () => {
      await logEvent("go_home", { idx: state.idx, file: state.file });
      location.href = buildUrl(APP_HOME, {
        name: qs("name") || "",
        klass: qs("klass") || "",
        token: qs("token") || "",
        lang: getLang()
      });
    });
  }

  function ensureEditorModal_(){
    let m=document.getElementById("contentEditorModal");
    if(m) return m;
    m=document.createElement("div");
    m.id="contentEditorModal";
    m.className="editorModal";
    m.hidden=true;
    document.body.appendChild(m);
    return m;
  }
  function setEditorBusy_(busy){
    ["editorSave","editorRestore","editorCancel"].forEach(id=>{const el=document.getElementById(id);if(el)el.disabled=!!busy;});
  }
  function setEditorMessage_(msg,bad){
    const el=document.getElementById("editorMessage"); if(!el)return;
    el.textContent=msg||""; el.className="editorMessage "+(msg?(bad?"bad":"ok"):"");
  }
  function closeEditor_(){
    const m=document.getElementById("contentEditorModal"); if(m)m.hidden=true;
    CURRENT_EDITOR_KIND=""; CURRENT_EDITOR_INDEX=-1;
  }
  function editorButtons_(modified){
    return `<div class="editorMessage" id="editorMessage"></div><div class="editorActions"><button id="editorRestore" class="restore" type="button" style="${modified?"":"display:none"}">원본으로 복원</button><button id="editorCancel" type="button">취소</button><button id="editorSave" class="save" type="button">저장</button></div>`;
  }
  function normalizedCardForEditor_(item){
    const fixed=fixPair(safe(item&&item.ko).trim(),safe(item&&item.mn).trim());
    const exFixed=splitExample(item&&item.ex_ko,item&&item.ex_mn);
    const koDesc=splitDescAndExample(exFixed.ex_ko), mnDesc=splitDescAndExample(exFixed.ex_mn);
    return {
      ko:fixed.ko||"", mn:fixed.mn||"",
      desc_ko:koDesc.desc||"", desc_mn:mnDesc.desc||"",
      ex_ko:koDesc.ex||"", ex_mn:mnDesc.ex||"",
      syn_ko:stripLabelPrefix(item&&item.syn_ko||""),
      ant_ko:stripLabelPrefix(item&&item.ant_ko||"")
    };
  }
  function openCardEditor_(index){
    if(!CONTENT_CAN_EDIT||!CONTENT_EDIT_MODE)return;
    const items=state.data&&Array.isArray(state.data.items)?state.data.items:[];
    const item=items[index]; if(!item)return;
    CURRENT_EDITOR_KIND="item"; CURRENT_EDITOR_INDEX=index;
    const id=itemId_(item,index), data=normalizedCardForEditor_(item), keyDeck=isKeyVocabDeck(state.file), m=ensureEditorModal_();
    const kindLabel=editableDeckLabel_();
    m.innerHTML=`<div class="editorDialog"><h2>TOPIK II ${kindLabel} 카드 수정</h2><div class="editorMeta">${deckLessonKey_()} · ${id}</div><div class="editorGrid"><label class="editorField">한국어<textarea id="edKo"></textarea></label><label class="editorField">몽골어<textarea id="edMn"></textarea></label></div>${keyDeck?`<div class="editorGrid"><label class="editorField">유의어<textarea id="edSyn"></textarea></label><label class="editorField">반의어<textarea id="edAnt"></textarea></label></div>`:`<div class="editorGrid"><label class="editorField">설명 (한국어)<textarea id="edDescKo"></textarea></label><label class="editorField">설명 (몽골어)<textarea id="edDescMn"></textarea></label></div>`}<div class="editorGrid"><label class="editorField">예문 (한국어)<textarea id="edExKo"></textarea></label><label class="editorField">예문 (몽골어)<textarea id="edExMn"></textarea></label></div><div class="editorHelp">저장하면 Google Sheet의 콘텐츠수정에 영구 저장되어 이후 모든 학생에게 수정본이 적용됩니다.</div>${editorButtons_(CONTENT_OVERRIDES.has(id))}</div>`;
    document.getElementById("edKo").value=data.ko; document.getElementById("edMn").value=data.mn;
    if(keyDeck){document.getElementById("edSyn").value=data.syn_ko;document.getElementById("edAnt").value=data.ant_ko;}
    else{document.getElementById("edDescKo").value=data.desc_ko;document.getElementById("edDescMn").value=data.desc_mn;}
    document.getElementById("edExKo").value=data.ex_ko; document.getElementById("edExMn").value=data.ex_mn;
    document.getElementById("editorCancel").onclick=closeEditor_;
    document.getElementById("editorSave").onclick=saveCurrentEditor_;
    document.getElementById("editorRestore").onclick=restoreCurrentEditor_;
    m.hidden=false;
  }
  function openDeckEditor_(){
    if(!CONTENT_CAN_EDIT||!CONTENT_EDIT_MODE||!state.data)return;
    CURRENT_EDITOR_KIND="deck"; CURRENT_EDITOR_INDEX=-1;
    const m=ensureEditorModal_();
    m.innerHTML=`<div class="editorDialog"><h2>TOPIK II 카드 묶음 제목 수정</h2><div class="editorMeta">${deckLessonKey_()}</div><label class="editorField">기본 제목<input id="edTitle" type="text"></label><div class="editorGrid"><label class="editorField">한국어 제목<input id="edTitleKr" type="text"></label><label class="editorField">몽골어 제목<input id="edTitleMn" type="text"></label></div><div class="editorHelp">현재 화면 상단의 카드 묶음 제목을 수정합니다.</div>${editorButtons_(CONTENT_OVERRIDES.has("__deck__"))}</div>`;
    document.getElementById("edTitle").value=state.data.title||"";
    document.getElementById("edTitleKr").value=state.data.title_kr||"";
    document.getElementById("edTitleMn").value=state.data.title_mn||"";
    document.getElementById("editorCancel").onclick=closeEditor_;
    document.getElementById("editorSave").onclick=saveCurrentEditor_;
    document.getElementById("editorRestore").onclick=restoreCurrentEditor_;
    m.hidden=false;
  }
  async function saveCurrentEditor_(){
    if(!CURRENT_EDITOR_KIND)return;
    const scope=contentScope_(), id=contentIdentity_();
    let itemId="", payload={};
    if(CURRENT_EDITOR_KIND==="deck"){
      itemId="__deck__";
      payload={title:String(document.getElementById("edTitle").value||"").trim(),title_kr:String(document.getElementById("edTitleKr").value||"").trim(),title_mn:String(document.getElementById("edTitleMn").value||"").trim()};
      if(!payload.title&&!payload.title_kr&&!payload.title_mn){setEditorMessage_("제목을 하나 이상 입력해 주세요.",true);return;}
    }else{
      const items=state.data&&Array.isArray(state.data.items)?state.data.items:[], item=items[CURRENT_EDITOR_INDEX]; if(!item)return;
      itemId=itemId_(item,CURRENT_EDITOR_INDEX);
      const ko=String(document.getElementById("edKo").value||"").trim(), mn=String(document.getElementById("edMn").value||"").trim();
      if(!ko||!mn){setEditorMessage_("한국어와 몽골어를 모두 입력해 주세요.",true);return;}
      const exKo=String(document.getElementById("edExKo").value||"").trim(), exMn=String(document.getElementById("edExMn").value||"").trim();
      if(isKeyVocabDeck(state.file)){
        payload={ko,mn,syn_ko:String(document.getElementById("edSyn").value||"").trim(),ant_ko:String(document.getElementById("edAnt").value||"").trim(),ex_ko:exKo,ex_mn:exMn};
      }else{
        const dko=String(document.getElementById("edDescKo").value||"").trim(), dmn=String(document.getElementById("edDescMn").value||"").trim();
        payload={ko,mn,ex_ko:[dko,exKo].filter(Boolean).join("\n"),ex_mn:[dmn,exMn].filter(Boolean).join("\n")};
      }
    }
    setEditorBusy_(true);
    try{
      const r=await jsonp(SCRIPT_URL,{action:"content_override_save",token:id.token,deviceId:id.deviceId,name:id.name,area:scope.area,book:scope.book,lesson:scope.lesson,section:scope.section,itemId,payload:JSON.stringify(payload)},10000);
      if(!r||r.ok!==true)throw new Error(String(r&&r.error||"save_failed"));
      CONTENT_OVERRIDES.set(itemId,deepClone_(payload));
      if(CURRENT_EDITOR_KIND==="deck") applyKnown_(state.data,payload,["title","title_kr","title_mn"]);
      else applyKnown_(state.data.items[CURRENT_EDITOR_INDEX],payload,["ko","mn","ex_ko","ex_mn","syn_ko","ant_ko"]);
      updateContentEditorControls_(); renderCard();
      setEditorMessage_("저장되었습니다.",false); setTimeout(closeEditor_,260);
    }catch(e){setEditorBusy_(false);setEditorMessage_("저장 실패: "+(e&&e.message?e.message:e),true);}
  }
  async function restoreCurrentEditor_(){
    if(!CURRENT_EDITOR_KIND)return;
    let itemId=CURRENT_EDITOR_KIND==="deck"?"__deck__":itemId_(currentItem_(),CURRENT_EDITOR_INDEX);
    const scope=contentScope_(), id=contentIdentity_(); setEditorBusy_(true);
    try{
      const r=await jsonp(SCRIPT_URL,{action:"content_override_restore",token:id.token,deviceId:id.deviceId,name:id.name,area:scope.area,book:scope.book,lesson:scope.lesson,section:scope.section,itemId},10000);
      if(!r||r.ok!==true)throw new Error(String(r&&r.error||"restore_failed"));
      CONTENT_OVERRIDES.delete(itemId);
      if(CURRENT_EDITOR_KIND==="deck"){
        ["title","title_kr","title_mn"].forEach(k=>{if(state.originalData&&Object.prototype.hasOwnProperty.call(state.originalData,k))state.data[k]=deepClone_(state.originalData[k]);else delete state.data[k];});
      }else{
        const original=currentOriginalItem_(CURRENT_EDITOR_INDEX); if(original) state.data.items[CURRENT_EDITOR_INDEX]=original;
      }
      updateContentEditorControls_(); renderCard();
      setEditorMessage_("원본으로 복원했습니다.",false); setTimeout(closeEditor_,260);
    }catch(e){setEditorBusy_(false);setEditorMessage_("복원 실패: "+(e&&e.message?e.message:e),true);}
  }
  function applyContentOverrides_(){
    if(!state.data)return;
    const deck=CONTENT_OVERRIDES.get("__deck__"); if(deck)applyKnown_(state.data,deck,["title","title_kr","title_mn"]);
    const items=Array.isArray(state.data.items)?state.data.items:[];
    items.forEach((item,i)=>{const o=CONTENT_OVERRIDES.get(itemId_(item,i));if(o)applyKnown_(item,o,["ko","mn","ex_ko","ex_mn","syn_ko","ant_ko"]);});
  }
  async function loadContentOverrides_(){
    const kind=editableDeckKind_(); if(!kind)return;
    const scope=contentScope_(), id=contentIdentity_();
    try{
      const r=await jsonp(SCRIPT_URL,{action:"content_overrides",token:id.token,deviceId:id.deviceId,name:id.name,area:scope.area,book:scope.book,lesson:scope.lesson,section:scope.section},10000);
      if(!r||r.ok!==true)return;
      CONTENT_CAN_EDIT=!!r.canEdit; CONTENT_OVERRIDES.clear();
      (Array.isArray(r.items)?r.items:[]).forEach(x=>{if(x&&x.itemId)CONTENT_OVERRIDES.set(String(x.itemId),deepClone_(x.payload||{}));});
    }catch(e){CONTENT_CAN_EDIT=false;}
  }
  function updateContentEditorControls_(){
    const wrap=document.getElementById("contentEditorControls"), btn=document.getElementById("toggleContentEditMode"), count=document.getElementById("contentEditCount");
    if(!wrap)return;
    wrap.hidden=!(CONTENT_CAN_EDIT&&editableDeckKind_());
    if(count)count.textContent=CONTENT_OVERRIDES.size?(`● 수정본 ${CONTENT_OVERRIDES.size}개`):"";
    if(btn){btn.textContent=CONTENT_EDIT_MODE?"수정 모드 ON":"수정 모드 OFF";btn.classList.toggle("active",CONTENT_EDIT_MODE);btn.onclick=()=>{CONTENT_EDIT_MODE=!CONTENT_EDIT_MODE;updateContentEditorControls_();renderCard();};}
  }
  function renderItemEditorBar_(){
    const bar=document.getElementById("itemEditorBar"); if(!bar)return;
    if(!(CONTENT_CAN_EDIT&&CONTENT_EDIT_MODE&&editableDeckKind_())){bar.innerHTML="";return;}
    const item=currentItem_(), itemKey=item?itemId_(item,state.idx):"";
    bar.innerHTML=`<span class="editorBadge">개발자 편집</span>${itemKey&&CONTENT_OVERRIDES.has(itemKey)?'<span class="editedMark">● 현재 카드 수정본</span>':''}${CONTENT_OVERRIDES.has("__deck__")?'<span class="editedMark">● 제목 수정본</span>':''}<button class="editItemBtn" id="editDeckTitle" type="button">✏ 제목 수정</button><button class="editItemBtn" id="editCurrentCard" type="button">✏ 현재 카드 수정</button>`;
    const ed=document.getElementById("editDeckTitle");if(ed)ed.onclick=openDeckEditor_;
    const ec=document.getElementById("editCurrentCard");if(ec)ec.onclick=()=>openCardEditor_(state.idx);
  }

  function renderCard(){
    const items = (state.data && Array.isArray(state.data.items)) ? state.data.items : [];
    const total = items.length;
    updateContentEditorControls_();
    renderItemEditorBar_();

    const $deckName = document.getElementById("deckName");
    const $posInfo = document.getElementById("posInfo");

    const $koWord = document.getElementById("koWord");
    const $mnWordInline = document.getElementById("mnWordInline");

    const $descBox = document.getElementById("descBox");
    const $descKo = document.getElementById("descKo");
    const $descMn = document.getElementById("descMn");

    const $synAntBox = document.getElementById("synAntBox");
    const $synKo = document.getElementById("synKo");
    const $antKo = document.getElementById("antKo");

    const $exKo = document.getElementById("exKo");
    const $exMn = document.getElementById("exMn");

    const $funcTop = document.getElementById("funcTop");
    const $funcKo = document.getElementById("funcKo");
    const $funcMn = document.getElementById("funcMn");

    $posInfo.textContent = `${total ? (state.idx + 1) : 0} / ${total}`;

    const deckTitle = (getLang() === "mn")
      ? (state.data && state.data.title_mn) || (state.data && state.data.title_kr) || (state.data && state.data.title) || "Flashcards"
      : (state.data && state.data.title_kr) || (state.data && state.data.title) || "Flashcards";
    $deckName.textContent = deckTitle;

    if (!total){
      $koWord.textContent = "데이터가 없습니다";
      $mnWordInline.textContent = "";
      $descBox.style.display = "none";
      $synAntBox.style.display = "none";
      $exKo.textContent = "";
      $exMn.textContent = "";
      $funcTop.style.display = "none";
      showError("items 배열이 비어 있습니다.\nJSON에 items가 들어있는지 확인하세요.");
      return;
    }

    const it = items[state.idx] || {};
    const fixed = fixPair(safe(it.ko).trim(), safe(it.mn).trim());
    const koSplit = splitFuncAndWord(fixed.ko);
    const mnSplit = splitFuncAndWord(fixed.mn);

    const exFixed = splitExample(it.ex_ko, it.ex_mn);
    const koDescEx = splitDescAndExample(exFixed.ex_ko);
    const mnDescEx = splitDescAndExample(exFixed.ex_mn);

    const funcKoVal = koSplit.func;
    const funcMnVal = mnSplit.func;

    if (funcKoVal || funcMnVal){
      $funcTop.style.display = "flex";
      $funcKo.textContent = funcKoVal ? ("기능 · " + funcKoVal) : "기능";
      $funcMn.textContent = funcMnVal ? ("Үүрэг · " + funcMnVal) : "Үүрэг";
    } else {
      $funcTop.style.display = "none";
    }

    $koWord.textContent = koSplit.word || "(빈 단어)";
    $mnWordInline.textContent = mnSplit.word || "";

    const keyDeck = isKeyVocabDeck(state.file);

    if (keyDeck) {
      $descBox.style.display = "none";
      $descKo.textContent = "";
      $descMn.textContent = "";

      $synAntBox.style.display = "grid";
      const syn = stripLabelPrefix(it.syn_ko || "");
      const ant = stripLabelPrefix(it.ant_ko || "");
      $synKo.textContent = syn || "—";
      $antKo.textContent = ant || "—";
    } else {
      $synAntBox.style.display = "none";
      $synKo.textContent = "";
      $antKo.textContent = "";

      const descKo = koDescEx.desc || "";
      const descMn = mnDescEx.desc || "";
      if (descKo || descMn){
        $descBox.style.display = "grid";
        $descKo.textContent = descKo;
        $descMn.textContent = descMn;
      } else {
        $descBox.style.display = "none";
        $descKo.textContent = "";
        $descMn.textContent = "";
      }
    }

    $exKo.textContent = koDescEx.ex || "";
    $exMn.textContent = mnDescEx.ex || "";

    document.getElementById("btnPrev").disabled = (state.idx <= 0);
    document.getElementById("btnPrev").style.opacity = (state.idx <= 0) ? 0.55 : 1;
  }

  function bindNav(){
    document.getElementById("btnNext").addEventListener("click", async () => {
      const items = state.data.items || [];
      if (!items.length) return;
      state.idx = (state.idx + 1) % items.length;
      renderCard();
      await logEvent("next", { idx: state.idx, file: state.file });
    });

    document.getElementById("btnPrev").addEventListener("click", async () => {
      const items = state.data.items || [];
      if (!items.length) return;
      state.idx = Math.max(0, state.idx - 1);
      renderCard();
      await logEvent("prev", { idx: state.idx, file: state.file });
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === " " || e.key === "Enter") {
        e.preventDefault();
        const $n = document.getElementById("btnNext");
        if ($n) $n.click();
      }
    });
  }

  async function loadData(){
    const file = state.file;
    if (!file){
      throw new Error("URL에 file 파라미터가 없습니다.\n예: ?file=/data/topik2/vocab/level01_attitude.json");
    }
    const res = await fetch(file, { cache: "no-store" });
    if (!res.ok) throw new Error("데이터 로드 실패: " + res.status + " " + res.statusText + "\n" + file);
    const json = await res.json();
    if (!json || !Array.isArray(json.items)) {
      throw new Error("JSON 형식이 다릅니다.\n{ title/title_kr/title_mn, items:[{ko,mn,ex_ko,ex_mn}] } 형태여야 합니다.");
    }
    state.data = json;
    state.originalData = deepClone_(json);
  }

  async function render(keepIndex){
    document.documentElement.lang = getLang();
    const shellKind = editableDeckKind_();
    const shellSub = (shellKind === "writing53" || shellKind === "writing51")
      ? "쓰기 학습 카드 · 다음 버튼으로 넘기기"
      : "단어 카드 · 다음 버튼으로 넘기기";
    renderShell("TOPIK II", shellSub);

    try{
      if (!state.data) {
        if (editableDeckKind_()) await Promise.all([loadData(), loadContentOverrides_()]);
        else await loadData();
        applyContentOverrides_();
        await logEvent("start", { file: state.file });
      }
      if (!keepIndex) state.idx = 0;
      updateContentEditorControls_();
      renderCard();
      bindNav();
    }catch(e){
      showError(String(e && e.message ? e.message : e));
    }
  }

  window.addEventListener("beforeunload", () => {
    const elapsedSec = Math.max(0, Math.round((Date.now() - state.startedAt) / 1000));
    try{
      jsonp(SCRIPT_URL, {
        action: "log",
        event: "end",
        book: "TOPIK2",
        lesson: "flashcards",
        name: qs("name") || "",
        klass: qs("klass") || "",
        token: qs("token") || "",
        deviceId: getDeviceId(),
        ua: navigator.userAgent || "",
        lang: getLang(),
        file: state.file,
        idx: state.idx,
        elapsedSec,
        ts: nowISO()
      }, 1500);
    }catch(e){}
  });

  render(false);
})();
</script>
</body>
</html>
