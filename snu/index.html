<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>SNU</title>
  <style>
    :root{
      --bg:#0b1220;--card:#111827;--text:#e5e7eb;--muted:#9ca3af;--line:#243044;
      --accent:#60a5fa;
    }
    *{box-sizing:border-box}
    html,body{overflow-x:hidden}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans KR",Arial,sans-serif;
      background:linear-gradient(180deg,#050814,var(--bg));
      color:var(--text);
    }
    a{color:inherit;text-decoration:none}
    button{font-family:inherit}

    /* ===== Topbar ===== */
    .topbar{
      position:sticky;top:0;z-index:50;
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:12px 12px;
      background:rgba(5,8,20,.78);backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line);
    }
    .brand{display:flex;align-items:center;gap:10px;font-weight:900}
    .dot{width:10px;height:10px;border-radius:999px;background:var(--accent)}
    .right{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:flex-end}

    .pill{
      display:inline-flex;align-items:center;gap:8px;
      padding:8px 12px;border-radius:999px;border:1px solid var(--line);
      background:#0b1020;color:var(--muted);font-size:13px
    }

    /* ✅ 버튼(뒤로 / 언어 / 홈) 크게 + 선명한 색상 */
    .btn{
      display:inline-flex;align-items:center;justify-content:center;
      border-radius:16px;border:1px solid var(--line);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      min-height:46px;
      padding:12px 16px;
      font-size:16px;
      font-weight:900;
      color:var(--text);
      background:#0b1020;
      white-space:nowrap;
    }
    .btn:hover{filter:brightness(1.06)}
    .btn:active{transform:translateY(1px)}
    .btnBack{
      background:linear-gradient(135deg,rgba(96,165,250,.22), rgba(11,16,32,.95));
      border-color:rgba(96,165,250,.55);
    }
    .btnLang{
      background:linear-gradient(135deg,rgba(52,211,153,.20), rgba(11,16,32,.95));
      border-color:rgba(52,211,153,.55);
    }
    .btnHome{
      background:linear-gradient(135deg,rgba(248,113,113,.18), rgba(11,16,32,.95));
      border-color:rgba(248,113,113,.48);
      text-decoration:none;
    }

    /* ===== Layout ===== */
    .container{max-width:980px;margin:0 auto;padding:12px}
    .card{
      background:rgba(17,24,39,.9);
      border:1px solid var(--line);
      border-radius:18px;
      padding:14px;
      box-shadow:0 10px 30px rgba(0,0,0,.25);
    }
    .muted{color:var(--muted);line-height:1.6}
    .small{font-size:12px}
    .bar{height:1px;background:var(--line);margin:12px 0}
    .hidden{display:none !important;}

    /* ===== Tiles ===== */
    .grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px;
      margin-top:12px;
    }
    .tile{
      display:flex;align-items:center;justify-content:center;
      text-align:center;
      padding:18px 14px;
      border-radius:18px;
      border:1px solid var(--line);
      background:#0b1020;
      min-height:90px;
      -webkit-tap-highlight-color:transparent;
    }
    .tile:hover{filter:brightness(1.06)}
    .tileInner{width:100%}
    .tileTitle{
      font-size:22px;
      font-weight:950;
      line-height:1.1;
      text-align:center;
      letter-spacing:.2px;
    }
    .tileMeta{
      font-size:12px;
      margin-top:6px;
      color:rgba(229,231,235,.78);
      text-align:center;
    }

    /* 교재(책)별 색상 */
    .bk-1a{background:linear-gradient(135deg,rgba(96,165,250,.18), rgba(11,16,32,.96));border-color:rgba(96,165,250,.42);}
    .bk-1b{background:linear-gradient(135deg,rgba(52,211,153,.18), rgba(11,16,32,.96));border-color:rgba(52,211,153,.42);}
    .bk-2a{background:linear-gradient(135deg,rgba(251,191,36,.16), rgba(11,16,32,.96));border-color:rgba(251,191,36,.38);}
    .bk-2b{background:linear-gradient(135deg,rgba(248,113,113,.14), rgba(11,16,32,.96));border-color:rgba(248,113,113,.34);}
    .bk-3a{background:linear-gradient(135deg,rgba(167,139,250,.16), rgba(11,16,32,.96));border-color:rgba(167,139,250,.38);}
    .bk-3b{background:linear-gradient(135deg,rgba(34,211,238,.14), rgba(11,16,32,.96));border-color:rgba(34,211,238,.34);}
    .bk-4a{background:linear-gradient(135deg,rgba(244,114,182,.14), rgba(11,16,32,.96));border-color:rgba(244,114,182,.34);}
    .bk-4b{background:linear-gradient(135deg,rgba(156,163,175,.14), rgba(11,16,32,.96));border-color:rgba(156,163,175,.34);}

    /* 레슨 버튼도 선명하게 */
    .lessonBtn{
      display:flex;align-items:center;justify-content:center;
      width:100%;
      padding:18px 12px;
      border-radius:18px;
      border:1px solid var(--line);
      background:linear-gradient(135deg,rgba(96,165,250,.12), rgba(11,16,32,.96));
      border-color:rgba(96,165,250,.30);
      color:var(--text);
      text-align:center;
      font-weight:950;
      font-size:18px;
      min-height:66px;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      white-space:nowrap;
    }
    .lessonBtn:hover{filter:brightness(1.06)}
    .lessonBtn:active{transform:translateY(1px)}
    .lessonBtn:disabled{transform:none}
    .lessonBtn.locked{
      cursor:not-allowed;
      opacity:.62;
      background:linear-gradient(135deg,rgba(107,114,128,.10), rgba(11,16,32,.96));
      border-color:rgba(107,114,128,.30);
    }
    .lessonBtn.passed{
      background:linear-gradient(135deg,rgba(52,211,153,.17), rgba(11,16,32,.96));
      border-color:rgba(52,211,153,.48);
    }
    .lessonBtn.ready{
      background:linear-gradient(135deg,rgba(96,165,250,.16), rgba(11,16,32,.96));
      border-color:rgba(96,165,250,.48);
    }
    .lessonBtnInner{display:flex;flex-direction:column;align-items:center;gap:5px;line-height:1.15}
    .lessonState{font-size:11px;font-weight:800;color:var(--muted);white-space:normal}
    .lessonBtn.passed .lessonState{color:#86efac}
    .lessonBtn.locked .lessonState{color:#cbd5e1}

    .err{
      border:1px solid rgba(248,113,113,.35);
      background:rgba(248,113,113,.06);
      padding:12px;border-radius:14px;
      margin-top:12px;
      color:#ffd6d6;
      white-space:pre-wrap;
    }

    @media (min-width: 700px){
      .grid{grid-template-columns:repeat(4,1fr)}
    }

    /* ✅ 모바일에서 버튼을 “2배 느낌”으로 더 크게 */
    @media (max-width: 520px){
      .container{padding:10px}
      .card{padding:12px}

      .right .pill{display:none} /* 모바일에서는 pill 숨겨서 공간 확보 */

      .btn{
        min-height:54px;
        padding:14px 18px;
        font-size:18px;
        border-radius:18px;
      }

      .tile{padding:18px 12px;min-height:94px}
      .tileTitle{font-size:24px}
      .tileMeta{font-size:12px;margin-top:5px}

      .lessonBtn{
        min-height:70px;
        font-size:19px;
        padding:18px 10px;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <a id="brandLink" href="../index.html">Korean Quiz</a>
    </div>

    <div class="right">
      <span class="pill" id="pillName">학습자: -</span>
      <span class="pill" id="pillToken">token: -</span>

      <button class="btn btnBack" id="btnBack" type="button">←</button>
      <button class="btn btnLang" id="btnLang" type="button">KR</button>
      <a class="btn btnHome" id="btnHome" href="../index.html">홈</a>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end">
        <div>
          <div class="muted" id="subtitle" style="font-weight:900;color:var(--text);font-size:16px;">
            교재 선택 → 해당 교재 과만 표시
          </div>
          <div class="muted small" id="help" style="margin-top:6px;">교재를 먼저 고르세요.</div>
        </div>
        <div class="muted small" id="status"></div>
      </div>

      <div class="bar"></div>

      <!-- BOOKS -->
      <div id="bookWrap">
        <div class="grid" id="bookGrid"></div>
      </div>

      <!-- LESSONS -->
      <div id="lessonWrap" class="hidden">
        <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center">
          <div>
            <div class="muted small" id="pickedLabel">선택됨</div>
            <div style="font-weight:950;font-size:22px;margin-top:4px;text-align:left" id="pickedBook">-</div>
            <div class="muted small" id="pickedSub" style="margin-top:2px;"></div>
          </div>
          <button class="btn" id="btnReset" type="button">교재 다시 선택</button>
        </div>
        <div class="grid" id="lessonGrid"></div>
      </div>

      <div id="errBox" class="err hidden"></div>
    </section>
  </main>

  <script>

        masteryChecking: "학습 통과 상태 확인 중...",

        firstOpen: "시작 가능",

        masteryRule: "Өмнөх хичээлийн үг, дүрэм, нэгдсэн шалгалт тус бүр 90%-иас дээш байвал дараагийн хичээл нээгдэнэ.",
        firstOpen: "Эхлэх боломжтой",
        ready: "Нээлттэй",
        locked: "Түгжээтэй",
        pass: "Тэнцсэн",
        needLogin: "Нэвтрэх мэдээлэл шаардлагатай.",

        authHelp: "Сөүлийн их сургуулийн хичээлийг ашиглахын тулд хүчинтэй эрхээр дахин нэвтэрнэ үү.",
        authStatus: "Нэвтрэх шаардлагатай",
        authBack: "Нэвтрэх дэлгэц рүү буцах",
        masteryError: "Тэнцсэн эсэхийг шалгаж чадсангүй.",
        vocabLabel: "Үг",
        grammarLabel: "Дүрэм",
        mixedLabel: "Нэгдсэн",
        developerAccess: "Хөгжүүлэгчийн бүрэн эрх",
        teacherRecognized: "Багш зөвшөөрсөн · өмнөх ахиц",
        teacherStart: "Багшийн заасан эхлэх хичээл",
        teacherOverride: "Багшийн эхлэх цэг хэрэгжиж байна",
        lowerCourseAccess: "Багш зөвшөөрсөн · өмнөх шат бүхэлдээ нээлттэй",
        teacherStartInvalid: "Багшийн заасан эхлэх хичээлийг энэ номын хүрээнд тохирууллаа."
      }
    };

    function getLang(){
      const u = new URL(location.href);
      const q = (u.searchParams.get("lang")||"").toUpperCase();
      const s = (localStorage.getItem("kq_lang")||localStorage.getItem("lang")||"").toUpperCase();
      const pick = (q==="MN"||q==="KR") ? q : s;
      return (pick==="MN") ? "MN" : "KR";
    }
    function setLang(l){
      localStorage.setItem("kq_lang", l);
      localStorage.setItem("lang", l);
    }
    function tr(k){
      const L = getLang();
      return (I18N[L] && I18N[L][k]) ? I18N[L][k] : (I18N.KR[k] || k);
    }

    function getParam(k){
      const u = new URL(location.href);
      return u.searchParams.get(k) || "";
    }
    function passthroughQS(){
      const u = new URL(location.href);
      const p = new URLSearchParams();
      ["name","klass","token","lang"].forEach(k=>{
        const v = u.searchParams.get(k);
        if(v) p.set(k, v);
      });
      if(!p.get("lang")) p.set("lang", getLang());
      return p.toString();
    }
    function withQS(url){
      const qs = passthroughQS();
      return url + (url.includes("?") ? "&" : "?") + qs;
    }

    const RESULT_LOG_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz6WBgnJXTAperJK2NwX-VwkmPEQrU4SluCcXjbmYYgcywYM2AcHZwkymBse6E9Kaqg/exec";

    function jsonpRequest(params, timeoutMs=12000){
      return new Promise((resolve, reject)=>{
        const cb = "kqMastery_" + Date.now() + "_" + Math.random().toString(36).slice(2);
        const script = document.createElement("script");
        let done = false;

        function cleanup(){
          if(done) return;
          done = true;
          clearTimeout(timer);
          try{ delete window[cb]; }catch(_){ window[cb] = undefined; }
          if(script.parentNode) script.parentNode.removeChild(script);
        }

        window[cb] = (data)=>{
          cleanup();
          resolve(data);
        };

        const timer = setTimeout(()=>{
          cleanup();
          reject(new Error("timeout"));
        }, timeoutMs);

        const u = new URL(RESULT_LOG_SCRIPT_URL);
        Object.entries(params || {}).forEach(([k,v])=>{
          if(v !== undefined && v !== null && String(v) !== "") u.searchParams.set(k, String(v));
        });
        u.searchParams.set("callback", cb);
        script.onerror = ()=>{
          cleanup();
          reject(new Error("network_error"));
        };
        script.src = u.toString();
        document.head.appendChild(script);
      });
    }

    async function validateSession(){
      const token = getParam("token");
      if(!token) return {ok:false,error:"missing_token"};
      try{
        const data = await jsonpRequest({
          action:"validate",
          token,
          name:getParam("name")
        });
        return data || {ok:false,error:"empty_response"};
      }catch(e){
        return {ok:false,error:(e && e.message) ? e.message : "request_failed"};
      }
    }

    async function getLearningAccess(bookId){
      const token = getParam("token");
      if(!token) return {ok:false,error:"missing_token",isDeveloper:false};
      try{
        const data = await jsonpRequest({
          action:"learning_start",
          token,
          name:getParam("name"),
          book:"SNU-" + String(bookId || "").toUpperCase()
        });
        return data || {ok:false,error:"empty_response",isDeveloper:false};
      }catch(e){
        return {ok:false,error:(e && e.message) ? e.message : "request_failed",isDeveloper:false};
      }
    }

    async function getTestMastery(bookId, lessonNo, testType){
      const token = getParam("token");
      if(!token) return {ok:false,error:"missing_token",found:false,bestScore:0,status:"NONE",testType};
      try{
        const data = await jsonpRequest({
          action:"mastery_status",
          token,
          name:getParam("name"),
          book:"SNU-" + String(bookId || "").toUpperCase(),
          lesson:String(lessonNo == null ? "" : lessonNo),
          testType
        });
        return Object.assign({testType}, data || {ok:false,error:"empty_response",found:false,bestScore:0,status:"NONE"});
      }catch(e){
        return {ok:false,error:(e && e.message) ? e.message : "request_failed",found:false,bestScore:0,status:"NONE",testType};
      }
    }

    async function getLessonMastery(bookId, lessonNo){
      const [vocab, grammar, mixed] = await Promise.all([
        getTestMastery(bookId, lessonNo, "vocab"),
        getTestMastery(bookId, lessonNo, "grammar"),
        getTestMastery(bookId, lessonNo, "mixed")
      ]);
      const tests = {vocab, grammar, mixed};
      const allOk = [vocab, grammar, mixed].every(r => r && r.ok === true);
      const passed = allOk && [vocab, grammar, mixed].every(r => r.status === "PASS" && Number(r.bestScore || 0) >= 90);
      return {
        ok: allOk,
        error: [vocab, grammar, mixed].find(r => !r || r.ok !== true)?.error || "",
        status: passed ? "PASS" : "RETRY",
        tests
      };
    }

    function previousBookGateInfo(bookId){
      if(!MANIFEST || !Array.isArray(MANIFEST.books)) return null;
      const id = String(bookId || "").toUpperCase();
      const books = MANIFEST.books;
      const idx = books.findIndex(b => String(b && b.id || "").toUpperCase() === id);
      if(idx <= 0) return null;
      const prev = books[idx - 1];
      const prevLessons = Array.isArray(prev && prev.lessons) ? prev.lessons : [];
      if(!prev || !prevLessons.length) return null;
      const last = prevLessons[prevLessons.length - 1] || {};
      const lessonNo = Number(last.no || 0);
      if(!lessonNo) return null;
      return {id:String(prev.id || "").toUpperCase(), lessonNo, label:last.label || String(lessonNo)};
    }

    function scoreOf(result, type){
      return Number(result && result.tests && result.tests[type] && result.tests[type].bestScore || 0);
    }

    function lessonScoreText(result){
      return `${tr("vocabLabel")} ${scoreOf(result,"vocab")}% · ${tr("grammarLabel")} ${scoreOf(result,"grammar")}% · ${tr("mixedLabel")} ${scoreOf(result,"mixed")}%`;
    }

    const brandLink = document.getElementById("brandLink");
    const btnHome = document.getElementById("btnHome");
    const btnLang = document.getElementById("btnLang");
    const btnBack = document.getElementById("btnBack");
    const statusEl = document.getElementById("status");
    const subtitleEl = document.getElementById("subtitle");
    const helpEl = document.getElementById("help");
    const pillName = document.getElementById("pillName");
    const pillToken = document.getElementById("pillToken");

    const bookWrap = document.getElementById("bookWrap");
    const bookGrid = document.getElementById("bookGrid");
    const lessonWrap = document.getElementById("lessonWrap");
    const lessonGrid = document.getElementById("lessonGrid");
    const pickedLabel = document.getElementById("pickedLabel");
    const pickedBook = document.getElementById("pickedBook");
    const pickedSub = document.getElementById("pickedSub");
    const btnReset = document.getElementById("btnReset");
    const errBox = document.getElementById("errBox");

    let MANIFEST = null;
    let PICKED = null;

    function showErr(msg){
      errBox.textContent = msg;
      errBox.classList.remove("hidden");
    }
    function clearErr(){
      errBox.classList.add("hidden");
      errBox.textContent = "";
    }

    function bookCss(id){
      const s = String(id||"").toLowerCase();
      if(s==="1a") return "bk-1a";
      if(s==="1b") return "bk-1b";
      if(s==="2a") return "bk-2a";
      if(s==="2b") return "bk-2b";
      if(s==="3a") return "bk-3a";
      if(s==="3b") return "bk-3b";
      if(s==="4a") return "bk-4a";
      if(s==="4b") return "bk-4b";
      return "";
    }

    function applyTop(){
      const qs = passthroughQS();
      brandLink.href = "../index.html" + (qs ? "?" + qs : "");
      btnHome.href = "../index.html" + (qs ? "?" + qs : "");
      btnHome.textContent = tr("home");
      btnLang.textContent = getLang();

      subtitleEl.textContent = tr("subtitle");
      helpEl.textContent = tr("help");
      pickedLabel.textContent = tr("picked");
      btnReset.textContent = tr("reset");

      const name = getParam("name") || "-";
      const token = getParam("token") || "-";
      pillName.textContent = tr("learner") + name;
      pillToken.textContent = "token: " + token;

      document.documentElement.lang = (getLang()==="MN") ? "mn" : "ko";
    }

    function backToBooks(){
      PICKED = null;
      lessonWrap.classList.add("hidden");
      bookWrap.classList.remove("hidden");
      helpEl.classList.remove("hidden");
    }

    function showAuthRequired(result){
      PICKED = null;
      bookWrap.classList.add("hidden");
      lessonWrap.classList.add("hidden");
      subtitleEl.textContent = "🔐 " + tr("authRequired");
      helpEl.textContent = tr("authHelp");
      helpEl.classList.remove("hidden");
      statusEl.textContent = tr("authStatus");
      const error = result && result.error ? String(result.error) : "expired_or_invalid";
      showErr(tr("authHelp") + "\n" + error);
      brandLink.href = "../index.html";
      btnHome.href = "../index.html";
      btnHome.textContent = tr("authBack");
    }

    function renderBooks(){
      bookGrid.innerHTML = "";
      if(!MANIFEST || !Array.isArray(MANIFEST.books)) return;

      MANIFEST.books.forEach(b=>{
        const a = document.createElement("a");
        a.className = "tile " + bookCss(b.id);
        a.href = "javascript:void(0)";
        a.innerHTML = `
          <div class="tileInner">
            <div class="tileTitle">${(b.id||"").toUpperCase()}</div>
            <div class="tileMeta">${b.subtitle || ""}</div>
          </div>
        `;
        a.addEventListener("click", ()=>{
          PICKED = b;
          renderLessons();
        });
        bookGrid.appendChild(a);
      });
    }

    async function renderLessons(){
      if(!PICKED) return;

      pickedBook.textContent = (PICKED.id || "").toUpperCase();
      pickedSub.textContent = PICKED.subtitle || "";

      const lessons = Array.isArray(PICKED.lessons) ? PICKED.lessons : [];
      const pickedNow = PICKED;

      lessonGrid.innerHTML = "";
      bookWrap.classList.add("hidden");
      lessonWrap.classList.remove("hidden");
      helpEl.classList.add("hidden");
      statusEl.textContent = tr("masteryChecking");
      clearErr();

      // 조회 중에는 레슨 버튼을 잠시 비활성화한다.
      lessons.forEach(ls=>{
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "lessonBtn locked";
        btn.disabled = true;
        btn.innerHTML = `<span class="lessonBtnInner"><span>${ls.label || (ls.no ? (ls.no + "과") : "레슨")}</span><span class="lessonState">${tr("masteryChecking")}</span></span>`;
        lessonGrid.appendChild(btn);
      });

      const accessProfile = await getLearningAccess(pickedNow.id);
      if(PICKED !== pickedNow) return;
      const isDeveloper = !!(accessProfile && accessProfile.ok === true && accessProfile.isDeveloper === true);
      // 전체 서울대 과정에서 교사 지정 시작 교재보다 낮은 교재는 이미 이수한 과정으로 인정한다.
      // 예: 시작점이 SNU-2A이면 SNU-1A, SNU-1B의 모든 과를 열어 준다.
      const lowerBookAccess = !!(
        !isDeveloper &&
        accessProfile && accessProfile.ok === true &&
        accessProfile.lowerBookAccess === true
      );
      const higherBook = !!(
        !isDeveloper &&
        accessProfile && accessProfile.ok === true &&
        (accessProfile.higherBook === true || accessProfile.bookRelation === "higher")
      );

      // 교사가 지정한 시작 과를 실제 교재의 과 번호에 맞춰 해석한다.
      // 예: 1B는 9과부터 시작하므로 startLesson=1이면 자동으로 첫 과(9과)로 보정한다.
      let teacherStartIndex = -1;
      let teacherStartLesson = 0;
      const hasTeacherStart = !!(
        !isDeveloper && !lowerBookAccess && !higherBook &&
        accessProfile && accessProfile.ok === true &&
        accessProfile.found === true && accessProfile.enabled === true &&
        Number(accessProfile.startLesson || 0) > 0
      );
      if(hasTeacherStart && lessons.length){
        const requested = Number(accessProfile.startLesson || 0);
        let idx = lessons.findIndex(ls => Number(ls.no) === requested);
        if(idx < 0){
          idx = lessons.findIndex(ls => Number(ls.no) >= requested);
          if(idx < 0) idx = lessons.length - 1;
        }
        teacherStartIndex = idx;
        teacherStartLesson = Number(lessons[idx] && lessons[idx].no || 0);
      }

      // 이전 과정 전체 인정 상태에서는 점수 조회가 필요 없다. learning_start 호출 자체로 인증도 확인되었다.
      let higherGateInfo = null;
      let higherGateResult = null;
      let higherGatePassed = false;
      if(higherBook){
        higherGateInfo = previousBookGateInfo(pickedNow.id);
        if(higherGateInfo){
          higherGateResult = await getLessonMastery(higherGateInfo.id, higherGateInfo.lessonNo);
          if(PICKED !== pickedNow) return;
          higherGatePassed = !!(higherGateResult && higherGateResult.ok === true && higherGateResult.status === "PASS");
        }
      }

      const results = lowerBookAccess
        ? lessons.map(()=>({ok:true,status:"RECOGNIZED",tests:{vocab:{bestScore:0},grammar:{bestScore:0},mixed:{bestScore:0}}}))
        : await Promise.all(lessons.map(ls=>getLessonMastery(pickedNow.id, ls.no)));
      if(PICKED !== pickedNow) return;

      const authError = lowerBookAccess ? null :
        ((higherBook && higherGateResult && higherGateResult.ok !== true)
          ? higherGateResult
          : results.find(r=>!r || r.ok !== true));
      if(authError){
        const msg = authError && authError.error === "missing_token" ? tr("needLogin") : tr("masteryError");
        showErr(msg + (authError && authError.error ? "\n" + authError.error : ""));
      }

      lessonGrid.innerHTML = "";
      lessons.forEach((ls, idx)=>{
        const current = results[idx] || {ok:false,found:false,bestScore:0,status:"NONE"};
        const previous = idx > 0 ? (results[idx-1] || {ok:false,found:false,bestScore:0,status:"NONE"}) : null;
        const isFirst = idx === 0;
        const teacherOverrideActive = teacherStartIndex >= 0;
        const teacherRecognized = lowerBookAccess || (teacherOverrideActive && idx < teacherStartIndex);
        const teacherStartHere = teacherOverrideActive && idx === teacherStartIndex;

        // 교사 지정 시작점이 있으면 그 과까지는 기존 진도로 인정한다.
        // 시작 과 이후부터는 시작 과~직전 과의 세 시험이 모두 PASS여야 순차적으로 열린다.
        let requiredChainPassed = true;
        let blockingIndex = -1;
        if(teacherOverrideActive && idx > teacherStartIndex){
          for(let j = teacherStartIndex; j < idx; j++){
            const r = results[j];
            if(!r || r.ok !== true || r.status !== "PASS") {
              requiredChainPassed = false;
              blockingIndex = j;
              break;
            }
          }
        }

        const higherBookUnlocked = higherBook && higherGatePassed &&
          (isFirst || (previous && previous.ok === true && previous.status === "PASS"));
        const unlocked = isDeveloper
          || lowerBookAccess
          || (higherBook ? higherBookUnlocked
                         : (teacherOverrideActive ? (idx <= teacherStartIndex || requiredChainPassed)
                                                  : (isFirst || (previous && previous.ok === true && previous.status === "PASS"))));

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "lessonBtn";
        const label = ls.label || (ls.no ? (ls.no + "과") : "레슨");

        let stateText = "";
        if(unlocked){
          btn.disabled = false;
          if(isDeveloper){
            btn.classList.add("ready");
            stateText = `🛠️ ${tr("developerAccess")} · ${lessonScoreText(current)}`;
          }else if(lowerBookAccess){
            btn.classList.add("passed");
            stateText = `✅ ${tr("lowerCourseAccess")}`;
          }else if(teacherRecognized){
            btn.classList.add("passed");
            stateText = `✅ ${tr("teacherRecognized")}`;
          }else if(current.ok === true && current.status === "PASS"){
            btn.classList.add("passed");
            stateText = `✅ ${tr("pass")} · ${lessonScoreText(current)}`;
          }else if(teacherStartHere){
            btn.classList.add("ready");
            stateText = `▶ ${tr("teacherStart")} · ${lessonScoreText(current)}`;
          }else{
            btn.classList.add("ready");
            const baseState = isFirst ? tr("firstOpen") : tr("ready");
            stateText = `${baseState} · ${lessonScoreText(current)}`;
          }

          btn.addEventListener("click", ()=>{
            const u = new URL("./lesson.html", location.href);
            u.searchParams.set("data", ls.data);

            const p = new URLSearchParams(passthroughQS());
            p.forEach((v,k)=>{
              if(k !== "data") u.searchParams.set(k, v);
            });

            location.href = u.toString();
          });
        }else{
          btn.disabled = true;
          btn.classList.add("locked");
          if(higherBook && !higherGatePassed){
            const gateLabel = higherGateInfo ? `${higherGateInfo.id} ${higherGateInfo.label || higherGateInfo.lessonNo}` : "";
            if(higherGateResult && higherGateResult.ok === true){
              stateText = `${gateLabel} · ${lessonScoreText(higherGateResult)}`;
            }else{
              stateText = tr("locked");
            }
          }else{
          const blockIdx = teacherOverrideActive && blockingIndex >= 0 ? blockingIndex : (idx - 1);
          const blockLesson = blockIdx >= 0 ? lessons[blockIdx] : null;
          const blockResult = blockIdx >= 0 ? results[blockIdx] : null;
          const prevLabel = blockLesson ? (blockLesson.label || blockLesson.no || "") : "";
          if(blockResult && blockResult.ok === true){
            stateText = `🔒 ${prevLabel} · ${lessonScoreText(blockResult)} · 모두 90% 필요`;
          }else{
            stateText = `🔒 ${tr("locked")}`;
          }

          }
        }

        btn.innerHTML = `<span class="lessonBtnInner"><span>${label}</span><span class="lessonState">${stateText}</span></span>`;
        lessonGrid.appendChild(btn);
      });

      if(isDeveloper){
        statusEl.textContent = tr("developerAccess");
      }else if(lowerBookAccess){
        statusEl.textContent = tr("lowerCourseAccess");
      }else if(higherBook){
        statusEl.textContent = tr("masteryRule");
      }else if(teacherStartIndex >= 0){
        statusEl.textContent = `${tr("teacherOverride")} · ${teacherStartLesson}${getLang()==="MN" ? "-р хичээл" : "과"}`;
      }else{
        statusEl.textContent = tr("masteryRule");
      }
    }

    btnReset.addEventListener("click", backToBooks);

    btnBack.addEventListener("click", ()=>{
      // 레슨 목록 화면이면 → 교재 목록으로
      if(!lessonWrap.classList.contains("hidden")){
        backToBooks();
        return;
      }
      // 교재 목록 화면이면 → 이전 페이지(없으면 홈)
      if(history.length > 1) history.back();
      else location.href = withQS("../index.html");
    });

    btnLang.addEventListener("click", ()=>{
      const next = (getLang()==="KR") ? "MN" : "KR";
      setLang(next);
      applyTop();
    });

    async function loadManifest(){
      clearErr();
      applyTop();
      statusEl.textContent = tr("loading");

      const auth = await validateSession();
      if(!auth || auth.ok !== true){
        showAuthRequired(auth || {ok:false,error:"empty_response"});
        return;
      }

      try{
        const url = new URL("../data/snu/manifest.json", location.href).toString();
        const res = await fetch(url, { cache:"no-store" });
        if(!res.ok) throw new Error("HTTP " + res.status + "\n" + url);
        MANIFEST = await res.json();

        statusEl.textContent = tr("loaded");
        renderBooks();
      }catch(e){
        statusEl.textContent = "오류";
        showErr("manifest.json을 불러오지 못했습니다.\n" + (e.message || e));
      }
    }

    loadManifest();
  </script>
</body>
</html>
