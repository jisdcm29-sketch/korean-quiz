<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>서울대 레슨</title>
  <style>
    :root{
      --bg:#0b1220;--card:#111827;--text:#e5e7eb;--muted:#9ca3af;--line:#243044;
      --blue:#60a5fa;--green:#34d399;--red:#f87171;--amber:#fbbf24;--violet:#a78bfa;--teal:#22d3ee;
      --shadow:0 10px 30px rgba(0,0,0,.25);
    }
    *{box-sizing:border-box}
    html,body{overflow-x:hidden}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans KR",Arial,sans-serif;
      background:linear-gradient(180deg,#050814,var(--bg));
      color:var(--text);
    }
    a{color:inherit;text-decoration:none}
    button{font-family:inherit}
    .container{max-width:980px;margin:0 auto;padding:16px}

    .topbar{
      position:sticky;top:0;z-index:30;
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:10px 10px;background:rgba(5,8,20,.78);backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line);
    }
    .brand{display:flex;align-items:center;gap:10px;font-weight:950}
    .dot{width:10px;height:10px;border-radius:999px;background:var(--blue)}
    .btnRow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:flex-end}

    .btn{
      padding:12px 16px;
      border-radius:16px;
      border:1px solid var(--line);
      background:#0b1020;
      color:var(--text);
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:48px;
      font-size:16px;
      font-weight:900;
      letter-spacing:.2px;
      -webkit-tap-highlight-color:transparent;
      box-shadow:0 8px 18px rgba(0,0,0,.22);
      white-space:nowrap;
    }
    .btn:active{transform:translateY(1px)}
    .btn:hover{filter:brightness(1.06)}
    .btnBack{
      background:linear-gradient(135deg,rgba(167,139,250,.25), rgba(11,16,32,.96));
      border-color:rgba(167,139,250,.55);
      min-width:56px;
      font-size:18px;
    }
    .btnLang{
      background:linear-gradient(135deg,rgba(52,211,153,.22), rgba(11,16,32,.96));
      border-color:rgba(52,211,153,.55);
      min-width:64px;
      font-size:16px;
    }

    .card{
      background:rgba(17,24,39,.9);
      border:1px solid var(--line);
      border-radius:20px;
      padding:16px;
      box-shadow:var(--shadow);
    }
    .muted{color:var(--muted);line-height:1.6}
    .small{font-size:13px}
    .bar{height:1px;background:var(--line);margin:12px 0}

    .tabs{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    .tab{
      padding:12px 16px;
      border-radius:16px;
      border:1px solid var(--line);
      background:#0b1020;
      color:var(--text);
      cursor:pointer;
      font-weight:950;
      font-size:16px;
      min-height:48px;
      box-shadow:0 8px 18px rgba(0,0,0,.18);
      -webkit-tap-highlight-color:transparent;
      white-space:nowrap;
    }
    .tab:active{transform:translateY(1px)}
    .tab.active{filter:brightness(1.10)}
    .tab.tab-vocab{background:linear-gradient(135deg,rgba(52,211,153,.18), rgba(11,16,32,.96));border-color:rgba(52,211,153,.50);}
    .tab.tab-quiz{background:linear-gradient(135deg,rgba(96,165,250,.20), rgba(11,16,32,.96));border-color:rgba(96,165,250,.55);}
    .tab.tab-grammar{background:linear-gradient(135deg,rgba(251,191,36,.18), rgba(11,16,32,.96));border-color:rgba(251,191,36,.50);}
    .tab.tab-mixed{background:linear-gradient(135deg,rgba(248,113,113,.16), rgba(11,16,32,.96));border-color:rgba(248,113,113,.46);}

    .panel{display:none;margin-top:12px}
    .panel.active{display:block}

    table{width:100%;border-collapse:collapse;margin-top:10px}
    th,td{border-bottom:1px solid var(--line);padding:12px;vertical-align:top}
    th{color:var(--muted);text-align:left;font-weight:800}
    td b{font-weight:950}

    .qbox{
      border:1px solid var(--line);
      background:#0b1020;
      border-radius:18px;
      padding:14px;
    }

    .qHead{
      margin-bottom:10px;
      text-align:center;
      padding:12px 12px;
      border-radius:16px;
      border:1px solid rgba(96,165,250,.20);
      background:linear-gradient(135deg,rgba(96,165,250,.14), rgba(11,16,32,.96));
      box-shadow:0 10px 22px rgba(0,0,0,.14);
    }
    .qLabel{color:var(--muted);font-size:13px;font-weight:800}
    .qText{
      font-weight:950;
      letter-spacing:.2px;
      margin-top:8px;
      text-align:center;
      line-height:1.12;
      font-size:24px;
      word-break:keep-all;
      overflow-wrap:anywhere;
    }
    .qDialogue{display:inline-grid;width:max-content;max-width:100%;text-align:left}
    .qLine{display:block;overflow-wrap:anywhere}
    .qLine.answerLine{display:flex;width:100%;align-items:baseline;white-space:nowrap}
    .qBlank{display:inline-block;flex:1 1 auto;min-width:8ch;margin:0 4px 3px;border-bottom:3px solid currentColor}

    .choices{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:8px;
      margin-top:10px;
    }
    @media(max-width:800px){.choices{grid-template-columns:1fr}}
    .choice{
      padding:13px 12px;
      border-radius:18px;
      border:1px solid var(--line);
      background:linear-gradient(135deg,rgba(255,255,255,.04), rgba(11,16,32,.96));
      color:var(--text);
      cursor:pointer;
      text-align:center;
      font-weight:900;
      font-size:21px;
      min-height:52px;
      box-shadow:0 10px 22px rgba(0,0,0,.18);
      white-space:normal;
      overflow-wrap:anywhere;
      -webkit-tap-highlight-color:transparent;
    }
    .choice:hover{filter:brightness(1.06)}
    .choice:active{transform:translateY(1px)}
    .result{margin-top:10px;padding:12px;border-radius:16px;border:1px solid var(--line);background:rgba(11,16,32,.7)}
    .result.ok{border-color:rgba(52,211,153,.6)}
    .result.bad{border-color:rgba(248,113,113,.6)}

    .quizControls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end;margin-bottom:10px}
    .timeBtn{
      padding:10px 14px;border-radius:14px;border:1px solid rgba(251,191,36,.45);
      background:linear-gradient(135deg,rgba(251,191,36,.12),rgba(11,16,32,.96));
      color:var(--text);font-weight:900;cursor:pointer;min-height:44px;
    }
    .timeBtn.active{background:rgba(251,191,36,.28);border-color:var(--amber);color:#fff}
    .quizStats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
    .statBox{border:1px solid var(--line);border-radius:14px;padding:9px 8px;text-align:center;background:rgba(11,16,32,.72)}
    .statLabel{display:block;color:var(--muted);font-size:12px;font-weight:800;margin-bottom:4px}
    .statValue{font-size:19px;font-weight:950}
    .timerBox{border-color:rgba(34,211,238,.52)}
    .timerBox.urgent{border-color:var(--red);background:rgba(248,113,113,.14);animation:timerPulse .7s infinite alternate}
    @keyframes timerPulse{from{filter:brightness(1)}to{filter:brightness(1.35)}}
    .choice.correctChoice{border-color:var(--green);background:rgba(52,211,153,.16)}
    .choice.wrongChoice{border-color:var(--red);background:rgba(248,113,113,.16)}
    .quizSummary{text-align:center;padding:18px}
    .summaryScore{font-size:34px;font-weight:950;color:var(--green);margin:8px 0}
    .reviewList{text-align:left;margin-top:18px;border-top:1px solid var(--line);padding-top:12px}.reviewTitle{font-size:18px;font-weight:950;margin:0 0 8px}.reviewItem{padding:12px 0;border-bottom:1px solid var(--line);line-height:1.6}.reviewPrompt{font-weight:900;white-space:pre-line}.reviewMeta{margin-top:5px;font-size:14px}.reviewMine{color:#fecaca}.reviewCorrect{color:#d1fae5}.reviewTimeout{display:inline-block;margin-left:7px;padding:2px 7px;border-radius:999px;border:1px solid rgba(248,113,113,.55);color:#fecaca;font-size:11px;font-weight:900}

    /* STEP30-3: 개발자용 서울대 어휘 직접 편집 */
    .contentEditorControls{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:10px;padding:9px 10px;border:1px solid rgba(251,191,36,.35);border-radius:14px;background:rgba(48,39,21,.48)}
    .contentEditorControls[hidden]{display:none}.editorBadge{font-size:12px;color:#fde68a;border:1px solid #7c5d16;background:#2d230d;border-radius:999px;padding:5px 9px;font-weight:850}.editModeBtn,.editVocabBtn{padding:8px 12px;border:1px solid var(--amber);background:#302715;color:#fde68a;border-radius:11px;cursor:pointer;font-weight:900}.editModeBtn.active{background:#644b0e;color:#fff}.editedMark{font-size:12px;color:#86efac;font-weight:850}.vocabEditCell{width:150px;text-align:right;white-space:nowrap}.vocabEditedRow{background:rgba(34,197,94,.055)}
    .vocabQuizEditorBar{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin:0 0 8px}.vocabQuizEditorBar[hidden]{display:none}
    .vocabEditorModal{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.72)}.vocabEditorModal[hidden]{display:none}.vocabEditorDialog{width:min(720px,100%);max-height:92vh;overflow:auto;background:#111a2a;border:1px solid #4b5d78;border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.55);padding:18px}.vocabEditorDialog h2{margin:0 0 4px;color:#fde68a}.vocabEditorMeta{color:var(--muted);font-size:13px;margin-bottom:14px}.vocabEditorField{display:block;margin-top:12px;font-weight:850}.vocabEditorField input,.vocabEditorField textarea{width:100%;margin-top:6px;border:1px solid #3b4b66;background:#08111f;color:#fff;border-radius:11px;padding:11px 12px;font:inherit}.vocabEditorField textarea{min-height:82px;resize:vertical;line-height:1.5}.vocabEditorGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.vocabEditorHelp{margin-top:10px;color:var(--muted);font-size:12px;line-height:1.55}.vocabEditorActions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:18px}.vocabEditorActions button{padding:10px 14px;border-radius:11px;border:1px solid var(--line);background:#101829;color:#fff;cursor:pointer;font-weight:900}.vocabEditorActions .save{border-color:#22c55e;background:#123725}.vocabEditorActions .restore{border-color:#ef4444;background:#3a151b}.vocabEditorActions button:disabled{opacity:.55;cursor:wait}.vocabEditorMessage{min-height:20px;margin-top:10px;font-size:13px}.vocabEditorMessage.ok{color:#86efac}.vocabEditorMessage.bad{color:#fecaca}
    @media(max-width:620px){.vocabEditorGrid{grid-template-columns:1fr}.vocabEditCell{width:auto}.contentEditorControls{justify-content:space-between}.editVocabBtn{padding:7px 9px;font-size:13px}}

    .btnMode{
      background:linear-gradient(135deg,rgba(34,211,238,.18), rgba(11,16,32,.96));
      border-color:rgba(34,211,238,.52);
    }
    .btnNew{
      background:linear-gradient(135deg,rgba(167,139,250,.20), rgba(11,16,32,.96));
      border-color:rgba(167,139,250,.52);
    }

    @media(max-width:520px){
      .container{padding:10px}
      .card{padding:14px;border-radius:18px}

      .btnRow{flex-wrap:nowrap;gap:8px}
      .btn{min-height:50px;font-size:15px;padding:10px 12px;border-radius:14px}
      .btnBack{font-size:18px;min-width:52px}
      .btnLang{min-width:60px}

      .tabs{
        display:grid;
        grid-template-columns:repeat(4,1fr);
        gap:8px;
        margin-top:10px;
      }
      .tab{
        min-height:44px;
        font-size:13px;
        padding:10px 8px;
        border-radius:14px;
        text-align:center;
      }

      #panel-quiz .btnRow{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:8px;
        align-items:stretch;
      }
      .quizControls{display:grid;grid-template-columns:1fr 1fr;justify-content:stretch}
      .quizControls .btnMode,.quizControls .btnNew{grid-column:span 2}
      .quizStats{grid-template-columns:repeat(2,1fr)}
      #btnMode, #btnNew{
        width:100%;
        font-size:13px;
        padding:10px 10px;
        min-height:44px;
        border-radius:14px;
      }

      #panel-mixed .btnRow{display:flex;justify-content:flex-start}
      #btnNewMixed{font-size:13px;padding:10px 10px;min-height:44px;border-radius:14px}

      .qText{font-size:26px;}
      .qDialogue{width:100%}
      .qLine.answerLine{white-space:normal}
      .qBlank{min-width:6ch}
      .choices{gap:6px;}
      .choice{font-size:22px;min-height:48px;padding:12px 10px;}
    }
  .tab-reading{background:linear-gradient(135deg,rgba(251,191,36,.18),rgba(11,16,32,.96));border-color:rgba(251,191,36,.42)}
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <span>Korean Quiz</span>
    </div>

    <div class="btnRow">
      <button class="btn btnBack" id="btnBack" type="button" aria-label="back">←</button>
      <button class="btn btnLang" id="btnLang" type="button">KR</button>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end">
        <div>
          <h1 style="margin:0 0 6px;font-size:28px;font-weight:950;letter-spacing:.2px" id="title">레슨</h1>
          <div class="muted" id="subtitle">불러오는 중...</div>
        </div>
        <div class="muted small" id="status"></div>
      </div>

      <div class="tabs" role="tablist" aria-label="lesson tabs">
        <button class="tab tab-vocab active" id="tab-vocab" type="button">어휘 보기</button>
        <button class="tab tab-quiz" id="tab-quiz" type="button">어휘 테스트</button>
        <button class="tab tab-grammar" id="tab-grammar" type="button">문법</button>
        <button class="tab tab-mixed" id="tab-mixed" type="button">종합 테스트</button>
        <button class="tab tab-reading" id="tab-reading" type="button">읽기 연습</button>
      </div>

      <div class="contentEditorControls" id="contentEditorControls" hidden>
        <span class="editorBadge">개발자 콘텐츠 편집</span>
        <span class="editedMark" id="vocabOverrideCount"></span>
        <button class="editModeBtn" id="toggleVocabEditMode" type="button">수정 모드 OFF</button>
      </div>

      <div class="bar"></div>

      <div class="panel active" id="panel-vocab">
        <!-- ✅ 기존 어휘(HTML) 보기 버튼/행 삭제 (공간도 같이 사라짐) -->
        <div id="vocab"></div>
      </div>

      <div class="panel" id="panel-quiz">
        <div class="quizControls">
          <button class="btn btnMode" id="btnMode" type="button">방향: 한국어 → 몽골어</button>
          <button class="timeBtn" id="btnTime7" type="button">문항당 7초</button>
          <button class="timeBtn" id="btnTime10" type="button">문항당 10초</button>
          <button class="btn btnNew" id="btnNew" type="button">다시 시작</button>
        </div>
        <div class="muted small" id="quizHint"></div>
        <div class="bar"></div>
        <div id="quiz"></div>
      </div>

      <div class="panel" id="panel-grammar">
        <div id="grammar"></div>
      </div>

      <div class="panel" id="panel-mixed">
        <div class="btnRow" style="margin-bottom:10px;">
          <button class="timeBtn active" id="btnMixed10" type="button">문항당 10초</button>
          <button class="timeBtn" id="btnMixed15" type="button">문항당 15초</button>
          <button class="btn btnNew" id="btnNewMixed" type="button">다시 시작</button>
        </div>
        <div class="muted small" id="mixedHint"></div>
        <div class="bar"></div>
        <div id="mixed"></div>
      </div>
    </section>
  </main>

  <script>
    const I18N = {
      KR: {
        loading: "불러오는 중...",
        loaded: "로드 완료",
        vocabView: "어휘 보기",
        vocabQuiz: "어휘 테스트",
        grammar: "문법",
        mixed: "종합 테스트",
        reading: "읽기 연습",
        thKo: "한국어",
        thMn: "몽골어",
        noVocab: "어휘 데이터가 없습니다.",
        noGrammar: "문법이 없습니다.",
        modeK2M: "방향: 한국어 → 몽골어",
        modeM2K: "방향: 몽골어 → 한국어",
        newQ: "새 문제",
        mixedHint: (nv, ng)=> (nv||ng) ? `어휘/문법을 섞어 랜덤 출제합니다. (현재: 어휘 ${nv}개, 문법 ${ng}개)` : "어휘/문법 데이터가 없어서 테스트를 만들 수 없습니다.",
        qLabel: "문제",
        correct: "정답!",
        wrong: "오답!",
        answer: "정답",
        restart: "다시 시작",
        time7: "문항당 7초",
        time10: "문항당 10초",
        progress: "진행",
        correctCount: "정답",
        wrongCount: "오답",
        timeLeft: "남은 시간",
        seconds: "초",
        timeout: "시간 초과!",
        completed: "테스트 완료",
        accuracy: "정답률",
        timeoutCount: "시간 초과",
        quizHint: (n)=> n ? `전체 어휘 ${n}개를 중복 없이 무작위 순서로 출제합니다.` : "어휘 데이터가 없어서 테스트를 만들 수 없습니다.",
        cant: "퀴즈를 만들 수 없습니다. (데이터 확인 필요)",
        grammarMissingFile: "문법 파일을 찾을 수 없습니다. (레벨/과 정보 확인 필요)"
      },
      MN: {
        loading: "Ачаалж байна...",
        loaded: "Ачааллаа",
        vocabView: "Үг харах",
        vocabQuiz: "Үг шалгалт",
        grammar: "Дүрэм",
        mixed: "Нэгдсэн тест",
        reading: "Унших дасгал",
        thKo: "Солонгос",
        thMn: "Монгол",
        noVocab: "Үгийн өгөгдөл алга.",
        noGrammar: "Дүрэм байхгүй.",
        modeK2M: "Чиглэл: Солонгос → Монгол",
        modeM2K: "Чиглэл: Монгол → Солонгос",
        newQ: "Шинэ асуулт",
        quizHint: (n)=> n ? `Нийт ${n} үгийг давталгүй санамсаргүй дарааллаар асууна.` : "Үг байхгүй тул шалгалт үүсгэж чадсангүй.",
        mixedHint: (nv, ng)=> (nv||ng) ? `Үг/Дүрмийг хольж санамсаргүй асууна. (Одоо: Үг ${nv}, Дүрэм ${ng})` : "Үг/Дүрэм байхгүй тул тест үүсгэж чадсангүй.",
        qLabel: "Асуулт",
        correct: "Зөв!",
        wrong: "Буруу!",
        answer: "Зөв хариулт",
        restart: "Дахин эхлэх",
        time7: "Асуулт бүр 7 сек",
        time10: "Асуулт бүр 10 сек",
        progress: "Явц",
        correctCount: "Зөв",
        wrongCount: "Буруу",
        timeLeft: "Үлдсэн хугацаа",
        seconds: "сек",
        timeout: "Хугацаа дууслаа!",
        completed: "Шалгалт дууслаа",
        accuracy: "Зөв хариулт",
        timeoutCount: "Хугацаа хэтэрсэн",
        cant: "Шалгалт үүсгэж чадсангүй. (өгөгдөл шалгана уу)",
        grammarMissingFile: "Дүрмийн файл олдсонгүй. (Түвшин/хичээл шалгана уу)"
      }
    };

    function getLang(){
      const u = new URL(location.href);
      const q = (u.searchParams.get("lang")||"").toUpperCase();
      const s1 = (localStorage.getItem("lang")||"").toUpperCase();
      const s2 = (localStorage.getItem("kq_lang")||"").toUpperCase();
      const pick = (q==="MN"||q==="KR") ? q : (s2||s1);
      return (pick==="MN") ? "MN" : "KR";
    }
    function setLang(l){
      localStorage.setItem("lang", l);
      localStorage.setItem("kq_lang", l);
    }
    function tr(key, a, b){
      const L = getLang();
      const v = (I18N[L] && I18N[L][key]) ? I18N[L][key] : I18N.KR[key];

    function makeVocabQuestion(q, vocab){
      const pool = vocab.filter(v => (v.ko || v.mn));
      if(!pool.length || !q) return null;
      const getPrompt = (v) => QUIZ_MODE==="KO2MN" ? (v.ko||"") : (v.mn||"");
      const getAnswer = (v) => QUIZ_MODE==="KO2MN" ? (v.mn||"") : (v.ko||"");

      const correct = getAnswer(q);
      const prompt = getPrompt(q);
      if(!prompt || !correct) return null;

      const others = pool.map(v => getAnswer(v)).filter(a => a && a !== correct);
      const uniq = Array.from(new Set(others));
      const distractors = shuffle(uniq).slice(0, 3);
      const choices = shuffle([correct, ...distractors]);

      return { prompt, correct, choices, itemId:String(q.__contentId || "") };
    }

        const mn=String(v.mn||"").trim();
        if(!ko || !mn) return false;
        const key=`${ko}\u0000${mn}`;
        if(seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function sendResultJsonp(params){
      return new Promise((resolve, reject)=>{
        const cb = `kq_result_${Date.now()}_${Math.random().toString(36).slice(2)}`;
        const script = document.createElement("script");
        const query = new URLSearchParams({...params, callback:cb});
        const cleanup = ()=>{
          try{ delete window[cb]; }catch(e){}
          if(script.parentNode) script.parentNode.removeChild(script);
        };
        const timer = setTimeout(()=>{ cleanup(); reject(new Error("result_log_timeout")); }, 8000);
        window[cb] = (data)=>{ clearTimeout(timer); cleanup(); resolve(data); };
        script.onerror = ()=>{ clearTimeout(timer); cleanup(); reject(new Error("result_log_error")); };
        script.src = `${RESULT_LOG_SCRIPT_URL}?${query.toString()}`;
        document.head.appendChild(script);
      });
    }

    async function verifyLessonUnlocked(d){
      const level = String((d && d.meta && d.meta.level) || (d && d.level) || "").toUpperCase();
      const lessonRaw = String((d && d.meta && d.meta.lesson) || (d && d.lesson) || "");
      const lessonNo = parseInt(lessonRaw.replace(/[^0-9]/g, ""), 10);
      if(!level || !Number.isFinite(lessonNo)){
        return {allowed:false,error:"lesson_meta_invalid",level,lessonNo:lessonRaw};
      }

      const firstLesson = firstLessonNoForLevel(level);
      const id = resultLogIdentity();
      if(!id.token){
        // 모든 과는 반드시 정상 로그인 토큰이 있어야 한다. 첫 과도 예외로 열지 않는다.
        return {allowed:false,error:"missing_token",authRequired:true,level,lessonNo,firstLesson};
      }

      try{
        // learning_start 응답 자체가 서버의 토큰 검증 결과다.
        // 토큰이 없거나 만료/변조된 경우 어떤 과도 열지 않는다.
        const accessProfile = await sendResultJsonp({
          action:"learning_start",
          token:id.token,
          name:id.name,
          book:`SNU-${level}`
        });
        if(!accessProfile || accessProfile.ok !== true){
          return {
            allowed:false,
            error:(accessProfile && accessProfile.error) || "auth_check_failed",
            authRequired:true,
            level,
            lessonNo,
            firstLesson
          };
        }
        if(accessProfile.isDeveloper === true){
          return {allowed:true,level,lessonNo,firstLesson,isDeveloper:true,role:"developer"};
        }

        // 교사 지정 시작 교재보다 낮은 교재는 이전 이수 과정으로 인정하여 모든 과 접근을 허용한다.
        if(accessProfile.lowerBookAccess === true){
          return {allowed:true,level,lessonNo,firstLesson,lowerBookAccess:true,teacherOverride:true,role:"student"};
        }

        const higherBook = accessProfile.higherBook === true || accessProfile.bookRelation === "higher";
        if(higherBook){
          const gateInfo = previousBookGateForLevel(level);
          if(!gateInfo || !gateInfo.lastLesson){
            return {allowed:false,error:"previous_book_gate_missing",level,lessonNo,firstLesson};
          }
          const gateTypes = ["vocab","grammar","mixed"];
          const gateResponses = await Promise.all(gateTypes.map(testType=>sendResultJsonp({
            action:"mastery_status", token:id.token, name:id.name,
            book:`SNU-${gateInfo.level}`, lesson:String(gateInfo.lastLesson), testType
          })));
          const gateTests = {};
          gateTypes.forEach((type,i)=>{ gateTests[type] = gateResponses[i] || {}; });
          const gateError = gateTypes.map(type=>gateTests[type]).find(r=>!r || r.ok !== true);
          const gateErrorText = gateError ? String(gateError.error || "status_check_failed") : "";
          if(["expired_or_invalid","missing_token","invalid_token","unauthorized"].includes(gateErrorText)){
            return {allowed:false,error:gateErrorText,authRequired:true,level,lessonNo,firstLesson};
          }
          const gatePassed = gateTypes.every(type=>gateTests[type] && gateTests[type].ok === true && gateTests[type].status === "PASS" && Number(gateTests[type].bestScore || 0) >= 90);
          if(!gatePassed){
            return {allowed:false,level,lessonNo,firstLesson,crossBookGate:true,previousBook:gateInfo.level,previousLesson:gateInfo.lastLesson,
              previousScores:{vocab:Number(gateTests.vocab.bestScore||0),grammar:Number(gateTests.grammar.bestScore||0),mixed:Number(gateTests.mixed.bestScore||0)},
              passScore:90,error:gateErrorText};
          }
        }

        // 교사가 지정한 시작 과가 있으면 그 과까지는 기존 진도로 인정한다.
        // 예: startLesson=3 -> 1, 2, 3과는 바로 접근 가능하고 4과부터 3과의 3개 시험 통과를 요구한다.
        let teacherStartLesson = 0;
        if(!higherBook && accessProfile && accessProfile.ok === true && accessProfile.found === true && accessProfile.enabled === true){
          const requestedStart = Number(accessProfile.startLesson || 0);
          if(Number.isFinite(requestedStart) && requestedStart > 0){
            teacherStartLesson = Math.max(firstLesson, Math.floor(requestedStart));
          }
        }

        if(teacherStartLesson > 0 && lessonNo <= teacherStartLesson){
          return {
            allowed:true,
            level,
            lessonNo,
            firstLesson,
            teacherStartLesson,
            teacherOverride:true,
            role:"student"
          };
        }

        if(lessonNo === firstLesson){
          return {allowed:true,level,lessonNo,firstLesson,isFirst:true};
        }

        const previousLesson = lessonNo - 1;
        const testTypes = ["vocab","grammar","mixed"];
        const responses = await Promise.all(testTypes.map(testType=>sendResultJsonp({
          action:"mastery_status",
          token:id.token,
          name:id.name,
          book:`SNU-${level}`,
          lesson:String(previousLesson),
          testType
        })));

        const tests = {};
        testTypes.forEach((type, i)=>{ tests[type] = responses[i] || {}; });
        const allOk = testTypes.every(type=>tests[type] && tests[type].ok === true);
        const allowed = allOk && testTypes.every(type=>tests[type].status === "PASS" && Number(tests[type].bestScore || 0) >= 90);
        const firstError = testTypes.map(type=>tests[type]).find(r=>!r || r.ok !== true);

        return {
          allowed,
          level,
          lessonNo,
          previousLesson,
          previousScores:{
            vocab:Number(tests.vocab.bestScore || 0),
            grammar:Number(tests.grammar.bestScore || 0),
            mixed:Number(tests.mixed.bestScore || 0)
          },
          passScore:90,
          status:allowed ? "PASS" : "RETRY",
          error:firstError ? (firstError.error || "status_check_failed") : ""
        };
      }catch(err){
        return {
          allowed:false,
          error:(err && err.message) ? err.message : "status_check_failed",
          level,
          lessonNo,
          previousLesson:lessonNo-1,
          previousScores:{vocab:0,grammar:0,mixed:0},
          passScore:90,
          status:"NONE"
        };
      }
    }

    function finishQuiz(){
      stopQuizTimer();
      const s=QUIZ_STATE, total=s.queue.length;
      const accuracy=total ? Math.round((s.correct/total)*100) : 0;
      logVocabularyResult(accuracy, s.correct, total, s.timeout);
      const review = (s.miss||[]).length ? `<div class="reviewList"><div class="reviewTitle">${getLang()==="MN"?"Алдсан асуулт ба зөв хариулт":"틀린 문제와 정답"}</div>${s.miss.map((m,i)=>`<div class="reviewItem"><div class="reviewPrompt">${i+1}. ${escapeQuestionHtml(m.prompt)}</div><div class="reviewMeta reviewMine">${getLang()==="MN"?"Миний хариулт":"내 답"}: <b>${m.reason==="timeout"?(getLang()==="MN"?"Хугацаа хэтэрсэн":"시간 초과"):escapeQuestionHtml(m.selected||"")}</b>${m.reason==="timeout"?`<span class="reviewTimeout">${tr("timeout")}</span>`:""}</div><div class="reviewMeta reviewCorrect">${tr("answer")}: <b>${escapeQuestionHtml(m.correct)}</b></div></div>`).join("")}</div>` : `<div class="reviewList"><div class="reviewTitle">${getLang()==="MN"?"🎉 Бүгд зөв байна.":"🎉 모두 맞았습니다."}</div></div>`;

    function renderCurrentQuizQuestion(d){
      stopQuizTimer();
      const quizDiv=document.getElementById("quiz"), s=QUIZ_STATE;
      if(!s || s.index>=s.queue.length){ finishQuiz(); return; }
      s.locked=false; s.remaining=QUIZ_SECONDS;
      const q=makeVocabQuestion(s.queue[s.index], usableVocab(d.vocab));
      if(!q){ quizDiv.innerHTML=`<div class='muted'>${tr("cant")}</div>`; return; }
      quizDiv.innerHTML=renderQuizStats(s.queue.length)+currentVocabEditorMarkup(q.itemId);
      const currentEditBtn=document.getElementById("editCurrentVocab");
      if(currentEditBtn)currentEditBtn.onclick=()=>{const item=findVocabItemById(q.itemId);if(item)openVocabEditor(item);};
      const holder=document.createElement("div");
      quizDiv.appendChild(holder);
      renderQuestionInto(holder,q,(ok,btn,choicesWrap)=>{
        if(s.locked) return;
        s.locked=true; stopQuizTimer();
        if(ok) s.correct++; else { s.wrong++; s.miss.push({prompt:q.prompt,selected:btn?btn.textContent:"",correct:q.correct,reason:"wrong"}); }
        [...choicesWrap.querySelectorAll("button")].forEach(b=>{
          b.disabled=true;
          if(b.textContent===q.correct) b.classList.add("correctChoice");
        });
        if(!ok) btn.classList.add("wrongChoice");
        updateQuizStats();
        setTimeout(()=>{s.index++;renderCurrentQuizQuestion(d);}, ok?450:700);
      });
      updateQuizStats();
      QUIZ_TIMER=setInterval(()=>{
        if(s.locked) return;
        s.remaining--;
        updateQuizStats();
        if(s.remaining<=0){
          s.locked=true; stopQuizTimer(); s.wrong++; s.timeout++; s.miss.push({prompt:q.prompt,selected:"",correct:q.correct,reason:"timeout"}); updateQuizStats();
          const buttons=[...holder.querySelectorAll("button.choice")];
          buttons.forEach(b=>{b.disabled=true;if(b.textContent===q.correct)b.classList.add("correctChoice");});
          const result=holder.querySelector(".result");
          if(result){result.style.display="";result.classList.add("bad");result.innerHTML=`<b>${tr("timeout")}</b> <span class="muted small">${tr("answer")}: ${q.correct}</span>`;}
          setTimeout(()=>{s.index++;renderCurrentQuizQuestion(d);},700);
        }
      },1000);
    }

    function escapeQuestionHtml(value){
      return String(value ?? "").replace(/[&<>"']/g, ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
    }

    function formatQuestionPrompt(raw){
      const lines=String(raw ?? "").split(/\r?\n/);
      if(lines.length<2){
        return escapeQuestionHtml(raw).replace(/_{2,}/g,'<span class="qBlank" aria-label="빈칸"></span>');
      }
      return `<div class="qDialogue">${lines.slice(0,2).map((line,index)=>{
        const safe=escapeQuestionHtml(line);
        const hasBlank=index===1 && /_{2,}/.test(safe);
        const content=safe.replace(/_{2,}/g,'<span class="qBlank" aria-label="빈칸"></span>');
        return `<div class="qLine${hasBlank?' answerLine':''}">${content}</div>`;
      }).join("")}</div>`;
    }

    function renderQuestionInto(containerEl, q, onAnswered){
      containerEl.innerHTML = "";
      if(!q){
        containerEl.innerHTML = `<div class='muted'>${tr("cant")}</div>`;
        return;
      }

      const box = document.createElement("div");
      box.className = "qbox";

      const head = document.createElement("div");
      head.className = "qHead";
      head.innerHTML = `<div class="qLabel">${tr("qLabel")}</div><div class="qText">${formatQuestionPrompt(q.prompt)}</div>`;
      box.appendChild(head);

      const choicesWrap = document.createElement("div");
      choicesWrap.className = "choices";

      const result = document.createElement("div");
      result.className = "result";
      result.style.display = "none";

      function lock(){
        [...choicesWrap.querySelectorAll("button")].forEach(b=>b.disabled=true);
      }

      q.choices.forEach(ch=>{
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "choice";
        btn.textContent = ch;

        btn.addEventListener("click", ()=>{
          const ok = ch === q.correct;
          result.style.display = "";
          result.classList.remove("ok","bad");
          result.classList.add(ok ? "ok" : "bad");
          result.innerHTML = ok
            ? `<b>${tr("correct")}</b> <span class="muted small">(${tr("answer")}: ${q.correct})</span>`
            : `<b>${tr("wrong")}</b> <span class="muted small">${tr("answer")}: ${q.correct}</span>`;
          lock();
          if(onAnswered) onAnswered(ok, btn, choicesWrap);
        });

        choicesWrap.appendChild(btn);
      });

      box.appendChild(choicesWrap);
      box.appendChild(result);
      containerEl.appendChild(box);
    }

    function makeMixedVocabQuestion(item, vocab, mode, avoidSameMeaning=false){
      const prompt=mode==="KO2MN"?(item.ko||""):(item.mn||"");
      const correct=mode==="KO2MN"?(item.mn||""):(item.ko||"");
      const answers=vocab
        .filter(v=>!(avoidSameMeaning&&mode==="MN2KO"&&(v.mn||"")===(item.mn||"")))
        .map(v=>mode==="KO2MN"?(v.mn||""):(v.ko||""))
        .filter(x=>x&&x!==correct);
      const distractors=shuffle(Array.from(new Set(answers))).slice(0,3);
      return {category:"vocab",prompt,correct,choices:shuffle([correct,...distractors]),__sourceVocabId:String(item&&item.__contentId||"")};
    }

    function mixedQuestionKey(q,level,lesson){
      const base=mixedPromptKey(q);
      if(String(level||"").toUpperCase()!=="3A") return base;
      const nn=String(lesson||"").replace(/\D/g,"").padStart(2,"0");
      const groups=MIXED_DUP_GROUPS_3A[nn]||[];
      for(let i=0;i<groups.length;i++){
        const normalized=groups[i].map(p=>String(p).replace(/\s+/g," ").trim());
        if(normalized.includes(base)) return `3A-${nn}-group-${i+1}`;
      }
      return base;
    }

    function takeUniqueByPrompt(items,count,usedPrompts,level,lesson){
      const out=[];
      for(const q of shuffle(items)){
        const key=mixedQuestionKey(q,level,lesson);
        if(!key||usedPrompts.has(key)) continue;
        usedPrompts.add(key);
        out.push(q);
        if(out.length>=count) break;
      }
      return out;
    }

    function makeUniqueVocabQuestions(vocab,count,usedPrompts,avoidSameMeaning){
      const out=[];
      for(const item of shuffle(vocab)){
        for(const mode of shuffle(["KO2MN","MN2KO"])){
          const q=makeMixedVocabQuestion(item,vocab,mode,avoidSameMeaning);
          const key=mixedPromptKey(q);
          if(!key||usedPrompts.has(key)) continue;
          usedPrompts.add(key);
          out.push(q);
          break;
        }
        if(out.length>=count) break;
      }
      return out;
    }

    function buildMixedQueue(d){
      const vocab=usableVocab(d.vocab);
      const grammarBank=(Array.isArray(d.grammar_questions)?d.grammar_questions:[])
        .filter(x=>x&&x.prompt&&x.correct&&Array.isArray(x.choices)&&x.choices.length>=2)
        .map(x=>({...x,category:"grammar"}));
      const integratedBank=(Array.isArray(d.mixed_questions)?d.mixed_questions:[])
        .filter(x=>x&&x.category==="integrated"&&x.prompt&&x.correct&&Array.isArray(x.choices)&&x.choices.length>=2);
      const mixedLevel=String(d.level||"").toUpperCase();
      const useUniqueMixed=(mixedLevel==="2A"||mixedLevel==="2B"||mixedLevel==="3A"||mixedLevel==="3B"||mixedLevel==="4A"||mixedLevel==="4B");
      const storageKey=`kq_mixed_last_${d.level||""}_${d.lesson||""}`;
      const previous=sessionStorage.getItem(storageKey)||"";
      let queue=[],signature="";
      for(let attempt=0;attempt<12;attempt++){
        if(useUniqueMixed){
          const usedPrompts=new Set();
          const vocabQuestions=makeUniqueVocabQuestions(vocab,Math.min(8,vocab.length),usedPrompts,true);
          let grammarQuestions,integratedQuestions;
          if(mixedLevel==="3A"||mixedLevel==="3B"){
            // 3A/3B는 통합 5문항 중 4문항을 먼저 확보한 뒤, 같은 질문의 문법 문항을 제외한다.
            integratedQuestions=takeUniqueByPrompt(integratedBank,Math.min(4,integratedBank.length),usedPrompts,d.level,d.lesson);
            grammarQuestions=takeUniqueByPrompt(grammarBank,Math.min(8,grammarBank.length),usedPrompts,d.level,d.lesson);
          }else{
            grammarQuestions=takeUniqueByPrompt(grammarBank,Math.min(8,grammarBank.length),usedPrompts,d.level,d.lesson);
            integratedQuestions=takeUniqueByPrompt(integratedBank,Math.min(4,integratedBank.length),usedPrompts,d.level,d.lesson);
          }
          queue=[...vocabQuestions,...grammarQuestions,...integratedQuestions];
        }else{
          const vocabItems=shuffle(vocab).slice(0,Math.min(8,vocab.length));
          const vocabQuestions=vocabItems.map(item=>makeMixedVocabQuestion(item,vocab,Math.random()<.5?"KO2MN":"MN2KO"));
          const grammarQuestions=shuffle(grammarBank).slice(0,Math.min(8,grammarBank.length));
          const integratedQuestions=shuffle(integratedBank).slice(0,Math.min(4,integratedBank.length));
          queue=[...vocabQuestions,...grammarQuestions,...integratedQuestions];
        }
        signature=queue.map(q=>`${q.category}|${q.prompt}|${q.correct}`).sort().join("\u0001");
        if(signature!==previous) break;
      }
      sessionStorage.setItem(storageKey,signature);
      return shuffle(queue);
    }

    function startMixed(d){
      stopMixedTimer();
      const queue=buildMixedQueue(d);
      MIXED_STATE={queue,index:0,correct:0,wrong:0,timeout:0,locked:false,remaining:MIXED_SECONDS,miss:[],category:{vocab:{c:0,t:0},grammar:{c:0,t:0},integrated:{c:0,t:0}}};
      renderCurrentMixed(d);
    }

    function mixedStats(total){
      const s=MIXED_STATE;
      return `<div class="quizStats">
        <div class="statBox"><span class="statLabel">${tr("progress")}</span><span class="statValue">${Math.min(s.index+1,total)} / ${total}</span></div>
        <div class="statBox"><span class="statLabel">${tr("correctCount")}</span><span class="statValue" id="mixedCorrect">${s.correct}</span></div>
        <div class="statBox"><span class="statLabel">${tr("wrongCount")}</span><span class="statValue" id="mixedWrong">${s.wrong}</span></div>
        <div class="statBox timerBox" id="mixedTimerBox"><span class="statLabel">${tr("timeLeft")}</span><span class="statValue"><span id="mixedTime">${s.remaining}</span>${tr("seconds")}</span></div>
      </div>`;
    }

    function updateMixed(){
      const s=MIXED_STATE;
      const c=document.getElementById("mixedCorrect"),w=document.getElementById("mixedWrong"),t=document.getElementById("mixedTime"),b=document.getElementById("mixedTimerBox");
      if(c)c.textContent=s.correct;if(w)w.textContent=s.wrong;if(t)t.textContent=s.remaining;if(b)b.classList.toggle("urgent",s.remaining<=3);
    }

    function finishMixed(){
      stopMixedTimer();const s=MIXED_STATE,total=s.queue.length,pct=total?Math.round(s.correct/total*100):0;
      logMixedResult(pct, s);
      const label={vocab:getLang()==="MN"?"Үг":"어휘",grammar:getLang()==="MN"?"Дүрэм":"문법",integrated:getLang()==="MN"?"Нэгдсэн":"통합"};
      const rows=Object.keys(s.category).map(k=>`<div class="statBox"><span class="statLabel">${label[k]}</span><span class="statValue">${s.category[k].c} / ${s.category[k].t}</span></div>`).join("");
      const review=(s.miss||[]).length?`<div class="reviewList"><div class="reviewTitle">${getLang()==="MN"?"Алдсан асуулт ба зөв хариулт":"틀린 문제와 정답"}</div>${s.miss.map((m,i)=>`<div class="reviewItem"><div class="reviewPrompt">${i+1}. [${label[m.category]||label.integrated}] ${escapeQuestionHtml(m.prompt)}</div><div class="reviewMeta reviewMine">${getLang()==="MN"?"Миний хариулт":"내 답"}: <b>${m.reason==="timeout"?(getLang()==="MN"?"Хугацаа хэтэрсэн":"시간 초과"):escapeQuestionHtml(m.selected||"")}</b>${m.reason==="timeout"?`<span class="reviewTimeout">${tr("timeout")}</span>`:""}</div><div class="reviewMeta reviewCorrect">${tr("answer")}: <b>${escapeQuestionHtml(m.correct)}</b></div></div>`).join("")}</div>`:`<div class="reviewList"><div class="reviewTitle">${getLang()==="MN"?"🎉 Бүгд зөв байна.":"🎉 모두 맞았습니다."}</div></div>`;
      document.getElementById("mixed").innerHTML=`<div class="qbox quizSummary"><div class="qLabel">${tr("completed")}</div><div class="summaryScore">${pct}%</div><div>${tr("correctCount")}: <b>${s.correct}</b> / ${tr("wrongCount")}: <b>${s.wrong}</b> / ${tr("timeoutCount")}: <b>${s.timeout}</b></div><div class="quizStats" style="margin-top:12px">${rows}</div>${review}</div>`;
    }

    function renderCurrentMixed(d){
      stopMixedTimer();const div=document.getElementById("mixed"),s=MIXED_STATE;
      if(!s||!s.queue.length){div.innerHTML=`<div class='muted'>${tr("cant")}</div>`;return;}
      if(s.index>=s.queue.length){finishMixed();return;}
      s.locked=false;s.remaining=MIXED_SECONDS;const raw=s.queue[s.index];const q={prompt:raw.prompt,correct:raw.correct,choices:shuffle(Array.from(new Set([raw.correct,...raw.choices])).filter(Boolean))};
      div.innerHTML=mixedStats(s.queue.length)+mixedEditorBar(raw);const holder=document.createElement("div");div.appendChild(holder);
      const editMixed=document.getElementById("editCurrentMixedQuestion");if(editMixed)editMixed.onclick=()=>openMixedEditor(raw);
      const editMixedVocab=document.getElementById("editCurrentMixedSource");if(editMixedVocab)editMixedVocab.onclick=()=>{const item=findVocabItemById(raw.__sourceVocabId);if(item)openVocabEditor(item);};
      renderQuestionInto(holder,q,(ok,btn,wrap)=>{if(s.locked)return;s.locked=true;stopMixedTimer();const cat=s.category[raw.category]||s.category.integrated;cat.t++;if(ok){s.correct++;cat.c++;}else{s.wrong++;s.miss.push({category:raw.category||"integrated",prompt:q.prompt,selected:btn?btn.textContent:"",correct:q.correct,reason:"wrong"});}[...wrap.querySelectorAll("button")].forEach(b=>{b.disabled=true;if(b.textContent===q.correct)b.classList.add("correctChoice")});if(!ok)btn.classList.add("wrongChoice");updateMixed();setTimeout(()=>{s.index++;renderCurrentMixed(d)},650)});
      updateMixed();MIXED_TIMER=setInterval(()=>{if(s.locked)return;s.remaining--;updateMixed();if(s.remaining<=0){s.locked=true;stopMixedTimer();s.wrong++;s.timeout++;s.miss.push({category:raw.category||"integrated",prompt:q.prompt,selected:"",correct:q.correct,reason:"timeout"});const cat=s.category[raw.category]||s.category.integrated;cat.t++;holder.querySelectorAll("button.choice").forEach(b=>{b.disabled=true;if(b.textContent===q.correct)b.classList.add("correctChoice")});const result=holder.querySelector(".result");if(result){result.style.display="";result.classList.add("bad");result.innerHTML=`<b>${tr("timeout")}</b> <span class="muted small">${tr("answer")}: ${q.correct}</span>`;}updateMixed();setTimeout(()=>{s.index++;renderCurrentMixed(d)},700)}},1000);
    }

    function renderMixed(d){
      const nv=(d.vocab||[]).length,ng=(d.grammar_questions||[]).length;
      document.getElementById("mixedHint").textContent=getLang()==="MN"?`Шалгалт бүрт ${nv} үгээс 8, дүрмээс 8, харилцан ярианаас 4 асуултыг шинээр сонгоно.`:`시험을 시작할 때마다 어휘 ${nv}개 중 8개, 문법 ${ng}개 중 8개, 통합 대화 4개를 새로 선택합니다.`;
      startMixed(d);
    }

    function makeLessonLabel(lessonRaw){
      const n = parseInt(String(lessonRaw || "").replace(/[^\d]/g,""), 10);
      if(Number.isFinite(n)) return `${n}과`;
      return lessonRaw ? String(lessonRaw) : "";
    }

    function pad2(lessonRaw){
      const n = parseInt(String(lessonRaw || "").replace(/[^\d]/g,""), 10);
      if(!Number.isFinite(n)) return "";
      return String(n).padStart(2, "0");
    }

    function passthroughQS(){
      const u = new URL(location.href);
      const p = new URLSearchParams();
      ["name","klass","token","lang"].forEach(k=>{
        const v = u.searchParams.get(k);
        if(v) p.set(k, v);
      });
      if(!p.get("lang")) p.set("lang", getLang());
      return p.toString();
    }

    function buildGrammarFileFromLesson(d){
      const level = (d && d.meta && d.meta.level) ? d.meta.level : (d && d.level) ? d.level : "";
      const lesson = (d && d.meta && d.meta.lesson) ? d.meta.lesson : (d && d.lesson) ? d.lesson : "";
      const nn = pad2(lesson);
      if(!level || !nn) return "";
      return `GRAM-SNU-${level}-lesson${nn}.html`;
    }

    function openGrammarQuiz(){
      // 아직 레슨 JSON 로드 전이면, 기존처럼 패널만 열어둠
      if(!LESSON){
        setActiveTab("grammar");
        return;
      }

      const file = buildGrammarFileFromLesson(LESSON);
      if(!file){
        setActiveTab("grammar");
        const gramDiv = document.getElementById("grammar");
        if(gramDiv) gramDiv.innerHTML = `<div class='muted'>${tr("grammarMissingFile")}</div>`;
        return;
      }

      const p = new URLSearchParams(passthroughQS());
      const dataPath = getParam("data");
      if(dataPath) p.set("data", dataPath);
      // 모든 과가 함께 사용하는 공통 문법 연습 화면으로 이동합니다.
      location.href = `../grammar/lesson.html?${p.toString()}`;
    }

    async function main(){
      applyTexts();

      document.getElementById("btnBack").addEventListener("click", ()=>{
        stopQuizTimer();
        const qs = passthroughQS();
        location.href = `./index.html${qs ? `?${qs}` : ""}`;
      });

      document.getElementById("tab-vocab").addEventListener("click", ()=>setActiveTab("vocab"));
      document.getElementById("tab-quiz").addEventListener("click", ()=>{setActiveTab("quiz");if(LESSON && !QUIZ_STATE) renderQuiz(LESSON);});
      document.getElementById("tab-grammar").addEventListener("click", openGrammarQuiz);
      document.getElementById("tab-mixed").addEventListener("click", ()=>setActiveTab("mixed"));
      document.getElementById("toggleVocabEditMode").addEventListener("click", ()=>{
        if(!CONTENT_EDITOR_CAN_EDIT)return;
        VOCAB_EDIT_MODE=!VOCAB_EDIT_MODE;updateContentEditorControls();
        if(LESSON){renderVocab(LESSON);if(document.getElementById("panel-quiz").classList.contains("active")&&QUIZ_STATE)renderCurrentQuizQuestion(LESSON);if(document.getElementById("panel-mixed").classList.contains("active")&&MIXED_STATE)renderCurrentMixed(LESSON);}
      });

      document.getElementById("tab-reading").addEventListener("click", ()=>{
        if(!LESSON) return;
        const raw=String((LESSON.meta&&LESSON.meta.lesson)||LESSON.lesson||"1");
        const n=Math.max(1,Math.min(16,parseInt(raw,10)||1));
        const level=String((LESSON.meta&&LESSON.meta.level)||LESSON.level||(n>=9?"1B":"1A"));
        const current=new URL(location.href);
        const p=new URLSearchParams();
        ["name","klass","token","lang"].forEach(k=>{const v=current.searchParams.get(k);if(v)p.set(k,v)});
        p.set("lesson",String(n));
        p.set("data",`../data/snu/${level}/reading/lesson${String(n).padStart(2,"0")}.json`);
        const source=current.searchParams.get("data");
        if(source) p.set("lessonData",source);
        location.href=`./reading.html?${p.toString()}`;
      });

      document.getElementById("btnLang").addEventListener("click", ()=>{
        const next = (getLang()==="KR") ? "MN" : "KR";
        setLang(next);
        const u = new URL(location.href);
        u.searchParams.set("lang", next);
        history.replaceState(null, "", u.toString());

        applyTexts();
        if(LESSON){
          renderVocab(LESSON);
          renderGrammar(LESSON);
          if(document.getElementById("panel-quiz").classList.contains("active")) renderQuiz(LESSON);
          renderMixed(LESSON);
        }
      });

      document.getElementById("btnMode").addEventListener("click", ()=>{
        QUIZ_MODE = (QUIZ_MODE==="KO2MN") ? "MN2KO" : "KO2MN";
        applyTexts();
        if(LESSON) renderQuiz(LESSON);
      });

      document.getElementById("btnTime7").addEventListener("click", ()=>{
        QUIZ_SECONDS=7; applyTexts(); if(LESSON) renderQuiz(LESSON);
      });
      document.getElementById("btnTime10").addEventListener("click", ()=>{
        QUIZ_SECONDS=10; applyTexts(); if(LESSON) renderQuiz(LESSON);
      });

      document.getElementById("btnNew").addEventListener("click", ()=>{
        if(LESSON) renderQuiz(LESSON);
      });

      document.getElementById("btnNewMixed").addEventListener("click", ()=>{
        if(LESSON) renderMixed(LESSON);
      });
      document.getElementById("btnMixed10").addEventListener("click", ()=>{
        MIXED_SECONDS=10;document.getElementById("btnMixed10").classList.add("active");document.getElementById("btnMixed15").classList.remove("active");if(LESSON)renderMixed(LESSON);
      });
      document.getElementById("btnMixed15").addEventListener("click", ()=>{
        MIXED_SECONDS=15;document.getElementById("btnMixed15").classList.add("active");document.getElementById("btnMixed10").classList.remove("active");if(LESSON)renderMixed(LESSON);
      });

      const dataPath = getParam("data");
      const title = document.getElementById("title");
      const subtitle = document.getElementById("subtitle");
      const status = document.getElementById("status");

      if(!dataPath){
        subtitle.textContent = "data 경로가 없습니다.";
        status.textContent = "오류";
        return;
      }

      const target = parseLessonDataTarget(dataPath);
      if(!target.ok){
        renderLessonInvalidAccess(target.error || "lesson_data_path_invalid");
        return;
      }

      try{
        status.textContent = "Loading...";
        subtitle.textContent = tr("loading");

        const res = await fetch(target.url, { cache:"no-store" });
        if(!res.ok) throw new Error("레슨 JSON 로드 실패: " + res.status);

        const d = await res.json();
        const level = String((d.meta && d.meta.level) ? d.meta.level : (d.level || "")).toUpperCase();
        const lessonRaw = (d.meta && d.meta.lesson) ? d.meta.lesson : (d.lesson || "");
        const actualLessonNo = parseInt(String(lessonRaw).replace(/[^0-9]/g,""),10);
        if(level !== target.level || actualLessonNo !== target.lessonNo){
          renderLessonInvalidAccess(`URL=${target.level}-${target.lessonNo}, DATA=${level || "?"}-${Number.isFinite(actualLessonNo) ? actualLessonNo : "?"}`);
          return;
        }

        LESSON = d;
        prepareVocabContentIds(d);
        prepareMixedContentIds(d);
        CONTENT_EDITOR_LOAD_PROMISE = Promise.all([loadVocabContentEditorState(d),loadMixedContentEditorState(d)]);
        const lesson = lessonRaw;
        const lessonLabel = makeLessonLabel(lesson);
        const tmn = d.title_mn || (d.meta && d.meta.title_mn) || "";

        title.textContent = `${level} ${lessonLabel}`.trim() || "레슨";
        subtitle.textContent = tmn || "";
        status.textContent = getLang()==="MN" ? "\u041d\u044d\u044d\u0445 \u044d\u0440\u0445\u0438\u0439\u0433 \u0448\u0430\u043b\u0433\u0430\u0436 \u0431\u0430\u0439\u043d\u0430..." : "\uC218\uAC15 \uAC00\uB2A5 \uC5EC\uBD80 \uD655\uC778 \uC911...";
        const access = await verifyLessonUnlocked(d);
        if(!access.allowed){
          renderLessonLocked(access, d);
          return;
        }

        if(CONTENT_EDITOR_LOAD_PROMISE)await CONTENT_EDITOR_LOAD_PROMISE;
        status.textContent = tr("loaded");
        renderVocab(d);
        renderGrammar(d);
        QUIZ_STATE = null;
        renderMixed(d);

      } catch(err){
        subtitle.textContent = "불러오기 오류: " + (err.message || err);
        status.textContent = "오류";
        console.log(err);
      }
    }

  main();
  </script>
</body>
</html>
