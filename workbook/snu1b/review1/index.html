<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07101f">
  <title>SNU 1B 워크북 복습 1 평가하기</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><span class="dot"></span><span class="brand-title">SNU 1B · 평가 9-10과</span></div>
      <div class="top-actions">
        <button id="backEvalBtn" class="top-nav-btn" type="button">← 평가</button>
        <button id="homeBtn" class="top-nav-btn home" type="button">홈</button>
        <div id="timer" class="timer">15:00</div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section id="startView" class="hero">
      <div class="info-grid">
        <div class="info">문항 수<b>20</b></div>
        <div class="info">제한 시간<b>15분</b></div>
        <div class="info">배점<b>20점</b></div>
      </div>
      <div class="start-actions">
        <button id="startBtn" class="primary" type="button">시험 시작</button>
        <button id="resetBtn" class="ghost" type="button">기존 임시기록 지우기</button>
      </div>
    </section>

    <section id="examView" class="hidden">
      <div class="card">
        <div class="progress-row"><div id="progressText" class="progress-text">1 / 20</div><div id="answeredCount" class="answered-count">응답 0/20</div></div>
        <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
        <div id="groupText" class="group"></div>
        <div id="contextBox" class="context hidden"></div>
        <div id="promptText" class="prompt"></div>
        <div id="imageWrap" class="question-image-wrap hidden"><img id="questionImage" class="question-image" alt=""></div>
        <div id="options" class="options"></div>
      </div>
    </section>

    <section id="resultView" class="hidden">
      <div class="result-card">
        <div class="eyebrow">시험 결과</div>
        <h1>9-10과</h1>
        <div id="resultContent"></div>
      </div>
    </section>
  </main>

  <nav class="navbar">
    <div class="navbar-inner">
      <button id="prevBtn" class="secondary" type="button">이전</button>
      <button id="navBtn" class="qnav-btn" type="button">문항</button>
      <button id="nextBtn" class="secondary" type="button">다음</button>
    </div>
  </nav>

  <div id="paletteModal" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-head"><h3>문항 이동</h3><button id="closePalette" class="close" type="button">닫기</button></div>
      <p class="modal-note">초록색은 답한 문항입니다. 번호를 누르면 바로 이동합니다.</p>
      <div id="palette" class="palette"></div>
    </div>
  </div>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
