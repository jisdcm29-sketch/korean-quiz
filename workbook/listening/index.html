<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07101f">
  <title>SNU 1A 듣기평가</title>
  <link rel="stylesheet" href="./listening.css?v=20261001-14">
  <script src="../../js/kq-session.js?v=20261001"></script>
  <script defer src="./listening.js?v=20261001-15"></script>
</head>
<body>
  <header><div class="top"><strong id="title">SNU 1A · 듣기평가</strong><button id="exit" type="button">나가기</button></div></header>
  <main>
    <section id="intro" class="card">
      <h1 id="range">1–2과</h1>
      <button id="start" class="primary" type="button">시작</button>
    </section>
    <section id="exam" class="card" hidden>
      <div id="progress" class="muted"></div>
      <h1 id="question" class="question-heading"><span id="questionNumber" class="question-number"></span><span id="questionPrompt"></span></h1>
      <div id="options" role="group" aria-label="답안 번호"></div>
      <button id="next" class="primary" type="button" disabled>다음 →</button>
    </section>
    <section id="submission" class="card" hidden>
      <h1 id="submitTitle">답안 제출</h1>
      <p id="submitMessage"></p>
      <button id="retry" class="primary" type="button">다시 제출</button>
    </section>
    <section id="result" class="card" hidden>
      <h1 id="resultTitle">듣기평가 결과</h1>
      <div id="score" class="score"></div>
      <p id="correct"></p>
      <p id="saved"></p>
      <button id="done" class="primary" type="button">평가 목록</button>
    </section>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
